<script>
/* ===== Outils partagés : encodage, compression, chiffrement, lecture adaptée ===== */
const DEMO_PUB = "BBV7nya4K8W0jyGJq2xtiK5E5na6CAB23qNAI5RJhVfhiQbRRt_g9vrYtbJ0Jnm7yGxny1celneAbJEpW6XDQBg";
const DEMO_CODE = "DEM-001";

const B64 = {
  enc(buf) {
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s = ""; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  },
  dec(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "=";
    const s = atob(str); const b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
};
const TE = new TextEncoder(), TD = new TextDecoder();

async function streamThrough(u8, stream) {
  const w = stream.writable.getWriter(); w.write(u8); w.close();
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}
/* Emballe un objet JSON : 1 octet de drapeau (1 = compressé) + données */
async function pack(obj) {
  const raw = TE.encode(JSON.stringify(obj));
  if (typeof CompressionStream !== "undefined") {
    try { const c = await streamThrough(raw, new CompressionStream("deflate-raw"));
      const out = new Uint8Array(c.length + 1); out[0] = 1; out.set(c, 1); return out; } catch (e) {}
  }
  const out = new Uint8Array(raw.length + 1); out[0] = 0; out.set(raw, 1); return out;
}
async function unpack(u8) {
  let body = u8.slice(1);
  if (u8[0] === 1) body = await streamThrough(body, new DecompressionStream("deflate-raw"));
  return JSON.parse(TD.decode(body));
}

/* Code d'activation patient : ACT1.<données> */
async function encodeActivation(cfg) { return "ACT1." + B64.enc(await pack(cfg)); }
async function decodeActivation(text) {
  const m = String(text).match(/ACT1\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("format");
  const cfg = await unpack(B64.dec(m[1]));
  if (!cfg || !cfg.c || !cfg.k) throw new Error("format");
  return cfg;
}

/* Chiffrement patient -> praticienne : ECDH P-256 éphémère + AES-GCM 256
   Message : PSY1.<clé éphémère (65 o) | iv (12 o) | données chiffrées> */
const ECDH = { name: "ECDH", namedCurve: "P-256" };
const AAD = TE.encode("PSY1");
async function encryptForPractitioner(pubB64, obj) {
  const pub = await crypto.subtle.importKey("raw", B64.dec(pubB64), ECDH, false, []);
  const eph = await crypto.subtle.generateKey(ECDH, true, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, eph.privateKey,
    { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: AAD }, key, await pack(obj)));
  const epk = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const out = new Uint8Array(65 + 12 + ct.length);
  out.set(epk, 0); out.set(iv, 65); out.set(ct, 77);
  return "PSY1." + B64.enc(out);
}
async function decryptMessage(privJwk, msg) {
  const m = String(msg).match(/PSY1\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("format");
  const all = B64.dec(m[1]);

}

    const q = qrcode(0, "M"); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 2, s = n + m * 2; let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${s} ${s}" width="${px}" height="${px}" role="img" aria-label="QR code vers l'application"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  } catch (e) { return ""; }
}

/* ---------- Graphiques (SVG à l'échelle) ---------- */
function timeChart({ series, min, max, ticks, from, to, kind = "line", h = 200, unit = "" }) {
  const W = 640, H = h, L = 36, R = 12, T = 12, B = 28;
  const t0 = from.getTime(), t1 = Math.max(to.getTime(), t0 + 864e5);
  const x = t => L + (W - L - R) * ((new Date(t).getTime() - t0) / (t1 - t0));
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  let g = "";
  ticks.forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${String(v).replace(".", ",")}${unit}</text>`; });
  const nT = 4; for (let i = 0; i <= nT; i++) { const t = t0 + (t1 - t0) * i / nT; g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === nT ? "end" : "middle"}">${fmtD(new Date(t).toISOString())}</text>`; }
  series.forEach(s => {
    const pts = s.pts.filter(p => p.v != null && new Date(p.t).getTime() >= t0).sort((a, b) => a.t < b.t ? -1 : 1);
    if (kind === "bar") {
      const bw = Math.max(3, Math.min(14, (W - L - R) / ((t1 - t0) / 864e5) * 0.6));
      pts.forEach(p => { g += `<rect x="${x(p.t) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, y(min) - y(p.v))}" rx="2" fill="${s.color}" opacity="0.85"><title>${fmtD(p.t)} : ${r1(p.v)}${unit}</title></rect>`; });
    } else {
      if (pts.length > 1 && !s.dotsOnly) g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ")}"/>`;
      pts.forEach((p, i) => { const last = i === pts.length - 1; g += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 5 : 3.2}" fill="${last ? s.color : "var(--surface)"}" stroke="${s.color}" stroke-width="2"><title>${fmtD(p.t)} : ${r1(p.v)}${unit}</title></circle>`; });
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function freqList(items, limit = 6) {
  const c = {}; items.forEach(i => c[i] = (c[i] || 0) + 1);
  const arr = Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, limit); if (!arr.length) return `<p class="muted small">Aucune donnée.</p>`;
  const mx = arr[0][1];
  return `<div class="freq">${arr.map(([k, n]) => `<div class="freq-row"><span>${esc(k)}</span><span class="bar" style="width:${(n / mx) * 100}%"></span><span class="n">${n}</span></div>`).join("")}</div>`;
}

function alerts(pt) {

}

  const hum = by("humeur"), en = hum.filter(e => e.energie != null), md = hum.filter(e => e.humeur);
  if (hum.length) lines.push(`Humeur du jour : ${pl(hum.length, "saisie")}${en.length ? `, énergie moyenne ${r1(avg(en.map(e => e.energie)))}/10` : ""}${md.length ? `, humeurs : ${Object.entries(md.reduce((c, e) => (c[MOOD_LABEL[e.humeur]] = (c[MOOD_LABEL[e.humeur]] || 0) + 1, c), {})).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${k} ×${n}`).join(", ")}` : ""}.`);
  const ag = by("angst"); if (ag.length) lines.push(`Questionnaire d'Angst : ${ag.map(e => `${fmtD(e.t)} ${e.total}/20`).join(", ")} (seuil > 10).`);
  const el = by("elan"); if (el.length) lines.push(`Suivi de l'élan : ${el.map(e => `${fmtD(e.t)} ${e.oui}/10${elanFlag(e) ? " à explorer" : ""}`).join(", ")}.`);
  const rep = by("repas"); if (rep.length) lines.push(`Repas : ${rep.filter(e => e.slot !== "grig").length} repas notés dont ${rep.filter(e => e.pris === false).length} non pris, ${rep.filter(e => e.slot === "grig").length} grignotages, perte de contrôle ×${rep.filter(e => e.ctrl === "Oui").length}, compensations ×${rep.flatMap(e => e.comp || []).length}.`);
  const env = by("envie"); if (env.length) lines.push(`Envies de crise : ${env.length} (${env.filter(e => e.issue === "J'ai fait une crise").length} avec crise).`);
  const ang = by("angoisse"); if (ang.length) lines.push(`Crises d'angoisse : ${ang.length}, pic moyen ${r1(avg(ang.map(e => e.pic)))}/10.`);
  const sud = by("sud"); if (sud.length) lines.push(`Malaise (SUD) : ${pl(sud.length, "saisie")}, moyenne ${r1(avg(sud.map(e => e.sud)))}/10.`);
  const som = by("sommeil"); if (som.length) lines.push(`Sommeil : ${som.length} nuits, durée moyenne ${r1(avg(som.map(sleepHours).filter(x => x != null)))} h, qualité moyenne ${r1(avg(som.map(e => e.qualite).filter(Boolean)))}/5.`);
  const jau = by("jauge"); if (jau.length) lines.push(`Jauge sensorielle : ${pl(jau.length, "saisie")}, ${jau.filter(e => e.niveau >= 4).length} au niveau 4 ou 5.`);
  lines.push("", "Détail :");
  list.forEach(e => lines.push(`- ${fmtDT(e.t)} · ${TYPE_LABEL[e.type] || e.type} · ${entryText(e)}`));
  return lines.join("\n");
}
function mountDetail(pt, p) {
  if (!pt) return;
  if (p.del) { document.getElementById("delYes").onclick = async () => { if (relayOn()) { try { await relay(vault.relay, { a: "delcfg", token: vault.token, code: pt.code }); } catch (e) {} } delete vault.patients[pt.code]; await persist(); nav("patients"); }; return; }
  document.querySelectorAll('.chips[data-name="per"] .chip').forEach(b => b.addEventListener("picked", () => nav("patients", { code: pt.code, per: b.dataset.v })));
  const cr = document.getElementById("cr");
  cr.onclick = async () => {
    const txt = report(pt, p.per || "30");
    if (!(await copyText(txt, cr))) { cr.insertAdjacentHTML("afterend", `<textarea id="crTxt" style="min-height:200px;margin-top:8px">${esc(txt)}</textarea>`); selectAll(document.getElementById("crTxt")); }
  };
}

/* Recevoir */
PAGES.recevoir = () => `<div class="head-row"><div><h1>Recevoir des réponses</h1></div></div>
  <div class="split">
    <div class="card stack"><h3>Réception directe</h3>
      ${relayOn() ? `<p class="small">Les réponses envoyées par vos patients attendent, chiffrées, dans votre relais Google. Elles sont relevées automatiquement à chaque ouverture de votre espace.${vault.lastFetch ? ` Dernier relevé : ${fmtDT(vault.lastFetch)}.` : ""}</p>
        <button class="btn" id="fetch">Relever maintenant</button><div id="fres"></div>`
      : `<p class="small">${demo ? "Non disponible en démonstration." : "Pas encore configurée."}</p>${demo ? "" : `<button class="btn soft" data-nav="reglages" data-p='{"guide":true}'>Configurer la réception directe</button>`}`}</div>
    <div class="card stack"><h3>Coller un message</h3>
      <p class="small">Pour un message reçu par mail ou SMS (il commence par PSY1.). Vous pouvez coller le mail entier.</p>
      <textarea id="inbox" class="mono" style="min-height:160px" placeholder="PSY1.…" spellcheck="false"></textarea>
      <button class="btn soft" id="dec">Déchiffrer et ajouter</button><div class="stack" id="results"></div></div></div>`;
MOUNTS.recevoir = () => {
  const f = document.getElementById("fetch");
  if (f) f.onclick = async () => { f.disabled = true; f.textContent = "Relevé…"; const out = document.getElementById("fres");
    try { const res = await fetchInbox(); out.innerHTML = `<p class="result">${inboxSummary(res)}</p>`; }
    catch (e) { out.innerHTML = `<p class="result err">${esc(e.detail || "Le relais ne répond pas. Vérifier la connexion.")}</p>`; }
    f.disabled = false; f.textContent = "Relever maintenant"; };
  document.getElementById("dec").onclick = async () => {
    const msgs = document.getElementById("inbox").value.match(/PSY1\.[A-Za-z0-9_-]+/g) || [], out = [];
    if (!msgs.length) out.push(`<div class="result err">Aucun message PSY1 trouvé dans le texte collé.</div>`);
    for (const m of msgs) {
      try {
        const r = await importData(await decryptMessage(vault.priv, m));
        if (r.err) { out.push(`<div class="result err">Message du code <b>${esc(spaced(r.code))}</b> : ce patient n'existe pas dans votre espace.</div>`); continue; }
        out.push(`<div class="result"><b>${esc(r.pt.label || r.pt.code)}</b> : ${r.n} nouvelle${r.n > 1 ? "s" : ""} réponse${r.n > 1 ? "s" : ""}${r.dup ? `, ${r.dup} déjà reçue${r.dup > 1 ? "s" : ""}` : ""}. <button class="link" data-nav="patients" data-p='{"code":"${r.pt.code}"}'>Voir la fiche</button></div>`);
      } catch (e) { out.push(`<div class="result err">Un message n'a pas pu être déchiffré : il est incomplet, ou il a été chiffré pour un autre espace.</div>`); }
    }
    await persist();
    document.getElementById("results").innerHTML = out.join("");
    if (msgs.length) document.getElementById("inbox").value = "";
  };
};

/* Réglages et guide du relais */
const GUIDE = [
  ["Créer la feuille Google", "Avec votre compte Gmail, ouvrir <b>sheets.google.com</b> et créer une feuille vierge. La renommer « Entre-Séances relais »."],
  ["Ouvrir l'éditeur de script", "Dans la feuille : menu <b>Extensions</b>, puis <b>Apps Script</b>. Un nouvel onglet s'ouvre."],
  ["Coller le code", "Effacer tout le texte présent, coller le code (bouton « Copier le code » ci-dessous), puis cliquer sur l'icône <b>Enregistrer</b> (disquette)."],
  ["Accorder les autorisations", "En haut, choisir la fonction <b>autoriser</b> puis cliquer <b>Exécuter</b>. Accepter avec votre compte. Si Google affiche « Google n'a pas validé cette application » : <b>Paramètres avancés</b>, puis <b>Accéder à Entre-Séances relais</b>. C'est votre propre script."],
  ["Déployer", "Bouton bleu <b>Déployer</b> → <b>Nouveau déploiement</b> → roue dentée → <b>Application Web</b>. Exécuter en tant que : <b>Moi</b>. Qui a accès : <b>Tout le monde</b>. Cliquer <b>Déployer</b>."],
  ["Connecter votre espace", "Copier l'<b>URL de l'application Web</b> (elle finit par /exec), la coller dans le champ ci-dessous et cliquer <b>Connecter</b>."],
  ["Relier l'application patient", "Sur GitHub, ouvrir le fichier <b>config.js</b>, cliquer sur le crayon, coller la même adresse entre les guillemets, puis <b>Commit changes</b>."]
];
PAGES.reglages = p => {
  if (p.wipe) return `<div class="card stack danger-zone" style="max-width:560px"><h2>Supprimer tout l'espace ?</h2>
    <p>Patients, réponses, photos et clé de déchiffrement seront effacés de cet appareil. Les messages déjà envoyés par vos patients ne pourront plus être lus, sauf si vous restaurez une sauvegarde.</p>
    <div class="row"><button class="btn help" id="wipeYes">Tout supprimer</button><button class="btn ghost" data-nav="reglages">Annuler</button></div></div>`;
  const relayCard = `<div class="card stack"><h3>Réception directe</h3>
      ${relayOn() ? `<p class="result">Connectée. Les patients entrent un code à 6 caractères et leurs réponses arrivent ici automatiquement.</p>` : `<p class="small">Permet les codes courts et l'envoi direct des réponses. Gratuit, avec votre compte Gmail. Google ne stocke que des messages chiffrés, illisibles sans votre clé.</p>`}
      ${demo ? `<p class="notice">Indisponible en démonstration.</p>` : `<div><label class="lbl" for="rurl">Adresse du relais (Apps Script)</label><input type="text" id="rurl" value="${esc(vault.relay || "")}" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <button class="btn ${relayOn() ? "soft" : ""}" id="conn" style="align-self:flex-start">${relayOn() ? "Reconnecter" : "Connecter"}</button><p class="hint" id="cMsg" role="status"></p>
      <button class="link" data-nav="reglages" data-p='{"guide":true}'>Guide pas à pas</button>`}</div>`;
  if (p.guide) return `<button class="link" data-nav="reglages">← Réglages</button><div class="head-row"><div><h1>Configurer la réception directe</h1><p class="muted">Une seule fois, environ 10 minutes, depuis un ordinateur.</p></div></div>
    <div class="split"><ol class="guide">${GUIDE.map(([t, d]) => `<li><b>${t}</b><p>${d}</p></li>`).join("")}</ol>
    <div class="stack"><div class="card stack"><h3>Code du relais</h3><textarea id="gs" class="mono" readonly style="min-height:200px">${esc(RELAIS_GS)}</textarea><button class="btn" id="cpGs">Copier le code</button></div>${relayCard}</div></div>`;
  const cfgLine = `window.ES_RELAIS = "${vault.relay || ""}";`;
  const diagCard = relayOn() ? `<div class="card stack"><h3>Vérifier la liaison</h3>
      <p class="small">Le fichier <b>config.js</b> du site doit contenir exactement cette ligne (copiez-la et remplacez toute la ligne existante sur GitHub) :</p>
      <textarea id="cfgl" class="mono" readonly style="min-height:70px">${esc(cfgLine)}</textarea>
      <div class="row"><button class="btn soft" id="cpCfg">Copier la ligne</button><button class="btn" id="diag">Lancer la vérification</button></div>
      <div id="diagOut" class="stack"></div>
      ${(vault.failed || []).length ? `<p class="notice small">${vault.failed.length} message(s) n'ont pas pu être ajoutés : ${vault.failed.slice(-5).map(f => `${spaced(f.code)} (${f.why})`).join(" ; ")}.</p>` : ""}
      <button class="link" id="reread">Relire tous les messages du relais depuis le début</button></div>` : "";
  return `<div class="head-row"><h1>Réglages</h1></div>
  <div class="split">
    ${relayCard}${diagCard}
    <div class="card stack"><h3>Informations transmises aux patients</h3>
      <div><label class="lbl" for="url">Lien de l'application patient</label><input type="text" id="url" value="${esc(vault.appUrl || "")}" placeholder="https://…"><p class="hint">Sert au QR code et au message d'invitation.</p></div>
      <div><label class="lbl" for="em">Adresse mail (envoi manuel de secours)</label><input type="text" id="em" value="${esc(vault.email)}"></div>
      <button class="btn soft" id="saveS" style="align-self:flex-start">Enregistrer</button><p class="hint" id="sMsg" role="status"></p></div>
    <div class="card stack"><h3>Sauvegarde</h3>
      <p class="small">Copie chiffrée de tout votre espace (patients, réponses, connexion au relais), protégée par votre mot de passe. Les photos ne sont pas incluses : enregistrez celles à garder dans le dossier du patient. Refaites la sauvegarde après chaque relevé important.</p>
      ${demo ? `<p class="notice">Indisponible en démonstration.</p>` : `<button class="btn" id="bk">Générer la sauvegarde</button><textarea id="bkTxt" class="mono" readonly hidden style="min-height:120px"></textarea>`}
      <h3 style="margin-top:8px">Sécurité</h3>
      <p class="small">L'espace se verrouille après ${LOCK_MIN} minutes sans activité. Empreinte de votre clé publique : <span class="mono">${esc(vault.pub.slice(0, 16))}…</span></p>
      ${demo ? "" : `<button class="link" data-nav="reglages" data-p='{"wipe":true}'>Supprimer tout l'espace de cet appareil</button>`}</div>
  </div>`;
};
MOUNTS.reglages = p => {
  if (p.wipe) { document.getElementById("wipeYes").onclick = () => { lsDel(VKEY); try { indexedDB.deleteDatabase("es_pro_photos"); } catch (e) {} lock(); }; return; }
  const gs = document.getElementById("cpGs"); if (gs) gs.onclick = async e => { const t = document.getElementById("gs"); if (!(await copyText(RELAIS_GS, e.currentTarget))) selectAll(t); };
  const conn = document.getElementById("conn");
  if (conn) conn.onclick = async () => {
    const m = document.getElementById("cMsg"); conn.disabled = true; m.textContent = "Connexion…";
    const err = await connectRelay(document.getElementById("rurl").value);
    conn.disabled = false;
    if (err) { m.textContent = err; return; }
    flash = "Réception directe connectée. Les exercices de vos patients ont été publiés. Dernière étape : coller la même adresse dans config.js sur GitHub."; nav("reglages");
  };
  const cc = document.getElementById("cpCfg"); if (cc) cc.onclick = async e => { const t = document.getElementById("cfgl"); if (!(await copyText(t.value, e.currentTarget))) selectAll(t); };
  const rr = document.getElementById("reread");
  if (rr) rr.onclick = async () => { rr.textContent = "Relecture…"; vault.cursor = 0; try { flash = inboxSummary(await fetchInbox()); } catch (e) { flash = e.detail || "Le relais ne répond pas."; } nav("reglages"); };
  const dg = document.getElementById("diag");
  if (dg) dg.onclick = async () => {
    const out = document.getElementById("diagOut"), line = (ok, t) => `<p class="small">${ok ? "✔" : "✖"} ${t}</p>`;
    dg.disabled = true; out.innerHTML = `<p class="small">Vérification…</p>`; let h = "";
    try {
      const pg = await relay(vault.relay, { a: "ping" }); h += line(!!pg.ok, "Le relais répond.");
      if (pg.sheet === false) h += line(false, "Le relais n'arrive pas à utiliser sa feuille Google : " + esc(pg.why) + ". Dans Apps Script, exécuter la fonction « autoriser », puis publier une nouvelle version.");
      else if (pg.sheet === undefined) h += line(false, "Le code du relais est ancien : le remplacer par celui du guide, puis Déployer → Gérer les déploiements → crayon → Nouvelle version.");
      else h += line(true, "Le relais peut ranger les messages.");
      const ck = await relay(vault.relay, { a: "check", token: vault.token }); h += line(!!ck.ok, ck.ok ? "Votre espace est bien le propriétaire du relais." : "Ce relais appartient à un autre espace (clé différente).");
      let pubOk = 0, pubKo = [];
      for (const pt of Object.values(vault.patients)) { (await publishCfg(pt)) ? pubOk++ : pubKo.push(spaced(pt.code)); }
      h += line(!pubKo.length, `Exercices publiés pour ${pubOk} patient(s)${pubKo.length ? ", échec pour " + pubKo.join(", ") : ""}.`);
      const ib = await relay(vault.relay, { a: "inbox", token: vault.token, since: 0 }, 120000);
      if (ib.ok) {
        const codes = {}; ib.items.forEach(it => codes[it.code] = (codes[it.code] || 0) + 1);
        h += line(true, `${ib.items.length} message(s) stocké(s) dans le relais${ib.items.length ? " : " + Object.entries(codes).map(([c, n]) => `${spaced(c)} ×${n}${vault.patients[c] ? "" : " (code inconnu ici)"}`).join(", ") : ""}.`);
        if (!ib.items.length) h += `<p class="notice small">Aucun message n'est arrivé au relais : le problème se situe côté application patient. Vérifiez le fichier config.js (ligne ci-dessus), puis sur le téléphone du patient : Réglages → Liaison avec la psychologue → Vérifier la liaison.</p>`;
        const pending = ib.items.filter(it => it.seq > (vault.cursor || 0)).length;
        if (pending) h += line(false, `${pending} message(s) pas encore relevé(s) : utiliser « Relever les réponses ».`);
      }
    } catch (e) { h += line(false, esc(e.detail || "Relais injoignable.")); }
    out.innerHTML = h; dg.disabled = false;
  };
  const ss = document.getElementById("saveS");
  if (ss) ss.onclick = async () => { vault.email = document.getElementById("em").value.trim(); vault.appUrl = document.getElementById("url").value.trim().replace(/\/+$/, ""); await persist(); for (const pt of Object.values(vault.patients)) await publishCfg(pt); document.getElementById("sMsg").textContent = demo ? "Enregistré pour cette démonstration." : "Enregistré."; };
  const bk = document.getElementById("bk");
  if (bk) bk.onclick = async () => { await persist(); const t = document.getElementById("bkTxt"); t.hidden = false; t.value = "SAUV1." + B64.enc(TE.encode(JSON.stringify(lsGet(VKEY)))); if (!(await copyText(t.value, bk))) selectAll(t); };
};

render();
</script>
