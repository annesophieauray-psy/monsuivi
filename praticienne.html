/* ===== Outils partagés : encodage, compression, chiffrement, lecture adaptée ===== */

const B64 = {
  enc(buf) {
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s = ""; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  },
  dec(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/"); while (str.length % 4) str += "=";
    const s = atob(str); const b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
};
const TE = new TextEncoder(), TD = new TextDecoder();

async function streamThrough(u8, stream) {
  const w = stream.writable.getWriter(); w.write(u8); w.close();
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}
/* Emballe un objet JSON : 1 octet de drapeau (1 = compressé) + données */
async function pack(obj) {
  const raw = TE.encode(JSON.stringify(obj));
  if (typeof CompressionStream !== "undefined") {
    try { const c = await streamThrough(raw, new CompressionStream("deflate-raw"));
      const out = new Uint8Array(c.length + 1); out[0] = 1; out.set(c, 1); return out; } catch (e) {}
  }

/* Chiffrement patient -> praticienne : ECDH P-256 éphémère + AES-GCM 256
   Message : PSY1.<clé éphémère (65 o) | iv (12 o) | données chiffrées> */
const ECDH = { name: "ECDH", namedCurve: "P-256" };

  const pub = await crypto.subtle.importKey("raw", B64.dec(pubB64), ECDH, false, []);
  const eph = await crypto.subtle.generateKey(ECDH, true, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, eph.privateKey,
    { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: AAD }, key, await pack(obj)));
  const epk = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));

  out.set(epk, 0); out.set(iv, 65); out.set(ct, 77);

async function decryptMessage(privJwk, msg) {
  const m = String(msg).match(/PSY1\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("format");
  const all = B64.dec(m[1]);
  const priv = await crypto.subtle.importKey("jwk", privJwk, ECDH, false, ["deriveKey"]);
  const epk = await crypto.subtle.importKey("raw", all.slice(0, 65), ECDH, false, []);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: epk }, priv,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(65, 77), additionalData: AAD }, key, all.slice(77));
  return unpack(new Uint8Array(pt));
}

/* ===== Lecture adaptée : découpage syllabique et lettres muettes (approximation) ===== */
const VOY = "aeiouyàâäéèêëîïôöùûüÿœæ";
const isVoy = c => VOY.includes(c);
const INSEP = /^(bl|br|cl|cr|dr|fl|fr|gl|gr|pl|pr|tr|vr|ch|ph|gn|th|qu|gu)$/;
function syllabes(word) {
  const w = word.toLowerCase(), n = w.length;
  if (n <= 3) return [word];
  const v = [];
  for (let i = 0; i < n; i++) {
    let x = isVoy(w[i]);
    if (w[i] === "u" && i > 0 && (w[i - 1] === "q" || (w[i - 1] === "g" && i + 1 < n && "eiéèêy".includes(w[i + 1])))) x = false;
    v.push(x);
  }
  const nuc = []; let i = 0;
  while (i < n) { if (v[i]) { let j = i; while (j + 1 < n && v[j + 1]) j++; nuc.push([i, j]); i = j + 1; } else i++; }
  if (nuc.length < 2) return [word];
  const cuts = [];
  for (let k = 0; k < nuc.length - 1; k++) {
    const a = nuc[k][1] + 1, b = nuc[k + 1][0], cl = w.slice(a, b), L = cl.length;
    const ins = L >= 2 && INSEP.test(cl.slice(-2));
    cuts.push(L === 1 ? a : L === 2 ? (ins ? a : a + 1) : (ins ? b - 2 : b - 1));
  }
  const out = []; let p = 0;
  for (const c of cuts) { out.push(word.slice(p, c)); p = c; }
  out.push(word.slice(p));
  return out.filter(Boolean);
}
const EXC_S = new Set("bus sens fils os ours mars tennis virus bonus autobus hélas maïs oasis jadis atlas cactus campus processus cosmos iris lys bis gratis express rébus tournevis métis stress as hiatus fœtus terminus détritus".split(" "));
const EXC_X = new Set("six dix index fax box relax max lynx thorax larynx silex".split(" "));
const EXC_T = new Set("net sept huit but brut ouest chut mat rapt transit scout kit flirt short test toast compost internet granit dot zut est-ce".split(" "));
const EXC_D = new Set("sud bled raid stand weekend lord".split(" "));
const EXC_P = new Set("cap stop top hip slip clip handicap ketchup cep".split(" "));
const EXC_Z = new Set("gaz quiz fez jazz".split(" "));
const EXC_R = new Set("hiver enfer super cancer laser amer hamster poster revolver starter master leader scooter reporter joker poker bunker cuiller hier fier cher mer fer ver".split(" "));
const EXC_E = new Set("le je me te se ce de ne que".split(" "));
function lettresMuettes(word) {
  const w = word.toLowerCase(), n = w.length, set = new Set();
  if (n >= 2 && w[0] === "h" && isVoy(w[1])) set.add(0);
  if (n < 2) return set;
  let idx = n - 1, steps = 0, lastWasE = false;
  while (idx > 0 && steps < 3) {
    const c = w[idx], prev = w[idx - 1];
    let mute = false;
    if (steps === 0) {
      if (c === "s" && prev !== "s" && !EXC_S.has(w)) mute = true;
      else if (c === "x" && !EXC_X.has(w)) mute = true;
    }
    if (!mute && c === "e" && !lastWasE && idx >= 2 && !EXC_E.has(w.slice(0, idx + 1)) && (steps === 0 || w[idx + 1] === "s")) mute = true;
    else if (!mute && steps <= 1 && !lastWasE) {
      if (c === "t" && !EXC_T.has(w) && (isVoy(prev) || "ncps".includes(prev))) mute = true;
      else if (c === "d" && !EXC_D.has(w) && (isVoy(prev) || "nr".includes(prev))) mute = true;
      else if (c === "p" && !EXC_P.has(w) && (isVoy(prev) || "m".includes(prev))) mute = true;
      else if (c === "z" && !EXC_Z.has(w) && isVoy(prev)) mute = true;
      else if (c === "r" && prev === "e" && n >= 5 && steps === 0 && !EXC_R.has(w)) mute = true;
    }
    if (!mute) break;
    set.add(idx); lastWasE = c === "e"; idx--; steps++;
    if (lastWasE) break;
  }
  return set;
}
/* Applique la mise en couleur dans un conteneur */
function adapterTexte(root, opts) {
  if (!opts || (!opts.syl && !opts.muet)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = node.parentElement;
      if (!p || p.closest("textarea,input,select,svg,script,style,.no-lis,code")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  let alt = 0;
  for (const node of nodes) {
    const parts = node.nodeValue.split(/([A-Za-zÀ-ÖØ-öø-ÿœŒæÆ]+)/);
    if (parts.length === 1) continue;
    const frag = document.createDocumentFragment();
    for (let k = 0; k < parts.length; k++) {
      const part = parts[k];
      if (!part) continue;
      if (k % 2 === 0) { frag.appendChild(document.createTextNode(part)); continue; }
      const muettes = opts.muet ? lettresMuettes(part) : new Set();
      const syls = opts.syl ? syllabes(part) : [part];
      const wspan = document.createElement("span"); wspan.className = "mot";
      let pos = 0;
      for (const s of syls) {
        const sp = document.createElement("span");
        if (opts.syl) sp.className = "syl s" + (alt++ % 2);
        for (let c = 0; c < s.length; c++) {
          if (muettes.has(pos + c)) { const m = document.createElement("span"); m.className = "muet"; m.textContent = s[c]; sp.appendChild(m); }
          else sp.appendChild(document.createTextNode(s[c]));
        }
        pos += s.length; wspan.appendChild(sp);
      }
      frag.appendChild(wspan);
    }
    node.parentNode.replaceChild(frag, node);
  }
}

async function relay(url, body, ms = 20000) {
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), ms) : 0;
  try {
    const r = await fetch(url, { method: "POST", body: JSON.stringify(body), redirect: "follow", signal: ctl ? ctl.signal : undefined });
    const txt = await r.text();
    try { return JSON.parse(txt); }
    catch (e) {
      const why = /<title>([^<]*)<\/title>/i.exec(txt);
      const err = new Error("reponse"); err.detail = `Réponse inattendue du relais (code ${r.status}${why ? ", « " + why[1].trim() + " »" : ""}).`; throw err;
    }
  } catch (e) {
    if (!e.detail) e.detail = e.name === "AbortError" ? "Le relais n'a pas répondu à temps." : "Relais injoignable : pas de connexion internet, adresse incorrecte, ou accès du déploiement différent de « Tout le monde ».";
    throw e;
  } finally { clearTimeout(t); }
}
/* Réduit une photo (≤ 900 px, JPEG) pour l'envoi */
function shrinkPhoto(file, max = 900, q = 0.62) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}

const PhotoDB = {
  db: null,
  open(name) {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(name, 1);
        r.onupgradeneeded = () => r.result.createObjectStore("p");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async op(name, mode, fn) {
    const db = await this.open(name);
    return new Promise((res, rej) => { const tx = db.transaction("p", mode); const st = tx.objectStore("p"); const rq = fn(st); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); });
  },
  put(name, k, v) { return this.op(name, "readwrite", st => st.put(v, k)); },
  get(name, k) { return this.op(name, "readonly", st => st.get(k)); },
  del(name, k) { return this.op(name, "readwrite", st => st.delete(k)); }
};

    vault.token = token; vault.cursor = 0;
  } else {
    if (!vault.token) return "Ce relais est déjà relié à un autre espace. Restaurer la sauvegarde de cet espace, ou créer un nouveau relais.";
    r = await relay(url, { a: "check", token: vault.token });
    if (!r.ok) return "Ce relais est relié à un autre espace.";
  }
  vault.relay = url; await persist();
  for (const pt of Object.values(vault.patients)) await publishCfg(pt);
  return null;
}

/* ---------- QR code (bibliothèque qrcode-generator) ---------- */
function qrSvg(text, px = 220) {
  if (typeof qrcode === "undefined" || !text) return "";
  try {
    const q = qrcode(0, "M"); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 2, s = n + m * 2; let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${s} ${s}" width="${px}" height="${px}" role="img" aria-label="QR code vers l'application"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  } catch (e) { return ""; }
}

/* ---------- Graphiques (SVG à l'échelle) ---------- */
function timeChart({ series, min, max, ticks, from, to, kind = "line", h = 200, unit = "" }) {
  const W = 640, H = h, L = 36, R = 12, T = 12, B = 28;
  const t0 = from.getTime(), t1 = Math.max(to.getTime(), t0 + 864e5);
  const x = t => L + (W - L - R) * ((new Date(t).getTime() - t0) / (t1 - t0));
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  let g = "";
  ticks.forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${String(v).replace(".", ",")}${unit}</text>`; });
  const nT = 4; for (let i = 0; i <= nT; i++) { const t = t0 + (t1 - t0) * i / nT; g += `<text x="${x(t)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === nT ? "end" : "middle"}">${fmtD(new Date(t).toISOString())}</text>`; }
  series.forEach(s => {
    const pts = s.pts.filter(p => p.v != null && new Date(p.t).getTime() >= t0).sort((a, b) => a.t < b.t ? -1 : 1);
    if (kind === "bar") {
      const bw = Math.max(3, Math.min(14, (W - L - R) / ((t1 - t0) / 864e5) * 0.6));
      pts.forEach(p => { g += `<rect x="${x(p.t) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, y(min) - y(p.v))}" rx="2" fill="${s.color}" opacity="0.85"><title>${fmtD(p.t)} : ${r1(p.v)}${unit}</title></rect>`; });
    } else {
      if (pts.length > 1 && !s.dotsOnly) g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ")}"/>`;
      pts.forEach((p, i) => { const last = i === pts.length - 1; g += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 5 : 3.2}" fill="${last ? s.color : "var(--surface)"}" stroke="${s.color}" stroke-width="2"><title>${fmtD(p.t)} : ${r1(p.v)}${unit}</title></circle>`; });
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function freqList(items, limit = 6) {
  const c = {}; items.forEach(i => c[i] = (c[i] || 0) + 1);
  const arr = Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, limit); if (!arr.length) return `<p class="muted small">Aucune donnée.</p>`;
  const mx = arr[0][1];
  return `<div class="freq">${arr.map(([k, n]) => `<div class="freq-row"><span>${esc(k)}</span><span class="bar" style="width:${(n / mx) * 100}%"></span><span class="n">${n}</span></div>`).join("")}</div>`;
}

let polling = false, pollN = 0;
async function poll() {
  if (polling || !relayOn() || document.visibilityState !== "visible") return;
  polling = true;
  try {
    pollN = (pollN || 0) + 1;
    let syncNote = "";
    if (pollN % 5 === 0) { try { syncNote = syncSummary(await syncVault()); } catch (e) {} }
    let res = await fetchInbox();
    if (res.unknown && res.unknown.length) { try { syncNote = syncSummary(await syncVault()) || syncNote; const rr = await rereadFailed(); if (rr) res = Object.assign({}, rr, { n: res.n + rr.n }); } catch (e) {} }
    if (syncNote) flash = syncNote;
    if (res.n || (res.unknown && res.unknown.length) || res.bad || syncNote) {
      flash = [syncNote, res.n || (res.unknown && res.unknown.length) || res.bad ? inboxSummary(res) : ""].filter(Boolean).join(" ");
      const safe = view.tab !== "reglages" && !view.p.edit && !view.p.act && view.tab !== "recevoir";
      if (safe) render();
    }
  } catch (e) {} finally { polling = false; }
}
setInterval(poll, 120000);
document.addEventListener("visibilitychange", poll);
async function afterUnlock() {
  touch(); nav("patients");
  const notes = [];
  if (relayOn()) { try { const s = await syncVault(); const t = syncSummary(s); if (t) notes.push(t); } catch (e) { if (e.detail) notes.push(e.detail); } }
  try { await ensureVapid(); } catch (e) {}
  try { await pushVapid(); } catch (e) {}
  if (relayOn()) {
    try { const res = await fetchInbox(); if (res.n || (res.unknown && res.unknown.length)) notes.push(inboxSummary(res)); } catch (e) {}
    try { const rr = await rereadFailed(); if (rr && rr.n) notes.push("Messages récupérés : " + inboxSummary(rr)); } catch (e) {}
  }
  if (notes.length) { flash = notes.join(" "); if (view.tab === "patients" && !view.p.code && !view.p.edit && !view.p.act) render(); }
}

/* ---------- Synchronisation de l'espace entre appareils ----------
   La copie stockée dans le relais est chiffrée avec une clé dérivée de votre clé privée :
   seuls vos appareils (restaurés depuis la même sauvegarde) peuvent la lire. */
let syncing = false, syncTimer = null;
async function syncKey() {
  const h = await crypto.subtle.digest("SHA-256", TE.encode("entre-seances/sync/v1/" + vault.priv.d));
  return crypto.subtle.importKey("raw", h, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);

}

const stamp = o => (o && (o.updated || o.created)) || "";

function mergeVault(L, R) {

  L.deleted = Object.assign({}, R.deleted || {}, L.deleted || {});
  for (const [c, t] of Object.entries(R.deleted || {})) if (!L.deleted[c] || t > L.deleted[c]) L.deleted[c] = t;
  L.patients = L.patients || {};
  for (const [code, rp] of Object.entries(R.patients || {})) {
    const del = L.deleted[code];
    const lp = L.patients[code];
    if (!lp) {
      if (del && del >= stamp(rp)) continue;
      L.patients[code] = JSON.parse(JSON.stringify(rp)); res.added.push(rp.label || code); res.entries += (rp.entries || []).length; continue;
    }
    if (stamp(rp) > stamp(lp)) { for (const k of ["label", "tv", "mods", "hier", "tca", "cx", "tx", "updated"]) if (k in rp) lp[k] = rp[k]; res.updated++; }
    const ids = new Set((lp.entries || []).map(e => e.id));
    for (const e of rp.entries || []) if (!ids.has(e.id)) { lp.entries.push(e); res.entries++; }
    lp.entries.sort((a, b) => a.t < b.t ? -1 : 1);
    const mm = {}; for (const m of (lp.msgs || []).concat(rp.msgs || [])) { const x = mm[m.id]; mm[m.id] = x ? Object.assign({}, x, m, { lu: x.lu || m.lu }) : m; }
    lp.delMsgs = [...new Set((lp.delMsgs || []).concat(rp.delMsgs || []))];
    lp.msgs = Object.values(mm).filter(m => !lp.delMsgs.includes(m.id)).sort((a, b) => a.t < b.t ? -1 : 1);
    if ((rp.lastImport || "") > (lp.lastImport || "")) lp.lastImport = rp.lastImport;

  for (const [id, t] of Object.entries(L.deletedCx)) if (L.cx[id] && t >= stamp(L.cx[id])) delete L.cx[id];

}
/* Tire la copie du relais, fusionne, renvoie la version fusionnée. Gère les conflits entre deux appareils. */
async function syncVault() {
  if (!relayOn() || syncing) return null;
  syncing = true;
  try {
    let summary = { added: [], updated: 0, entries: 0, vapidChanged: false };
    for (let i = 0; i < 4; i++) {
      const r = await relay(vault.relay, { a: "vget", token: vault.token }, 60000);
      if (!r.ok) { const e = new Error("vget"); e.detail = r.err === "action" ? "Votre relais Google n'est pas à jour : remplacer son code par la version 5 (Réglages → Guide), puis publier une nouvelle version." : "Synchronisation impossible (" + (r.err || "?") + ")."; throw e; }
      if (r.blob) {
        let remote;
        try { remote = await openVaultBlob(r.blob); } catch (e) { const er = new Error("cle"); er.detail = "La copie du relais appartient à un autre espace (clé différente). Restaurer sur cet appareil la sauvegarde de l'appareil principal."; throw er; }
        if (remote.pub !== vault.pub) { const er = new Error("cle"); er.detail = "La copie du relais appartient à un autre espace."; throw er; }
        const m = mergeVault(vault, remote);
        summary.added.push(...m.added); summary.updated += m.updated; summary.entries += m.entries; summary.vapidChanged = summary.vapidChanged || m.vapidChanged;
      }
      const w = await relay(vault.relay, { a: "vput", token: vault.token, blob: await sealVault(Object.assign({}, vault, { failed: [] })), ifv: r.v || 0 }, 120000);
      if (w.ok) { vault.syncV = w.v; vault.lastSync = new Date().toISOString(); break; }
      if (w.err !== "conflict") { const e = new Error("vput"); e.detail = "Synchronisation impossible (" + (w.err || "?") + ")."; throw e; }
    }
    await persistLocal();
    if (summary.vapidChanged) { for (const pt of Object.values(vault.patients)) await publishCfg(pt); try { await pushVapid(true); } catch (e) {} }
    return summary;
  } finally { syncing = false; }
}
function scheduleSync() {
  if (!relayOn()) return;
  clearTimeout(syncTimer);

}
/* Après une fusion, relit les messages qui n'avaient pas pu être ajoutés (code absent) */
async function rereadFailed() {
  if (!vault.failed || !vault.failed.length) return null;
  const known = vault.failed.filter(f => vault.patients[f.code]);
  if (!known.length) return null;
  vault.cursor = Math.min(...known.map(f => f.seq)) - 1;

}
function syncSummary(s) {
  if (!s) return "";
  const parts = [];
  if (s.added.length) parts.push(`${s.added.length} patient${s.added.length > 1 ? "s" : ""} ajouté${s.added.length > 1 ? "s" : ""} depuis vos autres appareils (${s.added.map(esc).join(", ")})`);
  if (s.entries && !s.added.length) parts.push(`${s.entries} réponse${s.entries > 1 ? "s" : ""} récupérée${s.entries > 1 ? "s" : ""} depuis vos autres appareils`);
  if (s.updated) parts.push(`${s.updated} fiche${s.updated > 1 ? "s" : ""} mise${s.updated > 1 ? "s" : ""} à jour`);
  return parts.length ? "Synchronisé : " + parts.join(", ") + "." : "";
}

/* ---------- Messages aux patients et notifications ---------- */
async function ensureVapid() {
  if (demo || !vault || vault.vapid) return false;
  const kp = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  vault.vapid = { priv: await crypto.subtle.exportKey("jwk", kp.privateKey), pub: B64.enc(await crypto.subtle.exportKey("raw", kp.publicKey)) };
  await persist();
  if (relayOn()) for (const pt of Object.values(vault.patients)) await publishCfg(pt);
  return true;
}
/* Confie la clé de notification au relais, pour qu'il puisse envoyer les rappels programmés */
async function pushVapid(force) {

  const r = await relay(vault.relay, { a: "setvapid", token: vault.token, d: vault.vapid.priv.d, pub: vault.vapid.pub });

async function vapidJwt(aud) {
  const key = await crypto.subtle.importKey("jwk", vault.vapid.priv, { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]);

}

  try { const r = await relay(vault.relay, { a: "setmsgs", token: vault.token, code: pt.code, blob: await sealCfg(pt.code, { l }) }); return r.ok ? true : (r.err === "action" ? "old" : false); } catch (e) { return false; }
}

}

  const boxes = [...document.querySelectorAll(".bcp")], n = document.getElementById("bcN");

  boxes.forEach(b => b.onchange = count);
  document.getElementById("bcAll").onclick = () => { boxes.forEach(b => { b.checked = true; }); count(); };
  document.getElementById("bcNone").onclick = () => { boxes.forEach(b => { b.checked = false; }); count(); };
  document.querySelectorAll("[data-bcm]").forEach(b => b.onclick = () => { const m = BC_MODELS[Number(b.dataset.bcm)]; document.getElementById("bcTu").value = m[1]; document.getElementById("bcVous").value = m[2]; });
  const send = document.getElementById("bcSend");
  send.onclick = async () => {

      if (r === true) { ok++; if (notif) { const pr = await sendPush(pt); if (pr.ok) pushed++; } }

    await persist();
    flash = demo ? `Message ajouté pour ${ok} patient(s) (démonstration : rien n'est envoyé).`

    nav("patients");
  };
}

  const ag = by("angst"); if (ag.length) lines.push(`Questionnaire d'Angst : ${ag.map(e => `${fmtD(e.t)} ${e.total}/20`).join(", ")} (seuil > 10).`);
  const el = by("elan"); if (el.length) lines.push(`Suivi de l'élan : ${el.map(e => `${fmtD(e.t)} ${e.oui}/10${elanFlag(e) ? " à explorer" : ""}`).join(", ")}.`);
  const rep = by("repas"); if (rep.length) lines.push(`Repas : ${rep.filter(e => e.slot !== "grig").length} repas notés dont ${rep.filter(e => e.pris === false).length} non pris, ${rep.filter(e => e.slot === "grig").length} grignotages, perte de contrôle ×${rep.filter(e => e.ctrl === "Oui").length}, compensations ×${rep.flatMap(e => e.comp || []).length}.`);
  const env = by("envie"); if (env.length) lines.push(`Envies de crise : ${env.length} (${env.filter(e => e.issue === "J'ai fait une crise").length} avec crise).`);
  const ang = by("angoisse"); if (ang.length) lines.push(`Crises d'angoisse : ${ang.length}, pic moyen ${r1(avg(ang.map(e => e.pic)))}/10.`);
  const sud = by("sud"); if (sud.length) lines.push(`Malaise (SUD) : ${pl(sud.length, "saisie")}, moyenne ${r1(avg(sud.map(e => e.sud)))}/10.`);
  const som = by("sommeil"); if (som.length) lines.push(`Sommeil : ${som.length} nuits, durée moyenne ${r1(avg(som.map(sleepHours).filter(x => x != null)))} h, qualité moyenne ${r1(avg(som.map(e => e.qualite).filter(Boolean)))}/5.`);
  by("tcc").forEach(e => lines.push(`Exercice TCC « ${e.titre} » (${fmtD(e.t)}) : ${(e.rep || []).filter(r => r.k !== "rate").map(r => `${r.q} = ${tccValText(r)}`).join(" ; ")}.`));
  by("perso").forEach(e => lines.push(`Exercice « ${e.titre} » (${fmtD(e.t)}) : ${(e.rep || []).map(r => `${r.q} = ${Array.isArray(r.v) ? r.v.join(", ") : r.v}`).join(" ; ")}.`));
  const jau = by("jauge"); if (jau.length) lines.push(`Jauge sensorielle : ${pl(jau.length, "saisie")}, ${jau.filter(e => e.niveau >= 4).length} au niveau 4 ou 5.`);
  lines.push("", "Détail :");
  list.forEach(e => lines.push(`- ${fmtDT(e.t)} · ${TYPE_LABEL[e.type] || e.type} · ${entryText(e)}`));
  return lines.join("\n");
}
function mountDetail(pt, p) {
  if (!pt) return;
  if (p.del) { document.getElementById("delYes").onclick = async () => { if (relayOn()) { try { await relay(vault.relay, { a: "delcfg", token: vault.token, code: pt.code }); } catch (e) {} } vault.deleted = vault.deleted || {}; vault.deleted[pt.code] = new Date().toISOString(); delete vault.patients[pt.code]; await persist(); nav("patients"); }; return; }
  document.querySelectorAll('.chips[data-name="per"] .chip').forEach(b => b.addEventListener("picked", () => nav("patients", { code: pt.code, per: b.dataset.v })));
  mountMsgPanel(pt);
  const cr = document.getElementById("cr");
  cr.onclick = async () => {
    const txt = report(pt, p.per || "30");
    if (!(await copyText(txt, cr))) { cr.insertAdjacentHTML("afterend", `<textarea id="crTxt" style="min-height:200px;margin-top:8px">${esc(txt)}</textarea>`); selectAll(document.getElementById("crTxt")); }
  };
}

/* Recevoir */
PAGES.recevoir = () => `<div class="head-row"><div><h1>Recevoir des réponses</h1></div></div>
  <div class="split">
    <div class="card stack"><h3>Réception directe</h3>
      ${relayOn() ? `<p class="small">Les réponses envoyées par vos patients attendent, chiffrées, dans votre relais Google. Elles sont relevées automatiquement à chaque ouverture de votre espace.${vault.lastFetch ? ` Dernier relevé : ${fmtDT(vault.lastFetch)}.` : ""}</p>
        <button class="btn" id="fetch">Relever maintenant</button><div id="fres"></div>`
      : `<p class="small">${demo ? "Non disponible en démonstration." : "Pas encore configurée."}</p>${demo ? "" : `<button class="btn soft" data-nav="reglages" data-p='{"guide":true}'>Configurer la réception directe</button>`}`}</div>
    <div class="card stack"><h3>Coller un message</h3>
      <p class="small">Pour un message reçu par mail ou SMS (il commence par PSY1.). Vous pouvez coller le mail entier.</p>
      <textarea id="inbox" class="mono" style="min-height:160px" placeholder="PSY1.…" spellcheck="false"></textarea>
      <button class="btn soft" id="dec">Déchiffrer et ajouter</button><div class="stack" id="results"></div></div></div>`;
MOUNTS.recevoir = () => {
  const f = document.getElementById("fetch");
  if (f) f.onclick = async () => { f.disabled = true; f.textContent = "Relevé…"; const out = document.getElementById("fres");
    try { const res = await fetchInbox(); out.innerHTML = `<p class="result">${inboxSummary(res)}</p>`; }
    catch (e) { out.innerHTML = `<p class="result err">${esc(e.detail || "Le relais ne répond pas. Vérifier la connexion.")}</p>`; }
    f.disabled = false; f.textContent = "Relever maintenant"; };
  document.getElementById("dec").onclick = async () => {
    const msgs = document.getElementById("inbox").value.match(/PSY1\.[A-Za-z0-9_-]+/g) || [], out = [];
    if (!msgs.length) out.push(`<div class="result err">Aucun message PSY1 trouvé dans le texte collé.</div>`);
    for (const m of msgs) {
      try {
        const r = await importData(await decryptMessage(vault.priv, m));
        if (r.err) { out.push(`<div class="result err">Message du code <b>${esc(spaced(r.code))}</b> : ce patient n'existe pas dans votre espace.</div>`); continue; }
        out.push(`<div class="result"><b>${esc(r.pt.label || r.pt.code)}</b> : ${r.n} nouvelle${r.n > 1 ? "s" : ""} réponse${r.n > 1 ? "s" : ""}${r.dup ? `, ${r.dup} déjà reçue${r.dup > 1 ? "s" : ""}` : ""}. <button class="link" data-nav="patients" data-p='{"code":"${r.pt.code}"}'>Voir la fiche</button></div>`);
      } catch (e) { out.push(`<div class="result err">Un message n'a pas pu être déchiffré : il est incomplet, ou il a été chiffré pour un autre espace.</div>`); }
    }
    await persist();
    document.getElementById("results").innerHTML = out.join("");
    if (msgs.length) document.getElementById("inbox").value = "";
  };
};

/* Réglages et guide du relais */
const GUIDE = [
  ["Créer la feuille Google", "Avec votre compte Gmail, ouvrir <b>sheets.google.com</b> et créer une feuille vierge. La renommer « Entre-Séances relais »."],
  ["Ouvrir l'éditeur de script", "Dans la feuille : menu <b>Extensions</b>, puis <b>Apps Script</b>. Un nouvel onglet s'ouvre."],
  ["Coller le code", "Effacer tout le texte présent, coller le code (bouton « Copier le code » ci-dessous), puis cliquer sur l'icône <b>Enregistrer</b> (disquette)."],
  ["Accorder les autorisations", "En haut, choisir la fonction <b>autoriser</b> puis cliquer <b>Exécuter</b>. Accepter avec votre compte. Si Google affiche « Google n'a pas validé cette application » : <b>Paramètres avancés</b>, puis <b>Accéder à Entre-Séances relais</b>. C'est votre propre script."],
  ["Déployer", "Bouton bleu <b>Déployer</b> → <b>Nouveau déploiement</b> → roue dentée → <b>Application Web</b>. Exécuter en tant que : <b>Moi</b>. Qui a accès : <b>Tout le monde</b>. Cliquer <b>Déployer</b>."],
  ["Connecter votre espace", "Copier l'<b>URL de l'application Web</b> (elle finit par /exec), la coller dans le champ ci-dessous et cliquer <b>Connecter</b>."],
  ["Relier l'application patient", "Sur GitHub, ouvrir le fichier <b>config.js</b>, cliquer sur le crayon, coller la même adresse entre les guillemets, puis <b>Commit changes</b>."]
];
PAGES.reglages = p => {
  if (p.wipe) return `<div class="card stack danger-zone" style="max-width:560px"><h2>Supprimer tout l'espace ?</h2>
    <p>Patients, réponses, photos et clé de déchiffrement seront effacés de cet appareil. Les messages déjà envoyés par vos patients ne pourront plus être lus, sauf si vous restaurez une sauvegarde.</p>
    <div class="row"><button class="btn help" id="wipeYes">Tout supprimer</button><button class="btn ghost" data-nav="reglages">Annuler</button></div></div>`;
  const relayCard = `<div class="card stack"><h3>Réception directe</h3>
      ${relayOn() ? `<p class="result">Connectée. Les patients entrent un code à 6 caractères et leurs réponses arrivent ici automatiquement.</p>` : `<p class="small">Permet les codes courts et l'envoi direct des réponses. Gratuit, avec votre compte Gmail. Google ne stocke que des messages chiffrés, illisibles sans votre clé.</p>`}
      ${demo ? `<p class="notice">Indisponible en démonstration.</p>` : `<div><label class="lbl" for="rurl">Adresse du relais (Apps Script)</label><input type="text" id="rurl" value="${esc(vault.relay || "")}" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <button class="btn ${relayOn() ? "soft" : ""}" id="conn" style="align-self:flex-start">${relayOn() ? "Reconnecter" : "Connecter"}</button><p class="hint" id="cMsg" role="status"></p>
      <button class="link" data-nav="reglages" data-p='{"guide":true}'>Guide pas à pas</button>`}</div>`;
  if (p.guide) return `<button class="link" data-nav="reglages">← Réglages</button><div class="head-row"><div><h1>Configurer la réception directe</h1><p class="muted">Une seule fois, environ 10 minutes, depuis un ordinateur.</p></div></div>
    <div class="split"><ol class="guide">${GUIDE.map(([t, d]) => `<li><b>${t}</b><p>${d}</p></li>`).join("")}</ol>
    <div class="stack"><div class="card stack"><h3>Code du relais</h3><textarea id="gs" class="mono" readonly style="min-height:200px">${esc(RELAIS_GS)}</textarea><button class="btn" id="cpGs">Copier le code</button></div>${relayCard}</div></div>`;
  const cfgLine = `window.ES_RELAIS = "${vault.relay || ""}";`;
  const diagCard = relayOn() ? `<div class="card stack"><h3>Vérifier la liaison</h3>
      <p class="small">Le fichier <b>config.js</b> du site doit contenir exactement cette ligne (copiez-la et remplacez toute la ligne existante sur GitHub) :</p>
      <textarea id="cfgl" class="mono" readonly style="min-height:70px">${esc(cfgLine)}</textarea>
      <div class="row"><button class="btn soft" id="cpCfg">Copier la ligne</button><button class="btn" id="diag">Lancer la vérification</button></div>
      <div id="diagOut" class="stack"></div>
      ${(vault.failed || []).length ? `<p class="notice small">${vault.failed.length} message(s) n'ont pas pu être ajoutés : ${vault.failed.slice(-5).map(f => `${spaced(f.code)} (${f.why})`).join(" ; ")}.</p>` : ""}
      <button class="link" id="reread">Relire tous les messages du relais depuis le début</button></div>` : "";
  const syncCard = relayOn() ? `<div class="card stack"><h3>Synchronisation entre mes appareils</h3>
      <p class="small">Votre espace (patients, réponses, messages, exercices perso) est recopié automatiquement entre l'ordinateur et le téléphone, à chaque ouverture et après chaque modification. La copie stockée dans votre Google Drive est chiffrée : seuls vos appareils peuvent la lire.</p>
      <p class="small muted">${vault.lastSync ? "Dernière synchronisation : " + fmtDT(vault.lastSync) : "Pas encore synchronisé."} · ${Object.keys(vault.patients).length} patient(s) dans cet espace.</p>
      <button class="btn" id="syncNow" style="align-self:flex-start">Synchroniser maintenant</button><p class="hint" id="syncMsg" role="status"></p>
      <p class="hint">Les photos de repas restent sur l'appareil qui les a reçues.</p></div>` : "";
  return `<div class="head-row"><h1>Réglages</h1></div>
  <div class="split">
    ${relayCard}${syncCard}${diagCard}
    <div class="card stack"><h3>Informations transmises aux patients</h3>
      <div><label class="lbl" for="url">Lien de l'application patient</label><input type="text" id="url" value="${esc(vault.appUrl || "")}" placeholder="https://…"><p class="hint">Sert au QR code et au message d'invitation.</p></div>
      <div><label class="lbl" for="em">Adresse mail (envoi manuel de secours)</label><input type="text" id="em" value="${esc(vault.email)}"></div>
      <button class="btn soft" id="saveS" style="align-self:flex-start">Enregistrer</button><p class="hint" id="sMsg" role="status"></p></div>
    <div class="card stack"><h3>Sauvegarde</h3>
      <p class="small">Copie chiffrée de tout votre espace (patients, réponses, connexion au relais), protégée par votre mot de passe. Les photos ne sont pas incluses : enregistrez celles à garder dans le dossier du patient. Refaites la sauvegarde après chaque relevé important.</p>
      ${demo ? `<p class="notice">Indisponible en démonstration.</p>` : `<button class="btn" id="bk">Générer la sauvegarde</button><textarea id="bkTxt" class="mono" readonly hidden style="min-height:120px"></textarea>`}
      <p class="small muted">Version de l'application : ${APP_VERSION}</p>
      <h3 style="margin-top:8px">Sécurité</h3>
      <p class="small">L'espace se verrouille après ${LOCK_MIN} minutes sans activité. Empreinte de votre clé publique : <span class="mono">${esc(vault.pub.slice(0, 16))}…</span></p>
      ${demo ? "" : `<button class="link" data-nav="reglages" data-p='{"wipe":true}'>Supprimer tout l'espace de cet appareil</button>`}</div>
  </div>`;
};
MOUNTS.reglages = p => {
  if (p.wipe) { document.getElementById("wipeYes").onclick = () => { lsDel(VKEY); try { indexedDB.deleteDatabase("es_pro_photos"); } catch (e) {} lock(); }; return; }
  const gs = document.getElementById("cpGs"); if (gs) gs.onclick = async e => { const t = document.getElementById("gs"); if (!(await copyText(RELAIS_GS, e.currentTarget))) selectAll(t); };
  const conn = document.getElementById("conn");
  if (conn) conn.onclick = async () => {
    const m = document.getElementById("cMsg"); conn.disabled = true; m.textContent = "Connexion…";
    const err = await connectRelay(document.getElementById("rurl").value);
    conn.disabled = false;
    if (err) { m.textContent = err; return; }
    flash = "Réception directe connectée. Les exercices de vos patients ont été publiés. Dernière étape : coller la même adresse dans config.js sur GitHub."; nav("reglages");
  };
  const sn = document.getElementById("syncNow");
  if (sn) sn.onclick = async () => {
    const m = document.getElementById("syncMsg"); sn.disabled = true; m.textContent = "Synchronisation…";
    try {
      const sm = await syncVault(); const rr = await rereadFailed();
      flash = [syncSummary(sm) || "Cet appareil est à jour.", rr && rr.n ? "Messages récupérés : " + inboxSummary(rr) : ""].filter(Boolean).join(" ");
      nav("reglages");
    } catch (e) { m.textContent = e.detail || "Synchronisation impossible : vérifier la connexion."; sn.disabled = false; }
  };
  const cc = document.getElementById("cpCfg"); if (cc) cc.onclick = async e => { const t = document.getElementById("cfgl"); if (!(await copyText(t.value, e.currentTarget))) selectAll(t); };
  const rr = document.getElementById("reread");
  if (rr) rr.onclick = async () => { rr.textContent = "Relecture…"; vault.cursor = 0; try { flash = inboxSummary(await fetchInbox()); } catch (e) { flash = e.detail || "Le relais ne répond pas."; } nav("reglages"); };
  const dg = document.getElementById("diag");
  if (dg) dg.onclick = async () => {
    const out = document.getElementById("diagOut"), line = (ok, t) => `<p class="small">${ok ? "✔" : "✖"} ${t}</p>`;
    dg.disabled = true; out.innerHTML = `<p class="small">Vérification…</p>`; let h = "";
    try {
      const pg = await relay(vault.relay, { a: "ping" }); h += line(!!pg.ok, `Le relais répond (version ${pg.v || "1 à 3"} ; version attendue : 6).`);
      if (pg.sheet === false) h += line(false, "Le relais n'arrive pas à utiliser sa feuille Google : " + esc(pg.why) + ". Dans Apps Script, exécuter la fonction « autoriser », puis publier une nouvelle version.");
      else if (pg.sheet === undefined || (pg.v || 0) < 5) h += line(false, "Le code du relais est ancien : le remplacer par celui du guide, puis Déployer → Gérer les déploiements → crayon → Nouvelle version.");
      else h += line(true, "Le relais peut ranger les messages.");
      if ((pg.v || 0) >= 6) {
        h += line(!!pg.trig, pg.trig ? "Les rappels quotidiens sont actifs." : "Rappels quotidiens inactifs : dans Apps Script, exécuter la fonction « autoriser » une fois.");
        if (!pg.vapid) { try { await pushVapid(true); h += line(true, "Clé de notification transmise au relais."); } catch (e) { h += line(false, "Clé de notification non transmise."); } }
      }
      const ck = await relay(vault.relay, { a: "check", token: vault.token }); h += line(!!ck.ok, ck.ok ? "Votre espace est bien le propriétaire du relais." : "Ce relais appartient à un autre espace (clé différente).");
      let pubOk = 0, pubKo = [];
      for (const pt of Object.values(vault.patients)) { (await publishCfg(pt)) ? pubOk++ : pubKo.push(spaced(pt.code)); }
      h += line(!pubKo.length, `Exercices publiés pour ${pubOk} patient(s)${pubKo.length ? ", échec pour " + pubKo.join(", ") : ""}.`);
      const ib = await relay(vault.relay, { a: "inbox", token: vault.token, since: 0 }, 120000);
      if (ib.ok) {
        const codes = {}; ib.items.forEach(it => codes[it.code] = (codes[it.code] || 0) + 1);
        h += line(true, `${ib.items.length} message(s) stocké(s) dans le relais${ib.items.length ? " : " + Object.entries(codes).map(([c, n]) => `${spaced(c)} ×${n}${vault.patients[c] ? "" : " (code inconnu ici)"}`).join(", ") : ""}.`);
        if (!ib.items.length) h += `<p class="notice small">Aucun message n'est arrivé au relais : le problème se situe côté application patient. Vérifiez le fichier config.js (ligne ci-dessus), puis sur le téléphone du patient : Réglages → Liaison avec la psychologue → Vérifier la liaison.</p>`;
        const pending = ib.items.filter(it => it.seq > (vault.cursor || 0)).length;
        if (pending) h += line(false, `${pending} message(s) pas encore relevé(s) : utiliser « Relever les réponses ».`);
      }
    } catch (e) { h += line(false, esc(e.detail || "Relais injoignable.")); }
    out.innerHTML = h; dg.disabled = false;
  };
  const ss = document.getElementById("saveS");
  if (ss) ss.onclick = async () => { vault.email = document.getElementById("em").value.trim(); vault.appUrl = document.getElementById("url").value.trim().replace(/\/+$/, ""); await persist(); for (const pt of Object.values(vault.patients)) await publishCfg(pt); document.getElementById("sMsg").textContent = demo ? "Enregistré pour cette démonstration." : "Enregistré."; };
  const bk = document.getElementById("bk");
  if (bk) bk.onclick = async () => { await persist(); const t = document.getElementById("bkTxt"); t.hidden = false; t.value = "SAUV1." + B64.enc(TE.encode(JSON.stringify(lsGet(VKEY)))); if (!(await copyText(t.value, bk))) selectAll(t); };
};

render();
</script>
