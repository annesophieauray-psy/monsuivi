<title>Entre-Séances Praticienne</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Concept : carnet calme et lisible — une colonne, de grands boutons, peu d'éléments à la fois.
   Couleurs : lagune (vert d'eau profond), ambre pour l'énergie, rouge réservé à l'aide. */
:root {
  --bg: #EDF3F1; --surface: #FFFFFF; --surface-2: #E1EBE7; --ink: #15302C; --muted: #52706A;
  --line: #C6D7D2; --accent: #1E6A64; --accent-ink: #FFFFFF; --accent-soft: #D2E8E3;
  --sun: #C98A1C; --sun-soft: #F6E7C8; --help: #B3321F; --help-soft: #F8E1DC;
  --ok: #2E7D4F; --s0: #1C4FC4; --s1: #15302C; --muet: #C8372D;
  --z1: #3E9B63; --z2: #8DB43F; --z3: #E0B12E; --z4: #E07B2E; --z5: #C9412F;
  --f-display: "Lexend", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-dys: "Lexend", "Verdana", system-ui, sans-serif;
  --scale: 1;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1918; --surface: #162422; --surface-2: #1E302D; --ink: #E2EEEA; --muted: #9AB5AF;
    --line: #2B413D; --accent: #6BC2B8; --accent-ink: #0E1918; --accent-soft: #1C3A36;
    --sun: #F0B654; --sun-soft: #3A2F18; --help: #FF8B76; --help-soft: #3A1E19;
    --ok: #6FCF97; --s0: #8DB2FF; --s1: #E2EEEA; --muet: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1918; --surface: #162422; --surface-2: #1E302D; --ink: #E2EEEA; --muted: #9AB5AF;
  --line: #2B413D; --accent: #6BC2B8; --accent-ink: #0E1918; --accent-soft: #1C3A36;
  --sun: #F0B654; --sun-soft: #3A2F18; --help: #FF8B76; --help-soft: #3A1E19;
  --ok: #6FCF97; --s0: #8DB2FF; --s1: #E2EEEA; --muet: #FF8A80; color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  font-size: calc(17px * var(--scale)); line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.6em; } h2 { font-size: 1.3em; } h3 { font-size: 1.08em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.small { font-size: 0.86em; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 12px 20px; border-radius: 999px; border: 2px solid transparent;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 500;
  cursor: pointer; text-decoration: none; text-align: center;
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn.soft { background: var(--accent-soft); color: var(--ink); }
.btn.help { background: var(--help); color: #fff; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 6px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
label.lbl, .lbl { font-family: var(--f-display); font-weight: 500; display: block; margin-bottom: 6px; }
.hint { font-size: 0.86em; color: var(--muted); margin-top: 4px; }
input[type=text], input[type=password], input[type=time], input[type=number], textarea, select {
  width: 100%; box-sizing: border-box; background: var(--surface); border: 2px solid var(--line);
  border-radius: 12px; padding: 12px 14px; min-height: 50px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px;
  min-height: 44px; cursor: pointer; font-family: var(--f-body);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.range { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.range output { font-family: var(--f-display); font-weight: 600; font-size: 1.3em; min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 34px; }
.scale-ends { display: flex; justify-content: space-between; font-size: 0.82em; color: var(--muted); margin-top: -2px; }
.notice { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 0.92em; }
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.8em; word-break: break-all; }
/* Lecture adaptée */
.dys body, .dys { --f-body: var(--f-dys); }
.dys body { letter-spacing: 0.04em; word-spacing: 0.16em; line-height: 1.85; }
.dys h1, .dys h2, .dys h3 { letter-spacing: 0.02em; line-height: 1.4; }
.dys p, .dys li { max-width: 34em; }
.syl.s0 { color: var(--s0); }
.syl.s1 { color: var(--s1); }
.muet { color: var(--muet); opacity: 0.9; }
.btn .syl, .chip .syl, .btn .muet, .chip .muet, .chip[aria-pressed="true"] .syl { color: inherit; }
.btn .muet, .chip .muet { opacity: 0.65; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
body { font-size: 16px; }
.shell { max-width: 1080px; margin: 0 auto; padding-block: 0 56px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); margin-bottom: 24px;
}
.top-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 32px; height: 32px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 600; }
.brand-sub { color: var(--muted); font-size: 0.85em; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 4px; }
.tab { border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-family: var(--f-display); font-weight: 500; color: var(--muted); min-height: 40px; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.btn { min-height: 44px; padding: 10px 18px; }
.lockbtn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.demo-band { background: var(--sun-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; font-size: 0.92em; }
.lock { max-width: 460px; margin: 6vh auto 0; display: flex; flex-direction: column; gap: 18px; }
.lock h1 { font-size: 1.7em; }
.grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.pcard { display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; color: var(--ink); }
.pcard:hover { border-color: var(--accent); }
.pcard .top-line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.pcard .lab { font-family: var(--f-display); font-weight: 600; font-size: 1.08em; }
.code-chip { font-family: var(--f-display); font-weight: 600; background: var(--surface-2); border-radius: 8px; padding: 2px 8px; letter-spacing: 0.06em; font-size: 0.86em; white-space: nowrap; }
.pill { display: inline-block; font-size: 0.78em; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.pill.new { background: var(--sun-soft); }
.head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.detail-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.detail-head .row { justify-content: space-between; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi b { font-family: var(--f-display); font-size: 1.5em; display: block; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 0.85em; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.panel h3 small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: 0.78em; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-body); font-size: 12px; fill: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82em; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.freq { display: flex; flex-direction: column; gap: 6px; }
.freq-row { display: grid; grid-template-columns: minmax(0, 9em) 1fr 2em; gap: 8px; align-items: center; font-size: 0.88em; }
.freq-row .bar { height: 10px; border-radius: 5px; background: var(--accent); opacity: 0.85; }
.freq-row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9em; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-display); font-weight: 500; color: var(--muted); font-size: 0.85em; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.journal { display: flex; flex-direction: column; gap: 8px; }
.jrow { display: grid; grid-template-columns: 8.5em 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.jrow:last-child { border-bottom: 0; }
.jrow .when { color: var(--muted); font-size: 0.86em; font-variant-numeric: tabular-nums; }
.jrow .what { min-width: 0; overflow-wrap: anywhere; }
.jrow .kind { font-family: var(--f-display); font-weight: 500; }
.tr-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 9em 1fr; gap: 6px 12px; font-size: 0.92em; }
.tr-card dt { color: var(--muted); }
.tr-card dd { margin: 0; overflow-wrap: anywhere; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px; }
.mod-check { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.mod-check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
.hier { display: flex; flex-direction: column; gap: 8px; }
.hier-row { display: grid; grid-template-columns: 1fr 6.5em auto; gap: 8px; align-items: center; }
.hier-row select { min-height: 46px; }
.result { border-radius: 12px; padding: 10px 14px; background: var(--accent-soft); }
.result.err { background: var(--help-soft); }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 16px; align-items: start; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.danger-zone { border-color: var(--help); }
@media (max-width: 520px) {
  .jrow { grid-template-columns: 1fr; gap: 2px; }
  .tr-card { grid-template-columns: 1fr; }
  .brand-sub { display: none; }
}
.flash { margin-bottom: 16px; }
.pill.warn { background: var(--help-soft); color: var(--ink); }
.grp { font-family: var(--f-display); font-weight: 500; color: var(--muted); font-size: 0.86em; margin: 4px 0 8px; }
.mods + .hint { margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.mood-strip { display: flex; flex-wrap: wrap; gap: 6px; }
.mood-strip .ms { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 0.7em; color: var(--muted); font-variant-numeric: tabular-nums; }
.score-box { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; border-radius: 12px; padding: 12px 14px; background: var(--surface-2); border-left: 6px solid var(--z1); }
.score-box.hi { background: var(--help-soft); border-left-color: var(--help); }
.score-box b { font-family: var(--f-display); font-size: 2em; font-variant-numeric: tabular-nums; line-height: 1; }
.score-box b small { font-size: 0.45em; color: var(--muted); }
.score-box span { font-size: 0.88em; }
.meal-grid td, .meal-grid th { white-space: nowrap; font-size: 0.86em; }
.meal-grid .c-none { color: var(--muted); }
.meal-grid .c-skip { background: var(--sun-soft); }
.meal-grid .c-ok { background: var(--accent-soft); }
.meal-grid .c-ctrl { background: var(--help-soft); }
.f-ctrl, .f-comp, .f-ph { font-style: normal; font-size: 0.78em; font-weight: 700; border-radius: 6px; padding: 1px 5px; margin-left: 3px; }
.f-ctrl { background: var(--help); color: #fff; }
.f-comp { background: var(--sun); color: #1a1a1a; }
.f-ph { padding: 0; }
.legend .f-ctrl, .legend .f-comp { margin: 0 4px 0 0; }
.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ph-card { margin: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.8em; color: var(--muted); }
.ph-card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: var(--surface-2); display: block; }
.ph-card.missing img { visibility: hidden; }
.ph-card.missing figcaption::after { content: " · photo indisponible sur cet appareil"; }
.print-sheet { align-items: stretch; }
.ps-head { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 1.1em; }
.qr-wrap { display: flex; justify-content: center; }
.qr-wrap svg { max-width: 100%; height: auto; border-radius: 8px; }
.big-url { font-family: var(--f-display); font-weight: 600; font-size: 1.25em; text-align: center; overflow-wrap: anywhere; }
.big-code { font-family: var(--f-display); font-weight: 700; font-size: 2.6em; letter-spacing: 0.14em; text-align: center; font-variant-numeric: tabular-nums; }
ol.guide { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 14px; }
ol.guide li p { margin-top: 4px; font-size: 0.94em; }
@media print {
  body * { visibility: hidden; }
  .print-sheet, .print-sheet * { visibility: visible; }
  .print-sheet { position: absolute; inset: 0 auto auto 0; width: 100%; border: 0; }
  .no-print { display: none !important; }
}
.panel .chart { max-width: 760px; }
.legend i.f-ctrl, .legend i.f-comp { width: auto; height: auto; border-radius: 6px; vertical-align: baseline; }
.f-ph { background: var(--surface); color: var(--muted); border: 1px solid var(--line); padding: 0 5px; font-weight: 500; }
.msg-panel textarea { min-height: 110px; }
.idea-chips { gap: 6px; }
.idea { border: 1px dashed var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.82em; color: var(--muted); }
.idea:hover { border-color: var(--accent); color: var(--ink); }
.msg-list { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; }
.msg-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.msg-item p { overflow-wrap: anywhere; }
.fld { display: flex; flex-direction: column; gap: 8px; padding: 14px; }
.fld-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.fld-top select { width: auto; min-width: 12em; }
.fld-act { gap: 12px; }
.fld .x-choix, .fld .x-multi, .fld .x-echelle, .fld .x-minuteur { display: none; }
.fld[data-k="choix"] .x-choix, .fld[data-k="multi"] .x-multi { display: block; }
.fld[data-k="echelle"] .x-echelle { display: grid; }
.fld[data-k="minuteur"] .x-minuteur { display: block; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.msg-item .link, .msg-item p { text-align: left; align-self: flex-start; }
.stars { color: var(--sun); letter-spacing: 1px; white-space: nowrap; font-size: 0.9em; }
.small-btn { min-height: 38px; padding: 6px 12px; font-size: 0.86em; }
.lib td { vertical-align: top; }
.lib td:first-child { min-width: 14em; }
.tcc-group { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tcc-group:last-child { border-bottom: 0; }
.tcc-entry summary { cursor: pointer; color: var(--accent); font-size: 0.9em; }
.tcc-entry .tr-card { margin-top: 8px; }
.lib td.num { white-space: nowrap; }
.tab { display: inline-flex; align-items: center; gap: 6px; }
.tab-ico { flex: none; }
/* Questionnaires de repérage */
.qn-entry { border-left: 6px solid var(--accent); }
.qn-folder { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.qn-folder > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-family: var(--f-display); font-weight: 600; }
.qn-folder > summary::-webkit-details-marker { display: none; }
.qn-fold-t { flex: 1; }
.qn-fold-ico { width: 22px; height: 16px; border-radius: 3px; background: var(--accent); position: relative; flex: none; opacity: .85; }
.qn-fold-ico::before { content: ""; position: absolute; left: 0; top: -4px; width: 10px; height: 5px; border-radius: 2px 2px 0 0; background: var(--accent); }
.qn-folder[open] > summary { border-bottom: 1px solid var(--line); }
.qn-fold-body { padding: 14px 16px 16px; }
.qn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.qn-card .lab { font-family: var(--f-display); font-weight: 600; font-size: 1.08em; }
.qn-card details > summary, .qn-res details > summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.qn-prev, .qn-ans { padding-left: 1.4em; margin: 6px 0; display: flex; flex-direction: column; gap: 4px; }
.qn-send select { flex: 1; min-width: 12em; }
.qn-res { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.qn-res:last-child { border-bottom: 0; }

const B64 = {
  enc(buf) {

    let s = ""; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);

async function pack(obj) {

      const out = new Uint8Array(c.length + 1); out[0] = 1; out.set(c, 1); return out; } catch (e) {}
  }

}

const ECDH = { name: "ECDH", namedCurve: "P-256" };

  const eph = await crypto.subtle.generateKey(ECDH, true, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, eph.privateKey,
    { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: AAD }, key, await pack(obj)));
  const epk = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const out = new Uint8Array(65 + 12 + ct.length);
  out.set(epk, 0); out.set(iv, 65); out.set(ct, 77);
  return "PSY1." + B64.enc(out);

async function decryptMessage(privJwk, msg) {
  const m = String(msg).match(/PSY1\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("format");
  const all = B64.dec(m[1]);
  const priv = await crypto.subtle.importKey("jwk", privJwk, ECDH, false, ["deriveKey"]);
  const epk = await crypto.subtle.importKey("raw", all.slice(0, 65), ECDH, false, []);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: epk }, priv,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(65, 77), additionalData: AAD }, key, all.slice(77));
  return unpack(new Uint8Array(pt));
}

/* ===== Lecture adaptée : découpage syllabique et lettres muettes (approximation) ===== */
const VOY = "aeiouyàâäéèêëîïôöùûüÿœæ";
const isVoy = c => VOY.includes(c);
const INSEP = /^(bl|br|cl|cr|dr|fl|fr|gl|gr|pl|pr|tr|vr|ch|ph|gn|th|qu|gu)$/;
function syllabes(word) {
  const w = word.toLowerCase(), n = w.length;
  if (n <= 3) return [word];
  const v = [];
  for (let i = 0; i < n; i++) {
    let x = isVoy(w[i]);
    if (w[i] === "u" && i > 0 && (w[i - 1] === "q" || (w[i - 1] === "g" && i + 1 < n && "eiéèêy".includes(w[i + 1])))) x = false;
    v.push(x);
  }
  const nuc = []; let i = 0;
  while (i < n) { if (v[i]) { let j = i; while (j + 1 < n && v[j + 1]) j++; nuc.push([i, j]); i = j + 1; } else i++; }
  if (nuc.length < 2) return [word];
  const cuts = [];
  for (let k = 0; k < nuc.length - 1; k++) {
    const a = nuc[k][1] + 1, b = nuc[k + 1][0], cl = w.slice(a, b), L = cl.length;
    const ins = L >= 2 && INSEP.test(cl.slice(-2));
    cuts.push(L === 1 ? a : L === 2 ? (ins ? a : a + 1) : (ins ? b - 2 : b - 1));
  }
  const out = []; let p = 0;
  for (const c of cuts) { out.push(word.slice(p, c)); p = c; }
  out.push(word.slice(p));
  return out.filter(Boolean);
}

const EXC_E = new Set("le je me te se ce de ne que".split(" "));
function lettresMuettes(word) {
  const w = word.toLowerCase(), n = w.length, set = new Set();
  if (n >= 2 && w[0] === "h" && isVoy(w[1])) set.add(0);
  if (n < 2) return set;
  let idx = n - 1, steps = 0, lastWasE = false;
  while (idx > 0 && steps < 3) {
    const c = w[idx], prev = w[idx - 1];
    let mute = false;
    if (steps === 0) {
      if (c === "s" && prev !== "s" && !EXC_S.has(w)) mute = true;
      else if (c === "x" && !EXC_X.has(w)) mute = true;
    }
    if (!mute && c === "e" && !lastWasE && idx >= 2 && !EXC_E.has(w.slice(0, idx + 1)) && (steps === 0 || w[idx + 1] === "s")) mute = true;
    else if (!mute && steps <= 1 && !lastWasE) {
      if (c === "t" && !EXC_T.has(w) && (isVoy(prev) || "ncps".includes(prev))) mute = true;
      else if (c === "d" && !EXC_D.has(w) && (isVoy(prev) || "nr".includes(prev))) mute = true;
      else if (c === "p" && !EXC_P.has(w) && (isVoy(prev) || "m".includes(prev))) mute = true;

function adapterTexte(root, opts) {
  if (!opts || (!opts.syl && !opts.muet)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = node.parentElement;
      if (!p || p.closest("textarea,input,select,svg,script,style,.no-lis,code")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  let alt = 0;
  for (const node of nodes) {
    const parts = node.nodeValue.split(/([A-Za-zÀ-ÖØ-öø-ÿœŒæÆ]+)/);
    if (parts.length === 1) continue;
    const frag = document.createDocumentFragment();
    for (let k = 0; k < parts.length; k++) {
      const part = parts[k];
      if (!part) continue;
      if (k % 2 === 0) { frag.appendChild(document.createTextNode(part)); continue; }
      const muettes = opts.muet ? lettresMuettes(part) : new Set();
      const syls = opts.syl ? syllabes(part) : [part];
      const wspan = document.createElement("span"); wspan.className = "mot";
      let pos = 0;
      for (const s of syls) {
        const sp = document.createElement("span");
        if (opts.syl) sp.className = "syl s" + (alt++ % 2);
        for (let c = 0; c < s.length; c++) {
          if (muettes.has(pos + c)) { const m = document.createElement("span"); m.className = "muet"; m.textContent = s[c]; sp.appendChild(m); }
          else sp.appendChild(document.createTextNode(s[c]));
        }
        pos += s.length; wspan.appendChild(sp);
      }
      frag.appendChild(wspan);
    }
    node.parentNode.replaceChild(frag, node);
  }
}

/* Réduit une photo (≤ 900 px, JPEG) pour l'envoi */
function shrinkPhoto(file, max = 900, q = 0.62) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
/* Petit stockage IndexedDB pour les photos (localStorage est trop petit) */
const PhotoDB = {
  db: null,
  open(name) {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(name, 1);
        r.onupgradeneeded = () => r.result.createObjectStore("p");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async op(name, mode, fn) {
    const db = await this.open(name);
    return new Promise((res, rej) => { const tx = db.transaction("p", mode); const st = tx.objectStore("p"); const rq = fn(st); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); });
  },
  put(name, k, v) { return this.op(name, "readwrite", st => st.put(v, k)); },
  get(name, k) { return this.op(name, "readonly", st => st.get(k)); },
  del(name, k) { return this.op(name, "readwrite", st => st.delete(k)); }
};

function tccValText(r) {
  if (r.v == null || r.v === "") return "–";
  if (Array.isArray(r.v)) return r.v.filter(Boolean).join(" · ") || "–";
  if (typeof r.v === "object") return Object.entries(r.v).map(([k, n]) => `${k} : ${n}`).join(" · ");
  if (r.k === "pct") return r.v + " %";
  if (r.k === "echelle") return r.v + "/10";
  return String(r.v);
}

function timeChart({ series, min, max, ticks, from, to, kind = "line", h = 200, unit = "" }) {

  const x = t => L + (W - L - R) * ((new Date(t).getTime() - t0) / (t1 - t0));
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));

  series.forEach(s => {
    const pts = s.pts.filter(p => p.v != null && new Date(p.t).getTime() >= t0).sort((a, b) => a.t < b.t ? -1 : 1);
    if (kind === "bar") {

      pts.forEach(p => { g += `<rect x="${x(p.t) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, y(min) - y(p.v))}" rx="2" fill="${s.color}" opacity="0.85"><title>${fmtD(p.t)} : ${r1(p.v)}${unit}</title></rect>`; });
    } else {
      if (pts.length > 1 && !s.dotsOnly) g += `<polyline fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ")}"/>`;
      pts.forEach((p, i) => { const last = i === pts.length - 1; g += `<circle cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last ? 5 : 3.2}" fill="${last ? s.color : "var(--surface)"}" stroke="${s.color}" stroke-width="2"><title>${fmtD(p.t)} : ${r1(p.v)}${unit}</title></circle>`; });
    }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ---------- Synchronisation de l'espace entre appareils ----------
   La copie stockée dans le relais est chiffrée avec une clé dérivée de votre clé privée :
   seuls vos appareils (restaurés depuis la même sauvegarde) peuvent la lire. */
let syncing = false, syncTimer = null;
async function syncKey() {
  const h = await crypto.subtle.digest("SHA-256", TE.encode("entre-seances/sync/v1/" + vault.priv.d));
  return crypto.subtle.importKey("raw", h, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
}
async function sealVault(v) {
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await syncKey(), await pack(v)));

const stamp = o => (o && (o.updated || o.created)) || "";

function mergeVault(L, R) {

  L.deleted = Object.assign({}, R.deleted || {}, L.deleted || {});

  L.patients = L.patients || {};

    const del = L.deleted[code];
    const lp = L.patients[code];

      L.patients[code] = JSON.parse(JSON.stringify(rp)); dedupeEntries(L.patients[code]); res.added.push(rp.label || code); res.entries += (rp.entries || []).length; continue;
    }
    if (stamp(rp) > stamp(lp)) { for (const k of ["label", "tv", "mods", "hier", "tca", "cx", "tx", "mf", "ack", "updated"]) if (k in rp) lp[k] = rp[k]; res.updated++; }
    const ids = new Set((lp.entries || []).map(e => e.id));
    for (const e of rp.entries || []) if (!ids.has(e.id)) { ids.add(e.id); lp.entries.push(e); res.entries++; }
    res.entries -= dedupeEntries(lp);

    const mm = {}; for (const m of (lp.msgs || []).concat(rp.msgs || [])) { const x = mm[m.id]; mm[m.id] = x ? Object.assign({}, x, m, { lu: x.lu || m.lu }) : m; }
    const qq = {}; for (const a of (lp.qs || []).concat(rp.qs || [])) { const x = qq[a.i]; qq[a.i] = x ? Object.assign({}, x, a, { done: x.done || a.done }) : a; }
    lp.delQs = [...new Set((lp.delQs || []).concat(rp.delQs || []))];
    if (lp.qs || rp.qs) lp.qs = Object.values(qq).sort((a, b) => a.at < b.at ? -1 : 1);
    lp.delMsgs = [...new Set((lp.delMsgs || []).concat(rp.delMsgs || []))];
    lp.msgs = Object.values(mm).filter(m => !lp.delMsgs.includes(m.id)).sort((a, b) => a.t < b.t ? -1 : 1);
    if ((rp.lastImport || "") > (lp.lastImport || "")) lp.lastImport = rp.lastImport;

  L.cx = L.cx || {};
  for (const [id, d] of Object.entries(R.cx || {})) if (!L.cx[id] || stamp(d) > stamp(L.cx[id])) L.cx[id] = d;
  for (const [id, t] of Object.entries(L.deletedCx)) if (L.cx[id] && t >= stamp(L.cx[id])) delete L.cx[id];
  L.deletedQx = Object.assign({}, R.deletedQx || {}, L.deletedQx || {});
  L.qx = L.qx || {};
  for (const [id, d] of Object.entries(R.qx || {})) if (!L.qx[id] || stamp(d) > stamp(L.qx[id])) L.qx[id] = d;
  for (const [id, t] of Object.entries(L.deletedQx)) if (L.qx[id] && t >= stamp(L.qx[id])) delete L.qx[id];
  /* Une seule clé de notification pour tous les appareils : on garde la même partout (choix stable) */
  if (R.vapid && (!L.vapid || R.vapid.pub < L.vapid.pub)) { L.vapid = R.vapid; res.vapidChanged = true; }
  L.cursor = Math.max(L.cursor || 0, R.cursor || 0);

}
/* Tire la copie du relais, fusionne, renvoie la version fusionnée. Gère les conflits entre deux appareils. */
async function syncVault() {
  if (!relayOn() || syncing) return null;
  syncing = true;
  try {
    let summary = { added: [], updated: 0, entries: 0, vapidChanged: false };
    for (let i = 0; i < 4; i++) {
      const r = await relay(vault.relay, { a: "vget", token: vault.token }, 60000);
      if (!r.ok) { const e = new Error("vget"); e.detail = r.err === "action" ? "Votre relais Google n'est pas à jour : remplacer son code par la version 5 (Réglages → Guide), puis publier une nouvelle version." : "Synchronisation impossible (" + (r.err || "?") + ")."; throw e; }
      if (r.blob) {
        let remote;
        try { remote = await openVaultBlob(r.blob); } catch (e) { const er = new Error("cle"); er.detail = "La copie du relais appartient à un autre espace (clé différente). Restaurer sur cet appareil la sauvegarde de l'appareil principal."; throw er; }
        if (remote.pub !== vault.pub) { const er = new Error("cle"); er.detail = "La copie du relais appartient à un autre espace."; throw er; }
        const m = mergeVault(vault, remote);
        summary.added.push(...m.added); summary.updated += m.updated; summary.entries += m.entries; summary.vapidChanged = summary.vapidChanged || m.vapidChanged;
      }
      const w = await relay(vault.relay, { a: "vput", token: vault.token, blob: await sealVault(Object.assign({}, vault, { failed: [] })), ifv: r.v || 0 }, 120000);
      if (w.ok) { vault.syncV = w.v; vault.lastSync = new Date().toISOString(); break; }
      if (w.err !== "conflict") { const e = new Error("vput"); e.detail = "Synchronisation impossible (" + (w.err || "?") + ")."; throw e; }
    }
    await persistLocal();
    if (summary.vapidChanged) { for (const pt of Object.values(vault.patients)) await publishCfg(pt); try { await pushVapid(true); } catch (e) {} }
    return summary;
  } finally { syncing = false; }
}
function scheduleSync() {
  if (!relayOn()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncVault().catch(() => {}); }, 3000);
}
/* Après une fusion, relit les messages qui n'avaient pas pu être ajoutés (code absent) */
async function rereadFailed() {
  if (!vault.failed || !vault.failed.length) return null;
  const known = vault.failed.filter(f => vault.patients[f.code]);
  if (!known.length) return null;
  vault.cursor = Math.min(...known.map(f => f.seq)) - 1;
  return fetchInbox();
}
function syncSummary(s) {
  if (!s) return "";
  const parts = [];
  if (s.added.length) parts.push(`${s.added.length} patient${s.added.length > 1 ? "s" : ""} ajouté${s.added.length > 1 ? "s" : ""} depuis vos autres appareils (${s.added.map(esc).join(", ")})`);
  if (s.entries && !s.added.length) parts.push(`${s.entries} réponse${s.entries > 1 ? "s" : ""} récupérée${s.entries > 1 ? "s" : ""} depuis vos autres appareils`);
  if (s.updated) parts.push(`${s.updated} fiche${s.updated > 1 ? "s" : ""} mise${s.updated > 1 ? "s" : ""} à jour`);
  return parts.length ? "Synchronisé : " + parts.join(", ") + "." : "";
}

/* ---------- Messages aux patients et notifications ---------- */
async function ensureVapid() {
  if (demo || !vault || vault.vapid) return false;
  const kp = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  vault.vapid = { priv: await crypto.subtle.exportKey("jwk", kp.privateKey), pub: B64.enc(await crypto.subtle.exportKey("raw", kp.publicKey)) };
  await persist();
  if (relayOn()) for (const pt of Object.values(vault.patients)) await publishCfg(pt);
  return true;
}
/* Confie la clé de notification au relais, pour qu'il puisse envoyer les rappels programmés */
async function pushVapid(force) {

  const r = await relay(vault.relay, { a: "setvapid", token: vault.token, d: vault.vapid.priv.d, pub: vault.vapid.pub });
  if (r.ok) { vault.vapidRelay = vault.vapid.pub; await persistLocal(); }
}
async function vapidJwt(aud) {
  const key = await crypto.subtle.importKey("jwk", vault.vapid.priv, { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]);

}

    flash = ok === "old" ? "Message enregistré, mais votre relais Google n'est pas à jour : remplacer son code par la version 4 (Réglages → Guide), puis Déployer → Gérer les déploiements → Nouvelle version. Le message partira ensuite au prochain envoi." : ok ? "Message envoyé : il s'affichera sur l'écran d'accueil du patient à sa prochaine ouverture." + note : "Message enregistré, mais le relais ne répond pas. Il sera publié au prochain envoi.";
    nav("patients", { code: pt.code, per: view.p.per });
  };
  if (demo) { st.textContent = "(démonstration)"; return; }
  const ep = await subStatus(pt);
  if (!document.body.contains(st)) return;
  if (ep && vault.vapid) { box.disabled = false; st.textContent = "(le patient a activé les notifications)"; }
  else { box.checked = false; st.textContent = "(le patient n'a pas activé les notifications : le message s'affichera à l'ouverture de l'application)"; }
}

function mountBroadcast() {
  const boxes = [...document.querySelectorAll(".bcp")], n = document.getElementById("bcN");
  const count = () => { n.textContent = boxes.filter(b => b.checked).length; };
  boxes.forEach(b => b.onchange = count);
  document.getElementById("bcAll").onclick = () => { boxes.forEach(b => { b.checked = true; }); count(); };
  document.getElementById("bcNone").onclick = () => { boxes.forEach(b => { b.checked = false; }); count(); };
  document.querySelectorAll("[data-bcm]").forEach(b => b.onclick = () => { const m = BC_MODELS[Number(b.dataset.bcm)]; document.getElementById("bcTu").value = m[1]; document.getElementById("bcVous").value = m[2]; });
  const send = document.getElementById("bcSend");
  send.onclick = async () => {
    const tu = document.getElementById("bcTu").value.trim(), vous = document.getElementById("bcVous").value.trim() || tu, err = document.getElementById("bcErr");
    const codes = boxes.filter(b => b.checked).map(b => b.value);
    if (!tu && !vous) { err.textContent = "Écrire un message d'abord."; return; }
    if (!codes.length) { err.textContent = "Choisir au moins un destinataire."; return; }
    err.textContent = ""; send.disabled = true;
    const prog = document.getElementById("bcProg"), notif = document.getElementById("bcNotif").checked;
    let ok = 0, pushed = 0, fail = [];
    for (let i = 0; i < codes.length; i++) {
      const pt = vault.patients[codes[i]];
      prog.innerHTML = `<p class="small">Envoi ${i + 1} sur ${codes.length}…</p>`;
      pt.msgs = pt.msgs || []; pt.msgs.push({ id: uid(), t: new Date().toISOString(), x: pt.tv === "vous" ? vous : (tu || vous), ex: "", all: 1 });
      if (demo) { ok++; continue; }
      const r = await publishMsgs(pt);
      if (r === true) { ok++; if (notif) { const pr = await sendPush(pt); if (pr.ok) pushed++; } }
      else fail.push(pt.label || spaced(pt.code));
    }
    await persist();
    flash = demo ? `Message ajouté pour ${ok} patient(s) (démonstration : rien n'est envoyé).`
      : `Message envoyé à ${ok} patient(s)${notif ? `, dont ${pushed} avec notification` : ""}.${fail.length ? ` Échec pour : ${fail.map(esc).join(", ")} (relais injoignable ou pas à jour) ; le message partira au prochain envoi.` : ""}`;
    nav("patients");
  };
}

async function savePdf(r) {

  setTimeout(() => URL.revokeObjectURL(url), 60000); return "téléchargé";

function report(pt, per) {
  const { from, to, list } = inPeriod(pt, per);

  const ag = by("angst"); if (ag.length) lines.push(`Questionnaire d'Angst : ${ag.map(e => `${fmtD(e.t)} ${e.total}/20`).join(", ")} (seuil > 10).`);
  const el = by("elan"); if (el.length) lines.push(`Suivi de l'élan : ${el.map(e => `${fmtD(e.t)} ${e.oui}/10${elanFlag(e) ? " à explorer" : ""}`).join(", ")}.`);
  { const m = mfStats(list); if (m.mf.length) lines.push(`Pleine conscience : ${m.formal.length} pratique(s), ${m.mins} min au total, ${m.days} jour(s) de pratique${m.inf ? `, ${m.inf} pratique(s) au quotidien` : ""}${m.sc.length ? `, tension moyenne ${r1(avg(m.sc.map(e => e.avant)))} avant, ${r1(avg(m.sc.map(e => e.apres)))} après` : ""}${m.ko.length ? `. Vécus difficiles signalés : ${m.ko.length}` : ""}.`); }
  by("qn").forEach(e => { const sc = qnScore(e); lines.push(`${qnName(e.q)} (${fmtD(e.t)}) : ${sc ? sc.lines.join(" ") : "réponses reçues"}`); });
  const rep = by("repas"); if (rep.length) lines.push(`Repas : ${rep.filter(e => e.slot !== "grig").length} repas notés dont ${rep.filter(e => e.pris === false).length} non pris, ${rep.filter(e => e.slot === "grig").length} grignotages, perte de contrôle ×${rep.filter(e => e.ctrl === "Oui").length}, compensations ×${rep.flatMap(e => e.comp || []).length}.`);
  const env = by("envie"); if (env.length) lines.push(`Envies de crise : ${env.length} (${env.filter(e => e.issue === "J'ai fait une crise").length} avec crise).`);
  const ang = by("angoisse"); if (ang.length) lines.push(`Crises d'angoisse : ${ang.length}, pic moyen ${r1(avg(ang.map(e => e.pic)))}/10.`);
  const sud = by("sud"); if (sud.length) lines.push(`Malaise (SUD) : ${pl(sud.length, "saisie")}, moyenne ${r1(avg(sud.map(e => e.sud)))}/10.`);

      try {
        const r = await importData(await decryptMessage(vault.priv, m));
        if (r.err) { out.push(`<div class="result err">Message du code <b>${esc(spaced(r.code))}</b> : ce patient n'existe pas dans votre espace.</div>`); continue; }
        out.push(`<div class="result"><b>${esc(r.pt.label || r.pt.code)}</b> : ${r.n} nouvelle${r.n > 1 ? "s" : ""} réponse${r.n > 1 ? "s" : ""}${r.dup ? `, ${r.dup} déjà reçue${r.dup > 1 ? "s" : ""}` : ""}. <button class="link" data-nav="patients" data-p='{"code":"${r.pt.code}"}'>Voir la fiche</button></div>`);
      } catch (e) { out.push(`<div class="result err">Un message n'a pas pu être déchiffré : il est incomplet, ou il a été chiffré pour un autre espace.</div>`); }
    }
    await persist();
    document.getElementById("results").innerHTML = out.join("");
    if (msgs.length) document.getElementById("inbox").value = "";
  };
};

/* Réglages et guide du relais */
const GUIDE = [
  ["Créer la feuille Google", "Avec votre compte Gmail, ouvrir <b>sheets.google.com</b> et créer une feuille vierge. La renommer « Entre-Séances relais »."],
  ["Ouvrir l'éditeur de script", "Dans la feuille : menu <b>Extensions</b>, puis <b>Apps Script</b>. Un nouvel onglet s'ouvre."],
  ["Coller le code", "Effacer tout le texte présent, coller le code (bouton « Copier le code » ci-dessous), puis cliquer sur l'icône <b>Enregistrer</b> (disquette)."],
  ["Accorder les autorisations", "En haut, choisir la fonction <b>autoriser</b> puis cliquer <b>Exécuter</b>. Accepter avec votre compte. Si Google affiche « Google n'a pas validé cette application » : <b>Paramètres avancés</b>, puis <b>Accéder à Entre-Séances relais</b>. C'est votre propre script."],
  ["Déployer", "Bouton bleu <b>Déployer</b> → <b>Nouveau déploiement</b> → roue dentée → <b>Application Web</b>. Exécuter en tant que : <b>Moi</b>. Qui a accès : <b>Tout le monde</b>. Cliquer <b>Déployer</b>."],
  ["Connecter votre espace", "Copier l'<b>URL de l'application Web</b> (elle finit par /exec), la coller dans le champ ci-dessous et cliquer <b>Connecter</b>."],
  ["Relier l'application patient", "Sur GitHub, ouvrir le fichier <b>config.js</b>, cliquer sur le crayon, coller la même adresse entre les guillemets, puis <b>Commit changes</b>."]
];
PAGES.reglages = p => {
  if (p.wipe) return `<div class="card stack danger-zone" style="max-width:560px"><h2>Supprimer tout l'espace ?</h2>
    <p>Patients, réponses, photos et clé de déchiffrement seront effacés de cet appareil. Les messages déjà envoyés par vos patients ne pourront plus être lus, sauf si vous restaurez une sauvegarde.</p>
    <div class="row"><button class="btn help" id="wipeYes">Tout supprimer</button><button class="btn ghost" data-nav="reglages">Annuler</button></div></div>`;
  const relayCard = `<div class="card stack"><h3>Réception directe</h3>
      ${relayOn() ? `<p class="result">Connectée. Les patients entrent un code à 6 caractères et leurs réponses arrivent ici automatiquement.</p>` : `<p class="small">Permet les codes courts et l'envoi direct des réponses. Gratuit, avec votre compte Gmail. Google ne stocke que des messages chiffrés, illisibles sans votre clé.</p>`}
      ${demo ? `<p class="notice">Indisponible en démonstration.</p>` : `<div><label class="lbl" for="rurl">Adresse du relais (Apps Script)</label><input type="text" id="rurl" value="${esc(vault.relay || "")}" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <button class="btn ${relayOn() ? "soft" : ""}" id="conn" style="align-self:flex-start">${relayOn() ? "Reconnecter" : "Connecter"}</button><p class="hint" id="cMsg" role="status"></p>
      <button class="link" data-nav="reglages" data-p='{"guide":true}'>Guide pas à pas</button>`}</div>`;
  if (p.guide) return `<button class="link" data-nav="reglages">← Réglages</button><div class="head-row"><div><h1>Configurer la réception directe</h1><p class="muted">Une seule fois, environ 10 minutes, depuis un ordinateur.</p></div></div>
    <div class="split"><ol class="guide">${GUIDE.map(([t, d]) => `<li><b>${t}</b><p>${d}</p></li>`).join("")}</ol>
    <div class="stack"><div class="card stack"><h3>Code du relais</h3><textarea id="gs" class="mono" readonly style="min-height:200px">${esc(RELAIS_GS)}</textarea><button class="btn" id="cpGs">Copier le code</button></div>${relayCard}</div></div>`;
  const cfgLine = `window.ES_RELAIS = "${vault.relay || ""}";`;
  const redCard = `<div class="card stack"><h3>Alertes de suivi</h3>
      <p class="small">Une alerte rouge apparaît sur la liste et sur la fiche quand un patient note son humeur <b>sous 5/10</b>, ou la qualité de sa nuit à <b>1 ou 2 sur 5</b>, <b>au moins 3 jours d'affilée</b>. Elle est calculée uniquement dans votre espace : le patient n'en sait rien.</p>
      <p class="small">Recevoir aussi une notification sur cet appareil, quand l'espace praticienne est ouvert (même en arrière-plan sur ordinateur) :</p>
      <div class="row"><button class="btn ${vault.redNotif && typeof Notification !== "undefined" && Notification.permission === "granted" ? "soft" : ""}" id="redN">${vault.redNotif && typeof Notification !== "undefined" && Notification.permission === "granted" ? "Notifications d'alerte activées · désactiver" : "Activer les notifications d'alerte"}</button></div><p class="hint" id="redNi"></p></div>`;
  const diagCard = relayOn() ? `<div class="card stack"><h3>Vérifier la liaison</h3>
      <p class="small">Le fichier <b>config.js</b> du site doit contenir exactement cette ligne (copiez-la et remplacez toute la ligne existante sur GitHub) :</p>
      <textarea id="cfgl" class="mono" readonly style="min-height:70px">${esc(cfgLine)}</textarea>
      <div class="row"><button class="btn soft" id="cpCfg">Copier la ligne</button><button class="btn" id="diag">Lancer la vérification</button></div>
      <div id="diagOut" class="stack"></div>
      ${(vault.failed || []).length ? `<p class="notice small">${vault.failed.length} message(s) n'ont pas pu être ajoutés : ${vault.failed.slice(-5).map(f => `${spaced(f.code)} (${f.why})`).join(" ; ")}.</p>` : ""}
      <button class="link" id="reread">Relire tous les messages du relais depuis le début</button></div>` : "";
  const syncCard = relayOn() ? `<div class="card stack"><h3>Synchronisation entre mes appareils</h3>
      <p class="small">Votre espace (patients, réponses, messages, exercices perso) est recopié automatiquement entre l'ordinateur et le téléphone, à chaque ouverture et après chaque modification. La copie stockée dans votre Google Drive est chiffrée : seuls vos appareils peuvent la lire.</p>
      <p class="small muted">${vault.lastSync ? "Dernière synchronisation : " + fmtDT(vault.lastSync) : "Pas encore synchronisé."} · ${Object.keys(vault.patients).length} patient(s) dans cet espace.</p>
      <button class="btn" id="syncNow" style="align-self:flex-start">Synchroniser maintenant</button><p class="hint" id="syncMsg" role="status"></p>
      <p class="hint">Les photos de repas restent sur l'appareil qui les a reçues.</p></div>` : "";
  return `<div class="head-row"><h1>Réglages</h1></div>
  <div class="split">
    ${redCard}${relayCard}${syncCard}${diagCard}
    <div class="card stack"><h3>Informations transmises aux patients</h3>
      <div><label class="lbl" for="url">Lien de l'application patient</label><input type="text" id="url" value="${esc(vault.appUrl || "")}" placeholder="https://…"><p class="hint">Sert au QR code et au message d'invitation.</p></div>
      <div><label class="lbl" for="em">Adresse mail (envoi manuel de secours)</label><input type="text" id="em" value="${esc(vault.email)}"></div>
      <button class="btn soft" id="saveS" style="align-self:flex-start">Enregistrer</button><p class="hint" id="sMsg" role="status"></p></div>
    <div class="card stack"><h3>Sauvegarde</h3>
      <p class="small">Copie chiffrée de tout votre espace (patients, réponses, connexion au relais), protégée par votre mot de passe. Les photos ne sont pas incluses : enregistrez celles à garder dans le dossier du patient. Refaites la sauvegarde après chaque relevé important.</p>
      ${demo ? `<p class="notice">Indisponible en démonstration.</p>` : `<button class="btn" id="bk">Générer la sauvegarde</button><textarea id="bkTxt" class="mono" readonly hidden style="min-height:120px"></textarea>`}
      <p class="small muted">Version de l'application : ${APP_VERSION}</p>
      <h3 style="margin-top:8px">Sécurité</h3>
      <p class="small">L'espace se verrouille après ${LOCK_MIN} minutes sans activité. Empreinte de votre clé publique : <span class="mono">${esc(vault.pub.slice(0, 16))}…</span></p>
      ${demo ? "" : `<button class="link" data-nav="reglages" data-p='{"wipe":true}'>Supprimer tout l'espace de cet appareil</button>`}</div>
  </div>`;
};
MOUNTS.reglages = p => {
  if (p.wipe) { document.getElementById("wipeYes").onclick = () => { lsDel(VKEY); try { indexedDB.deleteDatabase("es_pro_photos"); } catch (e) {} lock(); }; return; }
  const gs = document.getElementById("cpGs"); if (gs) gs.onclick = async e => { const t = document.getElementById("gs"); if (!(await copyText(RELAIS_GS, e.currentTarget))) selectAll(t); };
  const conn = document.getElementById("conn");
  if (conn) conn.onclick = async () => {
    const m = document.getElementById("cMsg"); conn.disabled = true; m.textContent = "Connexion…";
    const err = await connectRelay(document.getElementById("rurl").value);
    conn.disabled = false;
    if (err) { m.textContent = err; return; }
    flash = "Réception directe connectée. Les exercices de vos patients ont été publiés. Dernière étape : coller la même adresse dans config.js sur GitHub."; nav("reglages");
  };
  const sn = document.getElementById("syncNow");
  if (sn) sn.onclick = async () => {
    const m = document.getElementById("syncMsg"); sn.disabled = true; m.textContent = "Synchronisation…";
    try {
      const sm = await syncVault(); const rr = await rereadFailed();
      flash = [syncSummary(sm) || "Cet appareil est à jour.", rr && rr.n ? "Messages récupérés : " + inboxSummary(rr) : ""].filter(Boolean).join(" ");
      nav("reglages");
    } catch (e) { m.textContent = e.detail || "Synchronisation impossible : vérifier la connexion."; sn.disabled = false; }
  };
  const cc = document.getElementById("cpCfg"); if (cc) cc.onclick = async e => { const t = document.getElementById("cfgl"); if (!(await copyText(t.value, e.currentTarget))) selectAll(t); };
  const rr = document.getElementById("reread");
  if (rr) rr.onclick = async () => { rr.textContent = "Relecture…"; vault.cursor = 0; try { flash = inboxSummary(await fetchInbox()); } catch (e) { flash = e.detail || "Le relais ne répond pas."; } nav("reglages"); };
  const dg = document.getElementById("diag");
  if (dg) dg.onclick = async () => {
    const out = document.getElementById("diagOut"), line = (ok, t) => `<p class="small">${ok ? "✔" : "✖"} ${t}</p>`;
    dg.disabled = true; out.innerHTML = `<p class="small">Vérification…</p>`; let h = "";
    try {
      const pg = await relay(vault.relay, { a: "ping" }); h += line(!!pg.ok, `Le relais répond (version ${pg.v || "1 à 3"} ; version attendue : 6).`);
      if (pg.sheet === false) h += line(false, "Le relais n'arrive pas à utiliser sa feuille Google : " + esc(pg.why) + ". Dans Apps Script, exécuter la fonction « autoriser », puis publier une nouvelle version.");
      else if (pg.sheet === undefined || (pg.v || 0) < 5) h += line(false, "Le code du relais est ancien : le remplacer par celui du guide, puis Déployer → Gérer les déploiements → crayon → Nouvelle version.");
      else h += line(true, "Le relais peut ranger les messages.");
      if ((pg.v || 0) >= 6) {
        h += line(!!pg.trig, pg.trig ? "Les rappels quotidiens sont actifs." : "Rappels quotidiens inactifs : dans Apps Script, exécuter la fonction « autoriser » une fois.");
        if (!pg.vapid) { try { await pushVapid(true); h += line(true, "Clé de notification transmise au relais."); } catch (e) { h += line(false, "Clé de notification non transmise."); } }
      }
      const ck = await relay(vault.relay, { a: "check", token: vault.token }); h += line(!!ck.ok, ck.ok ? "Votre espace est bien le propriétaire du relais." : "Ce relais appartient à un autre espace (clé différente).");
      let pubOk = 0, pubKo = [];
      for (const pt of Object.values(vault.patients)) { (await publishCfg(pt)) ? pubOk++ : pubKo.push(spaced(pt.code)); }
      h += line(!pubKo.length, `Exercices publiés pour ${pubOk} patient(s)${pubKo.length ? ", échec pour " + pubKo.join(", ") : ""}.`);
      const ib = await relay(vault.relay, { a: "inbox", token: vault.token, since: 0 }, 120000);
      if (ib.ok) {
        const codes = {}; ib.items.forEach(it => codes[it.code] = (codes[it.code] || 0) + 1);
        h += line(true, `${ib.items.length} message(s) stocké(s) dans le relais${ib.items.length ? " : " + Object.entries(codes).map(([c, n]) => `${spaced(c)} ×${n}${vault.patients[c] ? "" : " (code inconnu ici)"}`).join(", ") : ""}.`);
        const unk = [...new Set(ib.items.map(it => it.code).filter(c => !vault.patients[c]))];
        if (unk.length) h += `<div class="notice small">${unk.length > 1 ? "Ces codes ne correspondent" : "Ce code ne correspond"} à aucune fiche de cet espace. Recréer la fiche relit ses réglages dans le relais et ajoute toutes ses réponses :<div class="stack" style="margin-top:8px">${unk.map(c => `<div class="row"><span class="code-chip">${spaced(c)}</span><button class="btn soft" data-recover="${c}">Recréer la fiche</button></div>`).join("")}</div></div>`;
        if (!ib.items.length) h += `<p class="notice small">Aucun message n'est arrivé au relais : le problème se situe côté application patient. Vérifiez le fichier config.js (ligne ci-dessus), puis sur le téléphone du patient : Réglages → Liaison avec la psychologue → Vérifier la liaison.</p>`;
        const pending = ib.items.filter(it => it.seq > (vault.cursor || 0)).length;
        if (pending) h += line(false, `${pending} message(s) pas encore relevé(s) : utiliser « Relever les réponses ».`);
      }
    } catch (e) { h += line(false, esc(e.detail || "Relais injoignable.")); }
    out.innerHTML = h; dg.disabled = false; mountRecover();
  };
  const rn = document.getElementById("redN");
  if (rn) rn.onclick = async () => {
    const info = document.getElementById("redNi");
    if (typeof Notification === "undefined") { info.textContent = "Cet appareil ne permet pas les notifications depuis un site. Sur iPhone, installez d'abord l'espace praticienne sur l'écran d'accueil (Partager → Sur l'écran d'accueil)."; return; }
    if (vault.redNotif && Notification.permission === "granted") { vault.redNotif = false; await persist(); render(); return; }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { info.textContent = "Les notifications ont été refusées. Vous pouvez les autoriser dans les réglages du navigateur pour ce site."; return; }
    vault.redNotif = true; vault.notified = vault.notified || {};
    for (const [pt, al] of redPatients()) for (const r of al) vault.notified[`${pt.code}|${r.k}|${r.to}`] = new Date().toISOString(); /* pas de rafale pour les alertes déjà visibles */
    await persist(); flash = "Notifications d'alerte activées sur cet appareil."; render();
  };
  const ss = document.getElementById("saveS");
  if (ss) ss.onclick = async () => { vault.email = document.getElementById("em").value.trim(); vault.appUrl = document.getElementById("url").value.trim().replace(/\/+$/, ""); await persist(); for (const pt of Object.values(vault.patients)) await publishCfg(pt); document.getElementById("sMsg").textContent = demo ? "Enregistré pour cette démonstration." : "Enregistré."; };
  const bk = document.getElementById("bk");
  if (bk) bk.onclick = async () => { await persist(); const t = document.getElementById("bkTxt"); t.hidden = false; t.value = "SAUV1." + B64.enc(TE.encode(JSON.stringify(lsGet(VKEY)))); if (!(await copyText(t.value, bk))) selectAll(t); };
};

render();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
