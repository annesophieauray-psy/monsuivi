<!doctype html><html lang="fr"><head><meta charset="utf-8">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<title>Entre-Séances</title>

<style>
/* Concept : carnet calme et lisible — une colonne, de grands boutons, peu d'éléments à la fois.
   Couleurs : lagune (vert d'eau profond), ambre pour l'énergie, rouge réservé à l'aide. */
:root {
  --bg: #EDF3F1; --surface: #FFFFFF; --surface-2: #E1EBE7; --ink: #15302C; --muted: #52706A;
  --line: #C6D7D2; --accent: #1E6A64; --accent-ink: #FFFFFF; --accent-soft: #D2E8E3;
  --sun: #C98A1C; --sun-soft: #F6E7C8; --help: #B3321F; --help-soft: #F8E1DC;
  --ok: #2E7D4F; --s0: #1C4FC4; --s1: #15302C; --muet: #C8372D;
  --z1: #3E9B63; --z2: #8DB43F; --z3: #E0B12E; --z4: #E07B2E; --z5: #C9412F;
  --f-display: "Lexend", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-dys: "Lexend", "Verdana", system-ui, sans-serif;
  --scale: 1;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1918; --surface: #162422; --surface-2: #1E302D; --ink: #E2EEEA; --muted: #9AB5AF;
    --line: #2B413D; --accent: #6BC2B8; --accent-ink: #0E1918; --accent-soft: #1C3A36;
    --sun: #F0B654; --sun-soft: #3A2F18; --help: #FF8B76; --help-soft: #3A1E19;
    --ok: #6FCF97; --s0: #8DB2FF; --s1: #E2EEEA; --muet: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1918; --surface: #162422; --surface-2: #1E302D; --ink: #E2EEEA; --muted: #9AB5AF;
  --line: #2B413D; --accent: #6BC2B8; --accent-ink: #0E1918; --accent-soft: #1C3A36;
  --sun: #F0B654; --sun-soft: #3A2F18; --help: #FF8B76; --help-soft: #3A1E19;
  --ok: #6FCF97; --s0: #8DB2FF; --s1: #E2EEEA; --muet: #FF8A80; color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  font-size: calc(17px * var(--scale)); line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 1.6em; } h2 { font-size: 1.3em; } h3 { font-size: 1.08em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.small { font-size: 0.86em; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 12px 20px; border-radius: 999px; border: 2px solid transparent;
  background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 500;
  cursor: pointer; text-decoration: none; text-align: center;
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn.soft { background: var(--accent-soft); color: var(--ink); }
.btn.help { background: var(--help); color: #fff; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 6px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
label.lbl, .lbl { font-family: var(--f-display); font-weight: 500; display: block; margin-bottom: 6px; }
.hint { font-size: 0.86em; color: var(--muted); margin-top: 4px; }
input[type=text], input[type=password], input[type=time], input[type=number], textarea, select {
  width: 100%; box-sizing: border-box; background: var(--surface); border: 2px solid var(--line);
  border-radius: 12px; padding: 12px 14px; min-height: 50px;
}
textarea { min-height: 96px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px;
  min-height: 44px; cursor: pointer; font-family: var(--f-body);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.range { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.range output { font-family: var(--f-display); font-weight: 600; font-size: 1.3em; min-width: 2.6em; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 34px; }
.scale-ends { display: flex; justify-content: space-between; font-size: 0.82em; color: var(--muted); margin-top: -2px; }
.notice { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 0.92em; }
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.8em; word-break: break-all; }
/* Lecture adaptée */
.dys body, .dys { --f-body: var(--f-dys); }
.dys body { letter-spacing: 0.04em; word-spacing: 0.16em; line-height: 1.85; }
.dys h1, .dys h2, .dys h3 { letter-spacing: 0.02em; line-height: 1.4; }
.dys p, .dys li { max-width: 34em; }
.syl.s0 { color: var(--s0); }
.syl.s1 { color: var(--s1); }
.muet { color: var(--muet); opacity: 0.9; }
.btn .syl, .chip .syl, .btn .muet, .chip .muet, .chip[aria-pressed="true"] .syl { color: inherit; }
.btn .muet, .chip .muet { opacity: 0.65; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
.shell { max-width: 620px; margin: 0 auto; padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0;
  border-bottom: 1px solid var(--line); margin-bottom: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 600; font-size: 1.05em; }
.top-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
}
.help-btn {
  min-height: 48px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--help); color: #fff;
  font-family: var(--f-display); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 0; font-family: var(--f-display); font-weight: 500; }
.greet { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.greet .date { color: var(--muted); font-size: 0.9em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.tile {
  display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer;
  min-height: 84px;
}
.tile:hover { border-color: var(--accent); }
.tile-ico { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); }
.tile-t { font-family: var(--f-display); font-weight: 600; display: block; }
.tile-d { color: var(--muted); font-size: 0.88em; display: block; margin-top: 2px; }
.send-banner {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--sun-soft);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; border: 0; width: 100%; text-align: left; cursor: pointer; color: var(--ink);
}
.send-banner b { font-family: var(--f-display); }
.screen-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.screen-head p { color: var(--muted); }
.weathers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.weather {
  border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 4px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.78em; color: var(--ink);
}
.weather svg { width: 42px; height: 42px; }
.weather[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.steps-dots { display: flex; gap: 6px; }
.steps-dots span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps-dots span.on { background: var(--accent); }
.wiz-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
details.ex { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; }
details.ex summary { cursor: pointer; font-family: var(--f-display); font-weight: 500; color: var(--accent); }
.sud-big { font-family: var(--f-display); font-size: 3.4em; font-weight: 600; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.sud-desc { text-align: center; color: var(--muted); min-height: 1.6em; }
.sud-bar { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--z1), var(--z3), var(--z5)); }
.ladder { display: flex; flex-direction: column; gap: 8px; }
.rung {
  display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; color: var(--ink);
}
.rung .lvl { width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; color: #fff; }
.rung .cnt { font-size: 0.82em; color: var(--muted); text-align: right; }
.faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.faces .chip { padding: 8px 4px; border-radius: 12px; font-size: 0.8em; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.breath-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.breath-canvas { width: 100%; max-width: 420px; aspect-ratio: 1 / 1; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.breath-label { font-family: var(--f-display); font-size: 1.8em; font-weight: 600; min-height: 1.3em; text-align: center; }
.breath-time { color: var(--muted); font-variant-numeric: tabular-nums; }
.dots-count { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.dot-tap { width: 56px; height: 56px; border-radius: 50%; border: 3px dashed var(--accent); background: transparent; cursor: pointer; }
.dot-tap[aria-pressed="true"] { background: var(--accent); border-style: solid; }
.big-num { font-family: var(--f-display); font-size: 4em; font-weight: 600; color: var(--accent); line-height: 1; text-align: center; }
.task-steps { display: flex; flex-direction: column; gap: 8px; }
.task-step { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.task-step span { min-width: 0; overflow-wrap: anywhere; }
.task-step.done span { text-decoration: line-through; color: var(--muted); }
.current-step { background: var(--accent-soft); border-radius: var(--radius); padding: 22px 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
.current-step .what { font-family: var(--f-display); font-size: 1.45em; font-weight: 600; overflow-wrap: anywhere; }
.timer-canvas { width: 220px; height: 220px; max-width: 100%; display: block; margin: 0 auto; }
.gauge { display: flex; flex-direction: column-reverse; gap: 6px; }
.gauge-lvl {
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; border: 3px solid transparent;
  background: var(--surface); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; color: var(--ink);
}
.gauge-lvl .sw { width: 44px; height: 32px; border-radius: 8px; }
.gauge-lvl[aria-pressed="true"] { border-color: var(--ink); }
.fiche li { margin-bottom: 8px; }
.fiche ul { padding-left: 1.2em; margin: 0; }
.help-hero { background: var(--help-soft); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.numbers { display: flex; flex-direction: column; gap: 10px; }
.num-card { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.num-card .n { font-family: var(--f-display); font-weight: 700; font-size: 1.7em; color: var(--help); grid-row: span 2; font-variant-numeric: tabular-nums; text-decoration: none; user-select: all; }
.num-card .w { font-family: var(--f-display); font-weight: 600; }
.num-card .d { color: var(--muted); font-size: 0.88em; }
.sent-list { margin: 0; padding-left: 1.2em; }
.msg-box { min-height: 120px; }
ol.how { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }
.toggle { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.switch { appearance: none; -webkit-appearance: none; width: 56px; height: 32px; border-radius: 16px; background: var(--line); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { left: 28px; }
.choice { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer; color: var(--ink); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice .t { font-family: var(--f-display); font-weight: 600; }
.preview { background: var(--surface); border-radius: 12px; padding: 14px; border: 1px dashed var(--line); }
.done-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 24px; }
.done-hero svg { width: 84px; height: 84px; color: var(--ok); }
.code-chip { font-family: var(--f-display); font-weight: 600; background: var(--surface-2); border-radius: 8px; padding: 2px 8px; letter-spacing: 0.06em; }
@media (max-width: 420px) {
  .help-btn .lab-long { display: none; }
  .weather { font-size: 0.7em; }
  .weather svg { width: 34px; height: 34px; }
}
.sec-title { font-size: 1.05em; margin: 22px 0 10px; color: var(--muted); }
.moods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mood { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px 4px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); font-size: 0.85em; }
.mood[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset; }
.battery { position: relative; display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; padding: 6px; border: 3px solid var(--ink); border-radius: 12px; margin-right: 12px; }
.battery .nub { position: absolute; right: -12px; top: 50%; transform: translateY(-50%); width: 7px; height: 22px; background: var(--ink); border-radius: 0 4px 4px 0; }
.battery .cell { height: 48px; border: 0; border-radius: 5px; background: var(--surface-2); cursor: pointer; padding: 0; }
.battery .cell.on { background: var(--sun); }
.battery .cell.on:nth-child(-n+3) { background: var(--z4); }
.battery .cell.on:nth-child(n+4):nth-child(-n+7) { background: var(--z3); }
.battery .cell.on:nth-child(n+8) { background: var(--z1); }
.bat-desc { font-family: var(--f-display); font-weight: 500; margin-top: 4px; }
.qlist { list-style: none; counter-reset: q; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.qitem { counter-increment: q; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.qtext::before { content: counter(q) ". "; font-family: var(--f-display); font-weight: 600; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.segb { min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-family: var(--f-display); font-weight: 500; color: var(--ink); }
.segb[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sticky-send { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); }
.sent-ok { color: var(--ok); font-family: var(--f-display); font-weight: 600; }
.code-input { font-family: var(--f-display); font-size: 1.9em !important; letter-spacing: 0.18em; text-align: center; text-transform: uppercase; min-height: 64px !important; }
.big-how { gap: 12px; font-size: 1.02em; margin-top: 12px; }
.daynav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px; text-align: center; }
.daynav .dlab { font-family: var(--f-display); text-transform: none; }
.daynav .icon-btn[disabled] { opacity: .35; }
.flip svg { transform: scaleX(-1); }
.meals { display: flex; flex-direction: column; gap: 8px; }
.meal { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; color: var(--ink); }
.meal-t { font-family: var(--f-display); font-weight: 600; }
.st { font-size: 0.82em; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.st.todo { background: var(--surface-2); color: var(--muted); }
.st.ok { background: var(--accent-soft); color: var(--ink); }
.st.skip { background: var(--sun-soft); color: var(--ink); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.photo-btn { width: 100%; }
.ph-prev { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.ph-prev img { border-radius: 12px; max-height: 260px; object-fit: cover; width: 100%; }
.rassure { text-align: center; font-size: 1.1em; min-height: 3.2em; max-width: 26em; }
.msgs-home { margin-bottom: 18px; }
.msg-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.msg-card.unread { border: 2px solid var(--accent); background: var(--accent-soft); }
.msg-head { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; color: var(--accent); }
.msg-head b { color: var(--ink); font-family: var(--f-display); }
.msg-head .small { grid-column: 2; }
.msg-text { overflow-wrap: anywhere; }
.msgs-link { display: inline-flex; align-items: center; gap: 6px; margin: -6px 0 14px; }
.sync-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }

const B64 = {
  enc(buf) {
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s = ""; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

}

async function pack(obj) {

    try { const c = await streamThrough(raw, new CompressionStream("deflate-raw"));
      const out = new Uint8Array(c.length + 1); out[0] = 1; out.set(c, 1); return out; } catch (e) {}
  }
  const out = new Uint8Array(raw.length + 1); out[0] = 0; out.set(raw, 1); return out;
}
async function unpack(u8) {

/* Chiffrement patient -> praticienne : ECDH P-256 éphémère + AES-GCM 256
   Message : PSY1.<clé éphémère (65 o) | iv (12 o) | données chiffrées> */
const ECDH = { name: "ECDH", namedCurve: "P-256" };
const AAD = TE.encode("PSY1");
async function encryptForPractitioner(pubB64, obj) {
  const pub = await crypto.subtle.importKey("raw", B64.dec(pubB64), ECDH, false, []);
  const eph = await crypto.subtle.generateKey(ECDH, true, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, eph.privateKey,
    { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: AAD }, key, await pack(obj)));
  const epk = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const out = new Uint8Array(65 + 12 + ct.length);
  out.set(epk, 0); out.set(iv, 65); out.set(ct, 77);
  return "PSY1." + B64.enc(out);
}
async function decryptMessage(privJwk, msg) {
  const m = String(msg).match(/PSY1\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("format");
  const all = B64.dec(m[1]);
  const priv = await crypto.subtle.importKey("jwk", privJwk, ECDH, false, ["deriveKey"]);
  const epk = await crypto.subtle.importKey("raw", all.slice(0, 65), ECDH, false, []);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: epk }, priv,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(65, 77), additionalData: AAD }, key, all.slice(77));
  return unpack(new Uint8Array(pt));
}

/* ===== Lecture adaptée : découpage syllabique et lettres muettes (approximation) ===== */
const VOY = "aeiouyàâäéèêëîïôöùûüÿœæ";
const isVoy = c => VOY.includes(c);
const INSEP = /^(bl|br|cl|cr|dr|fl|fr|gl|gr|pl|pr|tr|vr|ch|ph|gn|th|qu|gu)$/;
function syllabes(word) {
  const w = word.toLowerCase(), n = w.length;
  if (n <= 3) return [word];
  const v = [];
  for (let i = 0; i < n; i++) {
    let x = isVoy(w[i]);
    if (w[i] === "u" && i > 0 && (w[i - 1] === "q" || (w[i - 1] === "g" && i + 1 < n && "eiéèêy".includes(w[i + 1])))) x = false;
    v.push(x);
  }
  const nuc = []; let i = 0;
  while (i < n) { if (v[i]) { let j = i; while (j + 1 < n && v[j + 1]) j++; nuc.push([i, j]); i = j + 1; } else i++; }
  if (nuc.length < 2) return [word];
  const cuts = [];
  for (let k = 0; k < nuc.length - 1; k++) {
    const a = nuc[k][1] + 1, b = nuc[k + 1][0], cl = w.slice(a, b), L = cl.length;
    const ins = L >= 2 && INSEP.test(cl.slice(-2));
    cuts.push(L === 1 ? a : L === 2 ? (ins ? a : a + 1) : (ins ? b - 2 : b - 1));
  }
  const out = []; let p = 0;
  for (const c of cuts) { out.push(word.slice(p, c)); p = c; }
  out.push(word.slice(p));
  return out.filter(Boolean);
}

const EXC_E = new Set("le je me te se ce de ne que".split(" "));
function lettresMuettes(word) {
  const w = word.toLowerCase(), n = w.length, set = new Set();
  if (n >= 2 && w[0] === "h" && isVoy(w[1])) set.add(0);
  if (n < 2) return set;
  let idx = n - 1, steps = 0, lastWasE = false;
  while (idx > 0 && steps < 3) {
    const c = w[idx], prev = w[idx - 1];
    let mute = false;
    if (steps === 0) {
      if (c === "s" && prev !== "s" && !EXC_S.has(w)) mute = true;
      else if (c === "x" && !EXC_X.has(w)) mute = true;
    }
    if (!mute && c === "e" && !lastWasE && idx >= 2 && !EXC_E.has(w.slice(0, idx + 1)) && (steps === 0 || w[idx + 1] === "s")) mute = true;
    else if (!mute && steps <= 1 && !lastWasE) {
      if (c === "t" && !EXC_T.has(w) && (isVoy(prev) || "ncps".includes(prev))) mute = true;
      else if (c === "d" && !EXC_D.has(w) && (isVoy(prev) || "nr".includes(prev))) mute = true;
      else if (c === "p" && !EXC_P.has(w) && (isVoy(prev) || "m".includes(prev))) mute = true;

function adapterTexte(root, opts) {
  if (!opts || (!opts.syl && !opts.muet)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = node.parentElement;
      if (!p || p.closest("textarea,input,select,svg,script,style,.no-lis,code")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  let alt = 0;
  for (const node of nodes) {
    const parts = node.nodeValue.split(/([A-Za-zÀ-ÖØ-öø-ÿœŒæÆ]+)/);
    if (parts.length === 1) continue;
    const frag = document.createDocumentFragment();
    for (let k = 0; k < parts.length; k++) {
      const part = parts[k];
      if (!part) continue;
      if (k % 2 === 0) { frag.appendChild(document.createTextNode(part)); continue; }
      const muettes = opts.muet ? lettresMuettes(part) : new Set();
      const syls = opts.syl ? syllabes(part) : [part];
      const wspan = document.createElement("span"); wspan.className = "mot";
      let pos = 0;
      for (const s of syls) {
        const sp = document.createElement("span");
        if (opts.syl) sp.className = "syl s" + (alt++ % 2);
        for (let c = 0; c < s.length; c++) {
          if (muettes.has(pos + c)) { const m = document.createElement("span"); m.className = "muet"; m.textContent = s[c]; sp.appendChild(m); }
          else sp.appendChild(document.createTextNode(s[c]));
        }
        pos += s.length; wspan.appendChild(sp);
      }
      frag.appendChild(wspan);
    }
    node.parentNode.replaceChild(frag, node);
  }
}

async function relay(url, body, ms = 20000) {
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), ms) : 0;
  try {
    const r = await fetch(url, { method: "POST", body: JSON.stringify(body), redirect: "follow", signal: ctl ? ctl.signal : undefined });
    const txt = await r.text();
    try { return JSON.parse(txt); }
    catch (e) {

      const err = new Error("reponse"); err.detail = `Réponse inattendue du relais (code ${r.status}${why ? ", « " + why[1].trim() + " »" : ""}).`; throw err;
    }
  } catch (e) {
    if (!e.detail) e.detail = e.name === "AbortError" ? "Le relais n'a pas répondu à temps." : "Relais injoignable : pas de connexion internet, adresse incorrecte, ou accès du déploiement différent de « Tout le monde ».";

}
/* Réduit une photo (≤ 900 px, JPEG) pour l'envoi */
function shrinkPhoto(file, max = 900, q = 0.62) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
/* Petit stockage IndexedDB pour les photos (localStorage est trop petit) */
const PhotoDB = {
  db: null,
  open(name) {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(name, 1);
        r.onupgradeneeded = () => r.result.createObjectStore("p");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async op(name, mode, fn) {
    const db = await this.open(name);
    return new Promise((res, rej) => { const tx = db.transaction("p", mode); const st = tx.objectStore("p"); const rq = fn(st); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); });
  },
  put(name, k, v) { return this.op(name, "readwrite", st => st.put(v, k)); },
  get(name, k) { return this.op(name, "readonly", st => st.get(k)); },
  del(name, k) { return this.op(name, "readwrite", st => st.delete(k)); }
};

async function sendEntries(list) {
  if (!canDirect() || !list.length) return false;
  const plain = list.filter(e => e.photo !== true), photos = list.filter(e => e.photo === true);
  const batches = [];
  for (let i = 0; i < plain.length; i += 60) batches.push(plain.slice(i, i + 60));
  photos.forEach(e => batches.push([e]));
  for (const b of batches) {
    const items = [];
    for (const e of b) {
      const o = Object.assign({}, e); delete o.sent;
      if (e.photo === true) { try { o.img = await PhotoDB.get("es_photos", e.id); } catch (x) {} if (!o.img) o.photo = "perdue"; }
      items.push(o);
    }
    const msg = await encryptForPractitioner(S.cfg.k, { v: 1, c: S.cfg.c, s: new Date().toISOString(), e: items });
    let r; try { r = await relay(RELAIS, { a: "send", code: S.cfg.c, msg }, 90000); } catch (x) { S.lastErr = { t: new Date().toISOString(), m: x.detail || "Erreur réseau." }; save(); return false; }
    if (!r || !r.ok) { S.lastErr = { t: new Date().toISOString(), m: r && r.err === "inconnu" ? "Le relais ne connaît pas ce code : la psychologue doit rouvrir la fiche du patient pour republier ses exercices." : "Le relais a refusé le message (" + ((r && r.err) || "?") + ")." }; save(); return false; }
    S.lastOk = new Date().toISOString(); S.lastErr = null;
    for (const e of b) { e.sent = true; if (e.photo === true) { e.photo = "envoyee"; try { await PhotoDB.del("es_photos", e.id); } catch (x) {} } }
    save();
  }
  return true;
}

}

      ${field("Ce qui a déclenché l'envie (facultatif)", `<textarea id="decl" maxlength="300"></textarea>`, noPerso())}
      <button class="btn wide" id="fin">Enregistrer</button></div>`;
  },
  mount(p) {
    const ph = p.phase || "start";
    if (ph === "start") document.getElementById("go").onclick = () => go("envie", { phase: "run", av: num("av"), act: getChips("act"), dur: parseInt(getChips("dur")[0] || "15", 10), t0: Date.now() });
    if (ph === "run") runSurf(p);
    if (ph === "fin") {
      document.querySelectorAll('.chips[data-name="issue"] .chip').forEach(b => b.addEventListener("picked", () => { document.getElementById("cmsg").hidden = b.dataset.v !== "J'ai fait une crise"; }));
      document.getElementById("fin").onclick = () => {
        addEntry("envie", { avant: p.av, apres: num("ap"), issue: getChips("issue")[0] || "", activites: p.act || [], minutes: Math.round((Date.now() - p.t0) / 60000), declencheur: val("decl").trim() });
        saved("envie");
      };
    }
  }
};
function runSurf(p) {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), lab = document.getElementById("lab"), tm = document.getElementById("tm");
  const total = p.dur * 60000, t0 = performance.now(), col = { a: cssVar("--accent"), soft: cssVar("--accent-soft"), ink: cssVar("--ink"), sun: cssVar("--sun") };
  let raf, stop = false; const release = wakeLock();
  function frame(now) {
    if (stop) return;
    const el = now - t0, pr = Math.min(1, el / total), W = cv.width, H = cv.height, amp = Math.sin(Math.PI * Math.min(1, pr * 1.15));
    ctx.fillStyle = col.soft; ctx.fillRect(0, 0, W, H);
    const crestX = W * (0.15 + 0.7 * pr);
    for (let layer = 0; layer < 2; layer++) {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 5) {
        const swell = Math.exp(-Math.pow((x - crestX) / 120, 2)) * amp * H * 0.42;
        ctx.lineTo(x, H * 0.78 - swell + layer * 20 + Math.sin(x / 60 + now / (800 + layer * 300)) * 8);
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.globalAlpha = layer ? 1 : 0.45; ctx.fillStyle = col.a; ctx.fill();
    }
    ctx.globalAlpha = 1;
    const ph = pr < 0.35 ? "La vague monte" : pr < 0.6 ? "Elle est au plus haut" : pr < 1 ? "Elle redescend" : "La vague est passée";
    if (lab.textContent !== ph) lab.textContent = ph;
    const s = Math.ceil((total - Math.min(el, total)) / 1000); tm.textContent = s > 0 ? `Encore ${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : "";
    if (pr >= 1) { done(); return; }
    raf = requestAnimationFrame(frame);
  }
  function done() { stop = true; cancelAnimationFrame(raf); release(); go("envie", Object.assign({}, p, { phase: "fin" })); }
  document.getElementById("stop").onclick = done;
  raf = requestAnimationFrame(frame);
  cleanup = () => { stop = true; cancelAnimationFrame(raf); release(); };
}

function runBreath(p) {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), lab = document.getElementById("lab"), tm = document.getElementById("tm");
  const total = p.dur * 60 * 1000, t0 = performance.now();
  const col = { a: cssVar("--accent"), soft: cssVar("--accent-soft"), sun: cssVar("--sun"), line: cssVar("--line"), ink: cssVar("--ink") };
  let raf, stopped = false; const release = wakeLock();
  const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * x);
  function frame(now) {
    if (stopped) return;
    const el = now - t0, left = Math.max(0, total - el);
    const W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
    let label;
    if (p.ex === "vague") {
      const cyc = (el % 10000) / 5000, insp = cyc < 1, f = insp ? ease(cyc) : 1 - ease(cyc - 1);
      label = insp ? "Inspire" : "Expire"; if (S.prefs.tv === "vous") label = insp ? "Inspirez" : "Expirez";
      const secs = Math.ceil(5 - (cyc % 1) * 5);
      const level = H * (0.82 - 0.6 * f);
      ctx.fillStyle = col.soft; ctx.fillRect(0, 0, W, H);
      for (let layer = 0; layer < 2; layer++) {
        ctx.beginPath(); ctx.moveTo(0, H);
        for (let x = 0; x <= W; x += 6) ctx.lineTo(x, level + layer * 18 + Math.sin(x / 70 + now / (900 + layer * 300) + layer) * (14 - layer * 4));
        ctx.lineTo(W, H); ctx.closePath(); ctx.globalAlpha = layer ? 1 : 0.45; ctx.fillStyle = col.a; ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.fillStyle = col.ink; ctx.font = "600 64px Lexend, sans-serif"; ctx.textAlign = "center";
      ctx.fillText(String(secs), W / 2, 110);
    } else {
      const side = Math.floor((el % 16000) / 4000), f = (el % 4000) / 4000, m = 120, L = W - 2 * m;
      const names = S.prefs.tv === "vous" ? ["Inspirez", "Bloquez", "Expirez", "Bloquez"] : ["Inspire", "Bloque", "Expire", "Bloque"];
      label = names[side];
      ctx.lineWidth = 10; ctx.lineCap = "round";
      const pts = [[m, m + L], [m, m], [m + L, m], [m + L, m + L]];
      for (let s = 0; s < 4; s++) { const a = pts[s], b = pts[(s + 1) % 4]; ctx.strokeStyle = s === side ? col.sun : col.line; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
      const a = pts[side], b = pts[(side + 1) % 4], x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
      const r = side === 0 ? 26 + 16 * f : side === 2 ? 42 - 16 * f : side === 1 ? 42 : 26;
      ctx.fillStyle = col.a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col.ink; ctx.font = "600 72px Lexend, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(Math.ceil(4 - f * 4)), W / 2, H / 2);
    }
    if (lab.textContent !== label) lab.textContent = label;
    const s = Math.ceil(left / 1000); tm.textContent = `Encore ${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s`;
    if (left <= 0) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  function finish() { stopped = true; cancelAnimationFrame(raf); release(); go("respi", Object.assign({}, p, { phase: "apres" })); }
  document.getElementById("stop").onclick = finish;
  raf = requestAnimationFrame(frame);
  cleanup = () => { stopped = true; cancelAnimationFrame(raf); release(); };
}

let timerState = { end: 0, total: 600000, running: false, paused: 600000 };
function timerWidget() {
  const cv = document.getElementById("tc"), ctx = cv.getContext("2d"), out = document.getElementById("tt"), btn = document.getElementById("tgo");
  const col = { sun: cssVar("--sun"), line: cssVar("--line"), ink: cssVar("--ink"), surf: cssVar("--surface") };
  let raf, alive = true;
  const remaining = () => timerState.running ? Math.max(0, timerState.end - Date.now()) : timerState.paused;
  function draw() {
    if (!alive) return;
    const r = remaining(), W = cv.width, c = W / 2, R = W / 2 - 16;
    ctx.clearRect(0, 0, W, W);
    ctx.fillStyle = col.surf; ctx.strokeStyle = col.line; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; ctx.beginPath(); ctx.moveTo(c + Math.sin(a) * (R - 4), c - Math.cos(a) * (R - 4)); ctx.lineTo(c + Math.sin(a) * (R - 22), c - Math.cos(a) * (R - 22)); ctx.strokeStyle = col.line; ctx.lineWidth = 4; ctx.stroke(); }
    const frac = r / timerState.total;
    if (frac > 0) { ctx.fillStyle = col.sun; ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R - 26, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = col.ink; ctx.beginPath(); ctx.arc(c, c, 12, 0, Math.PI * 2); ctx.fill();
    const s = Math.ceil(r / 1000); out.textContent = r > 0 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : "Temps écoulé : petite pause méritée.";
    if (timerState.running && r <= 0) { timerState.running = false; timerState.paused = 0; btn.textContent = "Lancer"; bip(); }
    raf = requestAnimationFrame(draw);
  }
  const setDur = () => { const m = parseInt(getChips("tdur")[0] || "10", 10); timerState = { total: m * 60000, paused: m * 60000, running: false, end: 0 }; btn.textContent = "Lancer"; };
  document.querySelectorAll('.chips[data-name="tdur"] .chip').forEach(b => b.addEventListener("picked", setDur));
  btn.textContent = timerState.running ? "Pause" : "Lancer";
  btn.onclick = () => {
    if (timerState.running) { timerState.paused = remaining(); timerState.running = false; btn.textContent = "Reprendre"; }
    else { if (timerState.paused <= 0) timerState.paused = timerState.total; timerState.end = Date.now() + timerState.paused; timerState.running = true; btn.textContent = "Pause"; }
  };
  document.getElementById("treset").onclick = setDur;
  draw();
  cleanup = () => { alive = false; cancelAnimationFrame(raf); };
}
function bip() {
  try { const A = new (window.AudioContext || window.webkitAudioContext)(); [0, 0.35].forEach(d => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = 660; g.gain.setValueAtTime(0.0001, A.currentTime + d); g.gain.exponentialRampToValueAtTime(0.2, A.currentTime + d + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, A.currentTime + d + 0.3); o.connect(g); g.connect(A.destination); o.start(A.currentTime + d); o.stop(A.currentTime + d + 0.32); }); } catch (e) {}
}

      const sh = document.getElementById("share");
      if (sh) sh.onclick = () => { navigator.share({ title: "Entre-Séances " + S.cfg.c, text: p.msg }).catch(() => {}); };
      document.getElementById("sent").onclick = () => { p.ids.forEach(id => { const e = S.entries.find(x => x.id === id); if (e) e.sent = true; }); save(); go("home"); };
      return;

    const prep = document.getElementById("prep");
    if (!prep) return;
    const list = p.all ? S.entries.filter(e => Date.now() - new Date(e.t) < 30 * 864e5) : unsent();

      prep.disabled = true; prep.textContent = canDirect() && !p.manual ? "Envoi…" : "Chiffrement…";

        go("envoi", { msg, nophoto, ids: list.map(e => e.id) });
      } catch (e) { prep.disabled = false; prep.textContent = "Réessayer"; }
    };
  }
};

/* ---------- Messages de la psychologue ---------- */
const MAIL_ICO = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg>';
const nl2br = t => esc(t).replace(/\n/g, "<br>");

function exTarget(ex) {
  if (!ex) return null;
  const [k, id] = [ex.slice(0, 1), ex.slice(2)];
  if (k === "m" && MODS[id] && (S.cfg.m || []).includes(id)) return { go: id, p: {}, label: MODS[id].t };
  if (k === "x") { const d = (S.cfg.cx || []).find(x => x.id === id); if (d) return { go: "perso", p: { id }, label: d.t }; }
  if (k === "t" && TCC_BY_ID[id] && (S.cfg.tx || []).includes(id)) return { go: "tccx", p: { id }, label: TCC_BY_ID[id].t };
  return null;
}

    };
    return `${back()}<div class="stack"><div class="screen-head"><h1>${esc(d.t)}</h1>${d.c ? `<p>${nl2br(d.c)}</p>` : ""}</div>
      ${(d.f || []).map(fld).join("")}
      <button class="btn wide" id="ok">Enregistrer</button></div>`;
  },
  mount(p) {
    const d = (S.cfg.cx || []).find(x => x.id === p.id); if (!d) return;
    const done = {}; let timers = [];
    document.querySelectorAll("[data-timer]").forEach(b => b.onclick = () => {
      const i = b.dataset.timer, end = Date.now() + Number(b.dataset.min) * 60000, out = document.getElementById("t" + i);
      b.disabled = true; const release = wakeLock();
      const tick = () => { const s = Math.max(0, Math.ceil((end - Date.now()) / 1000)); out.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; if (s <= 0) { clearInterval(h); release(); done[i] = true; b.textContent = "Terminé"; bip(); } };
      const h = setInterval(tick, 250); timers.push(() => { clearInterval(h); release(); }); tick();
    });
    cleanup = () => timers.forEach(f => f());
    document.getElementById("ok").onclick = () => {
      const rep = [];
      (d.f || []).forEach((f, i) => {
        if (f.k === "info") return;
        let v = "";
        if (f.k === "texte") v = val("f" + i).trim();
        else if (f.k === "echelle") v = num("f" + i);
        else if (f.k === "multi") v = getChips("f" + i);
        else if (f.k === "choix" || f.k === "oui") v = getChips("f" + i)[0] || "";
        else if (f.k === "minuteur") v = done[i] ? "Fait" : "Non fait";
        rep.push({ q: f.q, k: f.k, v });
      });
      addEntry("perso", { xid: d.id, titre: d.t, rep });
      saved("perso");
    };
  }
};

/* ---------- Exercices TCC (schémas, besoins, valeurs) ---------- */
const tccAssigned = () => (S.cfg.tx || []).map(id => TCC_BY_ID[id]).filter(Boolean);
const lastDone = id => { const e = S.entries.filter(x => x.type === "tcc" && x.xid === id).pop(); return e ? new Date(e.t) : null; };
SCREENS.tcc = {
  html() {
    const ex = tccAssigned(), pins = S.pins || {};
    const pinned = ex.filter(x => x.pin && pins[x.id]);
    return `${back()}<div class="stack"><div class="screen-head"><h1>Exercices TCC</h1>
      <p>${T("Les exercices choisis pour toi par ta psychologue. Fais-les à ton rythme : une étape à la fois.", "Les exercices choisis pour vous par votre psychologue. À faire à votre rythme : une étape à la fois.")}</p></div>
      ${pinned.length ? `<div class="stack"><h2 class="sec-title">Mes fiches à relire</h2>${pinned.map(x => `<button class="tile pin-tile" data-go="tccpin" data-p='${JSON.stringify({ id: x.id })}'><span class="tile-ico">${I.fiches}</span><span><span class="tile-t">${esc(x.t)}</span><span class="tile-d">Relire mes réponses</span></span></button>`).join("")}</div>` : ""}
      ${TCC_GROUPS.map(([g, gl]) => { const xs = ex.filter(x => x.g === g); if (!xs.length) return "";
        return `<div class="stack"><h2 class="sec-title">${gl}</h2>${xs.map(x => { const ld = lastDone(x.id);
          return `<button class="tile" data-go="tccx" data-p='${JSON.stringify({ id: x.id })}'><span class="tile-ico">${I.angst}</span><span><span class="tile-t">${esc(x.t)}</span><span class="tile-d">${esc(x.d)} · ${x.dur} min${ld ? " · fait le " + ld.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : ""}</span>${x.seance ? `<span class="pill-s">Après en avoir parlé en séance</span>` : ""}</span></button>`; }).join("")}</div>`; }).join("")}
      ${!ex.length ? `<div class="notice">Aucun exercice pour l'instant.</div>` : ""}</div>`;
  }
};
SCREENS.tccpin = {
  html(p) {
    const x = TCC_BY_ID[p.id], rep = (S.pins || {})[p.id] || [];
    return `${back("tcc", "Exercices TCC")}<div class="stack"><div class="screen-head"><h1>${esc(x.t)}</h1><p class="small muted">Mes réponses, à relire quand j'en ai besoin.</p></div>
      <div class="card pin-card">${rep.filter(r => r.v != null && r.v !== "" && !(Array.isArray(r.v) && !r.v.length)).map(r => `<p><span class="small muted">${esc(r.q)}</span><br><b>${esc(tccValText(r))}</b></p>`).join("")}</div>
      <button class="btn ghost" data-go="tccx" data-p='${JSON.stringify({ id: x.id })}'>La remplir à nouveau</button></div>`;
  }
};
function tccField(f, key, d) {
  const id = "q" + key, prev = d[key];
  switch (f.k) {
    case "fiche": return `<div class="fiche">${tccFiche(f.v)}</div>`;
    case "info": return `<div class="notice">${esc(f.q)}</div>`;
    case "texte": return field(esc(f.q) + (f.opt ? "" : ""), `<textarea id="${id}" maxlength="1200" placeholder="${esc(f.h || "")}">${esc(prev || "")}</textarea>`, f.opt ? "Facultatif" : "");
    case "lignes": return field(esc(f.q), `<div class="stack" style="gap:8px">${Array.from({ length: f.n || 3 }, (_, i) => `<input type="text" id="${id}_${i}" maxlength="200" placeholder="${i === 0 ? esc(f.h || "") : ""}" value="${esc((prev || [])[i] || "")}">`).join("")}</div>`);
    case "chips": return field(esc(f.q), chips(id, tccOpts(f.o), !!f.m, prev ? [].concat(prev) : []), f.m ? "Plusieurs choix possibles" : "");
    case "echelle": return field(esc(f.q), range(id, 0, 10, prev ?? 5) + `<div class="scale-ends"><span>0${f.a ? " : " + esc(f.a) : ""}</span><span>10${f.b ? " : " + esc(f.b) : ""}</span></div>`);
    case "pct": return field(esc(f.q), range(id, 0, 100, prev ?? 50, 5, " %"));
    case "oui": return field(esc(f.q), chips(id, ["Oui", "Non", "Je ne sais pas"], false, prev ? [prev] : []));
    case "minuteur": return `<div class="card stack"><span class="lbl">${esc(f.q)}</span><p class="big-num no-lis" id="t${id}">${f.m}:00</p><button class="btn soft" data-ttimer="${id}" data-min="${f.m}">Lancer ${f.m} min</button></div>`;
    case "rate": {
      const items = f.o === "@schemaphrases" ? TCC_DOMAINES.flatMap(dd => dd.s.map(s => [s[1], s[2]])) : tccOpts(f.o).map(x => [x, x]);
      return `<div><span class="lbl">${esc(f.q)}</span><ol class="qlist">${items.map(([k, l], i) => `<li class="qitem"><p class="qtext">${esc(l)}</p><div class="seg seg3" data-group-box data-rate="${id}" data-k="${esc(k)}">${f.l.map((lv, j) => `<button type="button" class="segb" data-v="${j}" aria-pressed="${prev && prev[k] === lv}">${esc(lv)}</button>`).join("")}</div></li>`).join("")}</ol></div>`;
    }
  }
  return "";
}
function tccCollect(f, key, d) {
  const id = "q" + key;
  switch (f.k) {
    case "texte": d[key] = val(id).trim(); break;
    case "lignes": d[key] = Array.from({ length: f.n || 3 }, (_, i) => val(id + "_" + i).trim()); break;
    case "chips": { const c = getChips(id); d[key] = f.m ? c : (c[0] || ""); break; }
    case "oui": d[key] = getChips(id)[0] || ""; break;
    case "echelle": case "pct": d[key] = num(id); break;
    case "rate": { const o = {}; document.querySelectorAll(`[data-rate="${id}"]`).forEach(box => { const b = box.querySelector('.segb[aria-pressed="true"]'); if (b) o[box.dataset.k] = f.l[Number(b.dataset.v)]; }); d[key] = o; break; }
  }
}
SCREENS.tccx = {
  html(p) {
    const x = TCC_BY_ID[p.id]; if (!x) return `${back("tcc", "Exercices TCC")}<div class="notice">Exercice indisponible.</div>`;
    const s = p.s || 0, n = x.steps.length, st = x.steps[s], d = p.d || {};
    const dots = n > 1 ? `<div class="steps-dots" aria-label="Étape ${s + 1} sur ${n}">${x.steps.map((_, i) => `<span class="${i <= s ? "on" : ""}"></span>`).join("")}</div><p class="small">Étape ${s + 1} sur ${n} · ${esc(st.h)}</p>` : "";
    return `${back("tcc", "Exercices TCC")}<div class="stack"><div class="screen-head"><h1>${esc(x.t)}</h1>${dots}</div>
      ${s === 0 && x.seance ? `<div class="notice">${T("Cet exercice peut réveiller des émotions fortes. Fais-le de préférence après en avoir parlé en séance. Si c'est trop, arrête-toi : tu peux respirer ou utiliser le bouton Aide.", "Cet exercice peut réveiller des émotions fortes. Faites-le de préférence après en avoir parlé en séance. Si c'est trop, arrêtez-vous : vous pouvez respirer ou utiliser le bouton Aide.")} <button class="link" data-go="respi">Respirer</button></div>` : ""}
      ${s === 0 && x.intro ? `<p>${esc(x.intro)}</p>` : ""}
      ${n > 1 ? `<h2>${esc(st.h)}</h2>` : ""}
      ${st.f.map((f, i) => tccField(f, s + "_" + i, d)).join("")}
      <p class="hint">${noPerso()}</p>
      <div class="wiz-nav">${s > 0 ? `<button class="btn ghost" id="prevS">Précédent</button>` : `<span></span>`}<button class="btn" id="nextS">${s === n - 1 ? "Enregistrer" : "Suivant"}</button></div></div>`;
  },
  mount(p) {
    const x = TCC_BY_ID[p.id]; if (!x) return;
    const s = p.s || 0, d = p.d || (p.d = {}), st = x.steps[s];
    const timers = [];
    document.querySelectorAll("[data-ttimer]").forEach(b => b.onclick = () => {
      const out = document.getElementById("t" + b.dataset.ttimer), end = Date.now() + Number(b.dataset.min) * 60000; b.disabled = true; const release = wakeLock();
      const h = setInterval(() => { const r = Math.max(0, Math.ceil((end - Date.now()) / 1000)); out.textContent = `${Math.floor(r / 60)}:${String(r % 60).padStart(2, "0")}`; if (r <= 0) { clearInterval(h); release(); b.textContent = "Terminé"; bip(); } }, 250);
      timers.push(() => { clearInterval(h); release(); });
    });
    cleanup = () => timers.forEach(f => f());
    const collect = () => st.f.forEach((f, i) => tccCollect(f, s + "_" + i, d));
    const pv = document.getElementById("prevS");
    if (pv) pv.onclick = () => { collect(); go("tccx", { id: x.id, s: s - 1, d }); };
    document.getElementById("nextS").onclick = () => {
      collect();
      if (s < x.steps.length - 1) { go("tccx", { id: x.id, s: s + 1, d }); return; }
      const rep = [];
      x.steps.forEach((stp, si) => stp.f.forEach((f, fi) => { if (["fiche", "info", "minuteur"].includes(f.k)) return; rep.push({ q: f.q, k: f.k, v: d[si + "_" + fi] }); }));
      addEntry("tcc", { xid: x.id, titre: x.t, rep });
      if (x.pin) { S.pins = S.pins || {}; S.pins[x.id] = rep; save(); }
      saved("tcc", { then: "tcc" });
    };
  }
};

/* ---------- Notifications ---------- */
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error("delai")), ms))]);
async function pushReady(needVp) {
  if (!canDirect()) return { err: "Indisponible en démonstration." };
  if (needVp && !S.cfg.vp) return { err: T("Ta psychologue n'a pas encore activé les notifications. Réessaie plus tard.", "Votre psychologue n'a pas encore activé les notifications. Réessayez plus tard.") };
  if (!pushSupported()) return { err: detectOS() === "ios" && !isStandalone()
    ? "Sur iPhone, installer d'abord l'application sur l'écran d'accueil, puis l'ouvrir depuis son icône pour activer les notifications."
    : "Ce navigateur ne permet pas les notifications. Essayer avec Chrome (Android) ou l'application installée (iPhone)." };
  try { return { reg: await withTimeout(navigator.serviceWorker.ready, 6000) }; } catch (e) { return { err: "L'application doit être ouverte depuis son adresse internet (ou son icône) pour les notifications." }; }
}
/* Abonne l'appareil (si besoin) et indique au relais si les messages doivent notifier */
async function syncSub(silent) {
  const wantMsg = !!S.prefs.notif, wantRem = !!(S.prefs.rem && S.prefs.rem.on);
  const ready = await pushReady(wantMsg || wantRem); if (ready.err) return ready.err;
  const reg = ready.reg;
  try {
    if (!wantMsg && !wantRem) {
      const sub = await reg.pushManager.getSubscription(); if (sub) { try { await sub.unsubscribe(); } catch (e) {} }
      try { await relay(RELAIS, { a: "punsub", code: S.cfg.c }); } catch (e) {}
      return null;
    }
    const perm = silent ? Notification.permission : await Notification.requestPermission();
    if (perm !== "granted") return "Les notifications sont bloquées pour cette application dans les réglages du téléphone. Les autoriser là, puis réessayer.";
    let sub = await reg.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey && B64.enc(new Uint8Array(sub.options.applicationServerKey)) !== S.cfg.vp) { await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: B64.dec(S.cfg.vp) });
    const r = await relay(RELAIS, { a: "psub", code: S.cfg.c, sub: JSON.stringify(sub), msg: wantMsg });
    if (!r.ok) return "L'inscription aux notifications a échoué (" + (r.err || "?") + ").";
    return null;
  } catch (e) { return e.detail || "Les notifications n'ont pas pu être activées sur cet appareil (" + (e.message || e.name) + ")."; }
}
async function setNotif(on, silent) {
  const prev = S.prefs.notif; S.prefs.notif = !!on;
  const err = await syncSub(silent);
  if (err) { S.prefs.notif = prev; save(); return err; }
  save(); writeMeta(); return null;
}
/* Rappel quotidien : jours (1 = lundi … 7 = dimanche) et heure */
async function setReminder(rem) {
  const prev = S.prefs.rem; S.prefs.rem = rem;
  const err = await syncSub(false);
  if (err) { S.prefs.rem = prev; save(); return err; }
  let tz = "Europe/Paris"; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
  try {
    const r = await relay(RELAIS, { a: "prem", code: S.cfg.c, on: !!rem.on, days: rem.days, time: rem.time, tz });
    if (!r.ok) { S.prefs.rem = prev; save(); return r.err === "action" ? "Les rappels ne sont pas encore disponibles : prévenir la psychologue." : "Le rappel n'a pas pu être enregistré (" + (r.err || "?") + ")."; }
  } catch (e) { S.prefs.rem = prev; save(); return e.detail || "Pas de connexion internet."; }
  save(); writeMeta(); return null;
}
/* Informations lues par le service de notification pour choisir le texte affiché */
function writeMeta() {
  try { if (!("caches" in window)) return; caches.open("es-meta").then(c => c.put("meta", new Response(JSON.stringify({ rem: S.prefs.rem || null, tv: S.prefs.tv })))).catch(() => {}); } catch (e) {}
}

/* Démarrage */
purgeOld(); if (S) save();
render();
if (S && S.prefs) writeMeta();
refreshCfg().then(() => { if (S && canDirect() && unsent().length) sendEntries(unsent()).then(() => { if (view.name === "home") render(); }); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S && canDirect()) refreshCfg(); });
navigator.serviceWorker && navigator.serviceWorker.addEventListener && navigator.serviceWorker.addEventListener("message", ev => { if (ev.data === "es-refresh") refreshCfg(); });
window.addEventListener("online", () => { refreshCfg(); if (S && canDirect() && unsent().length) sendEntries(unsent()); });
</script>
