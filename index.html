async function streamThrough(u8, stream) {
  const w = stream.writable.getWriter(); w.write(u8); w.close();
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}
/* Emballe un objet JSON : 1 octet de drapeau (1 = compressé) + données */
async function pack(obj) {
  const raw = TE.encode(JSON.stringify(obj));
  if (typeof CompressionStream !== "undefined") {
    try { const c = await streamThrough(raw, new CompressionStream("deflate-raw"));
      const out = new Uint8Array(c.length + 1); out[0] = 1; out.set(c, 1); return out; } catch (e) {}
  }
  const out = new Uint8Array(raw.length + 1); out[0] = 0; out.set(raw, 1); return out;
}
async function unpack(u8) {
  let body = u8.slice(1);
  if (u8[0] === 1) body = await streamThrough(body, new DecompressionStream("deflate-raw"));
  return JSON.parse(TD.decode(body));
}

/* Code d'activation patient : ACT1.<données> */
async function encodeActivation(cfg) { return "ACT1." + B64.enc(await pack(cfg)); }
async function decodeActivation(text) {
  const m = String(text).match(/ACT1\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("format");
  const cfg = await unpack(B64.dec(m[1]));
  if (!cfg || !cfg.c || !cfg.k) throw new Error("format");
  return cfg;
}

/* Chiffrement patient -> praticienne : ECDH P-256 éphémère + AES-GCM 256
   Message : PSY1.<clé éphémère (65 o) | iv (12 o) | données chiffrées> */
const ECDH = { name: "ECDH", namedCurve: "P-256" };
const AAD = TE.encode("PSY1");
async function encryptForPractitioner(pubB64, obj) {
  const pub = await crypto.subtle.importKey("raw", B64.dec(pubB64), ECDH, false, []);
  const eph = await crypto.subtle.generateKey(ECDH, true, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: pub }, eph.privateKey,
    { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: AAD }, key, await pack(obj)));
  const epk = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  const out = new Uint8Array(65 + 12 + ct.length);
  out.set(epk, 0); out.set(iv, 65); out.set(ct, 77);
  return "PSY1." + B64.enc(out);
}
async function decryptMessage(privJwk, msg) {
  const m = String(msg).match(/PSY1\.([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("format");
  const all = B64.dec(m[1]);
  const priv = await crypto.subtle.importKey("jwk", privJwk, ECDH, false, ["deriveKey"]);
  const epk = await crypto.subtle.importKey("raw", all.slice(0, 65), ECDH, false, []);
  const key = await crypto.subtle.deriveKey({ name: "ECDH", public: epk }, priv,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(65, 77), additionalData: AAD }, key, all.slice(77));
  return unpack(new Uint8Array(pt));
}

/* ===== Lecture adaptée : découpage syllabique et lettres muettes (approximation) ===== */
const VOY = "aeiouyàâäéèêëîïôöùûüÿœæ";
const isVoy = c => VOY.includes(c);
const INSEP = /^(bl|br|cl|cr|dr|fl|fr|gl|gr|pl|pr|tr|vr|ch|ph|gn|th|qu|gu)$/;
function syllabes(word) {
  const w = word.toLowerCase(), n = w.length;
  if (n <= 3) return [word];
  const v = [];
  for (let i = 0; i < n; i++) {
    let x = isVoy(w[i]);
    if (w[i] === "u" && i > 0 && (w[i - 1] === "q" || (w[i - 1] === "g" && i + 1 < n && "eiéèêy".includes(w[i + 1])))) x = false;
    v.push(x);
  }
  const nuc = []; let i = 0;
  while (i < n) { if (v[i]) { let j = i; while (j + 1 < n && v[j + 1]) j++; nuc.push([i, j]); i = j + 1; } else i++; }
  if (nuc.length < 2) return [word];
  const cuts = [];
  for (let k = 0; k < nuc.length - 1; k++) {
    const a = nuc[k][1] + 1, b = nuc[k + 1][0], cl = w.slice(a, b), L = cl.length;
    const ins = L >= 2 && INSEP.test(cl.slice(-2));
    cuts.push(L === 1 ? a : L === 2 ? (ins ? a : a + 1) : (ins ? b - 2 : b - 1));
  }
  const out = []; let p = 0;
  for (const c of cuts) { out.push(word.slice(p, c)); p = c; }
  out.push(word.slice(p));
  return out.filter(Boolean);
}
const EXC_S = new Set("bus sens fils os ours mars tennis virus bonus autobus hélas maïs oasis jadis atlas cactus campus processus cosmos iris lys bis gratis express rébus tournevis métis stress as hiatus fœtus terminus détritus".split(" "));
const EXC_X = new Set("six dix index fax box relax max lynx thorax larynx silex".split(" "));
const EXC_T = new Set("net sept huit but brut ouest chut mat rapt transit scout kit flirt short test toast compost internet granit dot zut est-ce".split(" "));
const EXC_D = new Set("sud bled raid stand weekend lord".split(" "));
const EXC_P = new Set("cap stop top hip slip clip handicap ketchup cep".split(" "));
const EXC_Z = new Set("gaz quiz fez jazz".split(" "));
const EXC_R = new Set("hiver enfer super cancer laser amer hamster poster revolver starter master leader scooter reporter joker poker bunker cuiller hier fier cher mer fer ver".split(" "));
const EXC_E = new Set("le je me te se ce de ne que".split(" "));
function lettresMuettes(word) {
  const w = word.toLowerCase(), n = w.length, set = new Set();
  if (n >= 2 && w[0] === "h" && isVoy(w[1])) set.add(0);
  if (n < 2) return set;
  let idx = n - 1, steps = 0, lastWasE = false;
  while (idx > 0 && steps < 3) {
    const c = w[idx], prev = w[idx - 1];
    let mute = false;
    if (steps === 0) {
      if (c === "s" && prev !== "s" && !EXC_S.has(w)) mute = true;
      else if (c === "x" && !EXC_X.has(w)) mute = true;
    }
    if (!mute && c === "e" && !lastWasE && idx >= 2 && !EXC_E.has(w.slice(0, idx + 1)) && (steps === 0 || w[idx + 1] === "s")) mute = true;
    else if (!mute && steps <= 1 && !lastWasE) {
      if (c === "t" && !EXC_T.has(w) && (isVoy(prev) || "ncps".includes(prev))) mute = true;
      else if (c === "d" && !EXC_D.has(w) && (isVoy(prev) || "nr".includes(prev))) mute = true;
      else if (c === "p" && !EXC_P.has(w) && (isVoy(prev) || "m".includes(prev))) mute = true;
      else if (c === "z" && !EXC_Z.has(w) && isVoy(prev)) mute = true;
      else if (c === "r" && prev === "e" && n >= 5 && steps === 0 && !EXC_R.has(w)) mute = true;
    }
    if (!mute) break;
    set.add(idx); lastWasE = c === "e"; idx--; steps++;
    if (lastWasE) break;
  }
  return set;
}
/* Applique la mise en couleur dans un conteneur */
function adapterTexte(root, opts) {
  if (!opts || (!opts.syl && !opts.muet)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = node.parentElement;
      if (!p || p.closest("textarea,input,select,svg,script,style,.no-lis,code")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  let alt = 0;
  for (const node of nodes) {
    const parts = node.nodeValue.split(/([A-Za-zÀ-ÖØ-öø-ÿœŒæÆ]+)/);
    if (parts.length === 1) continue;
    const frag = document.createDocumentFragment();
    for (let k = 0; k < parts.length; k++) {
      const part = parts[k];
      if (!part) continue;
      if (k % 2 === 0) { frag.appendChild(document.createTextNode(part)); continue; }
      const muettes = opts.muet ? lettresMuettes(part) : new Set();
      const syls = opts.syl ? syllabes(part) : [part];
      const wspan = document.createElement("span"); wspan.className = "mot";
      let pos = 0;
      for (const s of syls) {
        const sp = document.createElement("span");
        if (opts.syl) sp.className = "syl s" + (alt++ % 2);
        for (let c = 0; c < s.length; c++) {
          if (muettes.has(pos + c)) { const m = document.createElement("span"); m.className = "muet"; m.textContent = s[c]; sp.appendChild(m); }
          else sp.appendChild(document.createTextNode(s[c]));
        }
        pos += s.length; wspan.appendChild(sp);
      }
      frag.appendChild(wspan);
    }
    node.parentNode.replaceChild(frag, node);
  }
}

async function cfgKey(code) {
  const base = await crypto.subtle.importKey("raw", TE.encode(code.replace("-", "")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: TE.encode("entre-seances/cfg/v1"), iterations: 120000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function sealCfg(code, cfg) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await cfgKey(code), await pack(cfg)));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return B64.enc(out);
}

}
/* Appel au relais Google Apps Script (POST texte simple : pas de pré-vérification CORS) */
async function relay(url, body, ms = 20000) {
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), ms) : 0;
  try {
    const r = await fetch(url, { method: "POST", body: JSON.stringify(body), redirect: "follow", signal: ctl ? ctl.signal : undefined });
    const txt = await r.text();
    try { return JSON.parse(txt); }
    catch (e) {
      const why = /<title>([^<]*)<\/title>/i.exec(txt);
      const err = new Error("reponse"); err.detail = `Réponse inattendue du relais (code ${r.status}${why ? ", « " + why[1].trim() + " »" : ""}).`; throw err;
    }
  } catch (e) {
    if (!e.detail) e.detail = e.name === "AbortError" ? "Le relais n'a pas répondu à temps." : "Relais injoignable : pas de connexion internet, adresse incorrecte, ou accès du déploiement différent de « Tout le monde ».";
    throw e;
  } finally { clearTimeout(t); }
}
/* Réduit une photo (≤ 900 px, JPEG) pour l'envoi */
function shrinkPhoto(file, max = 900, q = 0.62) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
/* Petit stockage IndexedDB pour les photos (localStorage est trop petit) */
const PhotoDB = {
  db: null,
  open(name) {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open(name, 1);
        r.onupgradeneeded = () => r.result.createObjectStore("p");
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async op(name, mode, fn) {
    const db = await this.open(name);
    return new Promise((res, rej) => { const tx = db.transaction("p", mode); const st = tx.objectStore("p"); const rq = fn(st); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); });
  },
  put(name, k, v) { return this.op(name, "readwrite", st => st.put(v, k)); },
  get(name, k) { return this.op(name, "readonly", st => st.get(k)); },
  del(name, k) { return this.op(name, "readwrite", st => st.delete(k)); }
};

async function sendEntries(list) {
  if (!canDirect() || !list.length) return false;
  const plain = list.filter(e => e.photo !== true), photos = list.filter(e => e.photo === true);
  const batches = [];
  for (let i = 0; i < plain.length; i += 60) batches.push(plain.slice(i, i + 60));
  photos.forEach(e => batches.push([e]));
  for (const b of batches) {
    const items = [];
    for (const e of b) {
      const o = Object.assign({}, e); delete o.sent;
      if (e.photo === true) { try { o.img = await PhotoDB.get("es_photos", e.id); } catch (x) {} if (!o.img) o.photo = "perdue"; }
      items.push(o);
    }
    const msg = await encryptForPractitioner(S.cfg.k, { v: 1, c: S.cfg.c, s: new Date().toISOString(), e: items });
    let r; try { r = await relay(RELAIS, { a: "send", code: S.cfg.c, msg }, 90000); } catch (x) { S.lastErr = { t: new Date().toISOString(), m: x.detail || "Erreur réseau." }; save(); return false; }
    if (!r || !r.ok) { S.lastErr = { t: new Date().toISOString(), m: r && r.err === "inconnu" ? "Le relais ne connaît pas ce code : la psychologue doit rouvrir la fiche du patient pour republier ses exercices." : "Le relais a refusé le message (" + ((r && r.err) || "?") + ")." }; save(); return false; }
    S.lastOk = new Date().toISOString(); S.lastErr = null;
    for (const e of b) { e.sent = true; if (e.photo === true) { e.photo = "envoyee"; try { await PhotoDB.del("es_photos", e.id); } catch (x) {} } }
    save();
  }
  return true;
}

  let sent = null;
  if (canDirect()) sent = await sendEntries(unsent());
  go("merci", Object.assign({ type, sent }, extra));
}

    if (ph === "run") runSurf(p);
    if (ph === "fin") {
      document.querySelectorAll('.chips[data-name="issue"] .chip').forEach(b => b.addEventListener("picked", () => { document.getElementById("cmsg").hidden = b.dataset.v !== "J'ai fait une crise"; }));
      document.getElementById("fin").onclick = () => {
        addEntry("envie", { avant: p.av, apres: num("ap"), issue: getChips("issue")[0] || "", activites: p.act || [], minutes: Math.round((Date.now() - p.t0) / 60000), declencheur: val("decl").trim() });

function runSurf(p) {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), lab = document.getElementById("lab"), tm = document.getElementById("tm");
  const total = p.dur * 60000, t0 = performance.now(), col = { a: cssVar("--accent"), soft: cssVar("--accent-soft"), ink: cssVar("--ink"), sun: cssVar("--sun") };
  let raf, stop = false; const release = wakeLock();
  function frame(now) {
    if (stop) return;
    const el = now - t0, pr = Math.min(1, el / total), W = cv.width, H = cv.height, amp = Math.sin(Math.PI * Math.min(1, pr * 1.15));
    ctx.fillStyle = col.soft; ctx.fillRect(0, 0, W, H);
    const crestX = W * (0.15 + 0.7 * pr);
    for (let layer = 0; layer < 2; layer++) {
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 5) {
        const swell = Math.exp(-Math.pow((x - crestX) / 120, 2)) * amp * H * 0.42;
        ctx.lineTo(x, H * 0.78 - swell + layer * 20 + Math.sin(x / 60 + now / (800 + layer * 300)) * 8);
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.globalAlpha = layer ? 1 : 0.45; ctx.fillStyle = col.a; ctx.fill();
    }
    ctx.globalAlpha = 1;
    const ph = pr < 0.35 ? "La vague monte" : pr < 0.6 ? "Elle est au plus haut" : pr < 1 ? "Elle redescend" : "La vague est passée";
    if (lab.textContent !== ph) lab.textContent = ph;
    const s = Math.ceil((total - Math.min(el, total)) / 1000); tm.textContent = s > 0 ? `Encore ${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : "";
    if (pr >= 1) { done(); return; }
    raf = requestAnimationFrame(frame);
  }
  function done() { stop = true; cancelAnimationFrame(raf); release(); go("envie", Object.assign({}, p, { phase: "fin" })); }
  document.getElementById("stop").onclick = done;
  raf = requestAnimationFrame(frame);
  cleanup = () => { stop = true; cancelAnimationFrame(raf); release(); };
}

  T("Souffle plus longtemps que tu n'inspires.", "Soufflez plus longtemps que vous n'inspirez."), "Une crise d'angoisse redescend d'elle-même, en général en quelques minutes.",
  T("Tu n'as rien à faire de plus que respirer avec le cercle.", "Vous n'avez rien à faire de plus que respirer avec le cercle.")];
SCREENS.angoisse = {
  html(p) {
    if (!p.fin) return `<div class="breath-wrap"><h1 class="breath-label no-lis" id="lab">Inspire</h1>
      <canvas class="breath-canvas" id="cv" width="600" height="600" aria-hidden="true"></canvas>
      <p class="rassure" id="ras" aria-live="polite">${RASSURE()[0]}</p>
      <div class="row" style="justify-content:center"><button class="btn" id="mieux">Ça va mieux</button><button class="btn ghost" data-go="respi" data-p='{"phase":"run","ex":"ancrage","t0":${Date.now()}}'>Essayer 5-4-3-2-1</button></div>
      <p class="hint" style="text-align:center">Douleur dans la poitrine inhabituelle, malaise qui ne passe pas : appeler le <b>15</b>.</p></div>`;
    return `<div class="stack"><div class="screen-head"><h1>${T("Bravo, tu as traversé la crise", "Bravo, vous avez traversé la crise")}</h1></div>
      ${field("Angoisse au plus fort (0 à 10)", range("pic", 0, 10, 8))}
      ${field("Angoisse maintenant", range("ap", 0, 10, 3))}
      ${field("Ce qui l'a déclenchée (facultatif)", `<textarea id="decl" maxlength="300"></textarea>`, noPerso())}
      <button class="btn wide" id="fin">Enregistrer</button><button class="link" data-go="home">Ne pas enregistrer</button></div>`;
  },
  mount(p) {
    if (p.fin) { document.getElementById("fin").onclick = () => { addEntry("angoisse", { pic: num("pic"), apres: num("ap"), minutes: Math.round((Date.now() - p.t0) / 60000), declencheur: val("decl").trim() }); saved("angoisse"); }; return; }
    const t0 = Date.now(), cv = document.getElementById("cv"), ctx = cv.getContext("2d"), lab = document.getElementById("lab"), ras = document.getElementById("ras");
    const col = { a: cssVar("--accent"), soft: cssVar("--accent-soft"), sun: cssVar("--sun") }, release = wakeLock();
    const inL = S.prefs.tv === "vous" ? "Inspirez" : "Inspire", outL = S.prefs.tv === "vous" ? "Expirez" : "Expire";
    let raf, stop = false, ri = 0, lastR = 0;
    const R = RASSURE();
    function frame(now) {
      if (stop) return;
      const el = Date.now() - t0, c = el % 10000, insp = c < 4000, f = insp ? 0.5 - 0.5 * Math.cos(Math.PI * c / 4000) : 0.5 + 0.5 * Math.cos(Math.PI * (c - 4000) / 6000);
      const W = cv.width; ctx.clearRect(0, 0, W, W);
      ctx.fillStyle = col.soft; ctx.beginPath(); ctx.arc(W / 2, W / 2, W * 0.46, 0, 7); ctx.fill();
      ctx.fillStyle = col.a; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(W / 2, W / 2, W * (0.16 + 0.26 * f), 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      const L = insp ? inL : outL; if (lab.textContent !== L) lab.textContent = L;
      if (el - lastR > 9000) { lastR = el; ri = (ri + 1) % R.length; ras.textContent = R[ri]; }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    cleanup = () => { stop = true; cancelAnimationFrame(raf); release(); };
    document.getElementById("mieux").onclick = () => go("angoisse", { fin: true, t0 });
  }
};

/* Premier lancement : réglage de la lecture */
const SAMPLE = "Quand je me sens dépassé, je respire doucement et je découpe ma journée en petites étapes.";
SCREENS.accueil = {
  html(p) {
    const step = p.step || 1, pr = S.prefs;
    if (step === 1) return `<div class="stack">
      <div class="screen-head"><h1>${T("Réglons la lecture pour toi", "Réglons la lecture pour vous")}</h1>
      <p>${T("Choisis ce qui te correspond. Tu pourras changer plus tard dans les réglages.", "Choisissez ce qui vous correspond. Vous pourrez changer plus tard dans les réglages.")}</p></div>
      <div class="stack" data-group-box>
        <button class="choice" data-group="1" data-dys="0" aria-pressed="${!pr.dys}"><span class="t">${T("Je lis sans difficulté particulière", "Je lis sans difficulté particulière")}</span><span class="muted small">Affichage classique</span></button>
        <button class="choice" data-group="1" data-dys="1" aria-pressed="${pr.dys}"><span class="t">${T("J'ai une dyslexie, ou lire me demande des efforts", "J'ai une dyslexie, ou lire me demande des efforts")}</span><span class="muted small">Police adaptée, texte espacé, syllabes en couleur et lettres muettes en rouge</span></button>
      </div>
      <div id="dysOpts" ${pr.dys ? "" : "hidden"} class="card">
        <div class="toggle"><span>Syllabes en deux couleurs</span><input type="checkbox" class="switch" id="oSyl" ${pr.syl ? "checked" : ""}></div>
        <div class="toggle"><span>Lettres muettes en rouge</span><input type="checkbox" class="switch" id="oMuet" ${pr.muet ? "checked" : ""}></div>
      </div>
      <div><span class="lbl">Aperçu</span><div class="preview" id="prev"><p>${SAMPLE}</p></div></div>
      <button class="btn wide" data-go="accueil" data-p='{"step":2}'>Continuer</button>
    </div>`;
    return `<div class="stack">
      <div class="screen-head"><h1>Taille du texte</h1><p>${T("Choisis la taille la plus confortable.", "Choisissez la taille la plus confortable.")}</p></div>
      <div class="row">
        <button class="btn soft" id="sMinus" aria-label="Plus petit">A −</button>
        <button class="btn soft" id="sPlus" aria-label="Plus grand">A +</button>
      </div>
      <div class="preview"><p>${SAMPLE}</p></div>
      <button class="btn wide" id="finish">C'est parti</button>
      <button class="link" data-go="accueil" data-p='{"step":1}'>Revenir au choix de lecture</button>
    </div>`;
  },
  mount(p) {
    const pr = S.prefs;
    if ((p.step || 1) === 1) {
      const refresh = () => {
        const box = document.getElementById("prev"); box.innerHTML = `<p>${SAMPLE}</p>`;
        document.getElementById("dysOpts").hidden = !pr.dys; applyPrefs(); adapterTexte(box, pr);
      };
      document.querySelectorAll(".choice[data-dys]").forEach(b => b.addEventListener("picked", () => {
        pr.dys = b.dataset.dys === "1"; pr.syl = pr.dys; pr.muet = pr.dys; save();
        document.getElementById("oSyl").checked = pr.syl; document.getElementById("oMuet").checked = pr.muet;
        render();
      }));
      document.getElementById("oSyl").onchange = e => { pr.syl = e.target.checked; save(); refresh(); };
      document.getElementById("oMuet").onchange = e => { pr.muet = e.target.checked; save(); refresh(); };
    } else {
      const set = d => { pr.size = Math.min(1.5, Math.max(0.9, Math.round((pr.size + d) * 10) / 10)); save(); applyPrefs(); };
      document.getElementById("sMinus").onclick = () => set(-0.1);
      document.getElementById("sPlus").onclick = () => set(0.1);
      document.getElementById("finish").onclick = () => { pr.done = true; save(); go("home"); };
    }
  }
};

const EMOS = ["Joie", "Calme", "Fierté", "Tristesse", "Colère", "Peur", "Stress", "Fatigue", "Ennui", "Honte", "Solitude"];

/* Tableau des pensées (une étape par écran) */
const PENSEE_STEPS = 6;
SCREENS.pensees = {
  html(p) {
    const d = p.d || (p.d = {}); const s = p.s || 1;
    const dots = `<div class="steps-dots" aria-label="Étape ${s} sur ${PENSEE_STEPS}">${Array.from({ length: PENSEE_STEPS }, (_, i) => `<span class="${i < s ? "on" : ""}"></span>`).join("")}</div>`;
    const ex = (txt) => `<details class="ex"><summary>Voir un exemple</summary><p style="margin-top:8px">${txt}</p></details>`;
    let body = "";
    if (s === 1) body = `<h2>Que s'est-il passé ?</h2>
      ${field("La situation", `<textarea id="f" maxlength="500">${esc(d.situation || "")}</textarea>`, T("Où, quand, ce qui se passait. Sans donner de noms.", "Où, quand, ce qui se passait. Sans donner de noms."))}
      ${ex("Mardi, au self. Un groupe a rigolé quand je suis passé avec mon plateau.")}`;
    if (s === 2) body = `<h2>Quelle pensée est arrivée ?</h2>
      ${field(T("La phrase dans ta tête", "La phrase dans votre tête"), `<textarea id="f" maxlength="400">${esc(d.pensee || "")}</textarea>`)}
      ${ex("« Ils se moquent de moi. Tout le monde me trouve bizarre. »")}
      ${field(T("À quel point y crois-tu ?", "À quel point y croyez-vous ?"), range("g", 0, 100, d.croyance ?? 70, 5, " %"))}`;
    if (s === 3) body = `<h2>Quelle émotion ?</h2>
      ${field(T("Ce que tu as ressenti", "Ce que vous avez ressenti"), chips("emo", EMOS.concat(["Gêne", "Jalousie"]), true, d.emotions || []))}
      ${field("Intensité", range("g", 0, 100, d.intensite ?? 60, 5, " %"))}`;
    if (s === 4) body = `<h2>Enquêter sur la pensée</h2>
      <p class="muted">${T("Comme un détective : quels indices ?", "Comme un détective : quels indices ?")}</p>
      ${field("Ce qui va dans le sens de la pensée", `<textarea id="f" maxlength="400">${esc(d.pour || "")}</textarea>`)}
      ${field("Ce qui ne va pas dans son sens", `<textarea id="f2" maxlength="400">${esc(d.contre || "")}</textarea>`)}
      ${ex("Pour : ils ont ri au moment où je passais. Contre : je n'ai pas entendu ce qu'ils disaient, ils riaient déjà avant.")}`;
    if (s === 5) body = `<h2>Une autre façon de voir</h2>
      ${field(T("Que dirais-tu à un ami dans la même situation ?", "Que diriez-vous à un ami dans la même situation ?"), `<textarea id="f" maxlength="400">${esc(d.alternative || "")}</textarea>`)}
      ${ex("« Ils riaient peut-être d'autre chose. Même si c'était de moi, ça ne dit pas qui je suis. »")}
      ${field(T("À quel point y crois-tu ?", "À quel point y croyez-vous ?"), range("g", 0, 100, d.croyanceAlt ?? 50, 5, " %"))}`;
    if (s === 6) body = `<h2>Et maintenant ?</h2>
      ${field(T("L'intensité de l'émotion du départ, maintenant", "L'intensité de l'émotion du départ, maintenant"), range("g", 0, 100, d.intensiteApres ?? d.intensite ?? 50, 5, " %"))}
      ${field(T("Croyance dans la première pensée, maintenant", "Croyance dans la première pensée, maintenant"), range("g2", 0, 100, d.croyanceApres ?? d.croyance ?? 50, 5, " %"))}`;
    return `${back()}<div class="stack"><div class="screen-head"><h1>Tableau des pensées</h1>${dots}<p class="small">Étape ${s} sur ${PENSEE_STEPS}</p></div>
      ${body}
      <div class="wiz-nav">${s > 1 ? `<button class="btn ghost" id="prevS">Précédent</button>` : `<span></span>`}
      <button class="btn" id="nextS">${s === PENSEE_STEPS ? "Enregistrer" : "Suivant"}</button></div></div>`;
  },
  mount(p) {
    const d = p.d, s = p.s || 1;
    const collect = () => {
      if (s === 1) d.situation = val("f").trim();
      if (s === 2) { d.pensee = val("f").trim(); d.croyance = num("g"); }
      if (s === 3) { d.emotions = getChips("emo"); d.intensite = num("g"); }
      if (s === 4) { d.pour = val("f").trim(); d.contre = val("f2").trim(); }
      if (s === 5) { d.alternative = val("f").trim(); d.croyanceAlt = num("g"); }
      if (s === 6) { d.intensiteApres = num("g"); d.croyanceApres = num("g2"); }
    };
    const pv = document.getElementById("prevS");
    if (pv) pv.onclick = () => { collect(); go("pensees", { d, s: s - 1 }); };
    document.getElementById("nextS").onclick = () => {
      collect();
      if (s < PENSEE_STEPS) go("pensees", { d, s: s + 1 });
      else { addEntry("pensees", d); saved("pensees"); }
    };
  }
};

/* Échelle d'exposition (marches définies par la praticienne) */
const zoneColor = s => s <= 2 ? "var(--z1)" : s <= 4 ? "var(--z2)" : s <= 6 ? "var(--z3)" : s <= 8 ? "var(--z4)" : "var(--z5)";
SCREENS.expo = {
  html(p) {
    const H = (S.cfg.h || []).map((h, i) => ({ i, label: h[0], sud: h[1] }));
    if (p.step == null) {
      const sorted = H.slice().sort((a, b) => b.sud - a.sud);
      const count = i => S.entries.filter(e => e.type === "expo" && e.marche === i).length;
      return `${back()}<div class="stack"><div class="screen-head"><h1>Mon échelle d'exposition</h1>
        <p>${T("Les marches ont été préparées avec ta psychologue. Commence par le bas, et monte à ton rythme.", "Les marches ont été préparées avec votre psychologue. Commencez par le bas, et montez à votre rythme.")}</p></div>
        <div class="ladder">${sorted.map(h => `<button class="rung" data-go="expo" data-p='{"step":${h.i}}'><span class="lvl" style="background:${zoneColor(h.sud)}">${h.sud}</span><span>${esc(h.label)}</span><span class="cnt">${count(h.i) ? count(h.i) + " fois" : ""}</span></button>`).join("")}</div>
        <p class="hint">Le chiffre indique le malaise prévu, de 0 à 10.</p></div>`;
    }
    const h = H[p.step];
    return `${back("expo", "Mon échelle")}<div class="stack"><div class="screen-head"><h1>${esc(h.label)}</h1><p>${T("Note ton malaise avant, au plus fort, et à la fin.", "Notez votre malaise avant, au plus fort, et à la fin.")}</p></div>
      ${field("Malaise juste avant (0 à 10)", range("a", 0, 10, h.sud))}
      ${field("Malaise au plus fort", range("b", 0, 10, h.sud))}
      ${field("Malaise à la fin", range("c", 0, 10, Math.max(0, h.sud - 2)))}
      ${field("Combien de temps ?", chips("duree", ["Moins de 5 min", "5 à 15 min", "15 à 30 min", "Plus de 30 min"], false))}
      ${field(T("Es-tu resté(e) jusqu'à ce que ça redescende ?", "Êtes-vous resté(e) jusqu'à ce que ça redescende ?"), chips("reste", ["Oui", "En partie", "Non, je suis parti(e) avant"], false))}
      ${field("Ce qui a aidé, ce qui était dur (facultatif)", `<textarea id="note" maxlength="300"></textarea>`, noPerso())}
      <button class="btn wide" id="ok">Enregistrer</button></div>`;
  },
  mount(p) {
    if (p.step == null) return;
    document.getElementById("ok").onclick = () => {
      const h = S.cfg.h[p.step];
      addEntry("expo", { marche: p.step, label: h[0], prevu: h[1], avant: num("a"), pic: num("b"), fin: num("c"), duree: getChips("duree")[0] || "", reste: getChips("reste")[0] || "", note: val("note").trim() });
      saved("expo");
    };
  }

/* Respiration et ancrage */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function wakeLock() { let lock = null; try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => lock = l).catch(() => {}); } catch (e) {} return () => { try { lock && lock.release(); } catch (e) {} }; }
const RESPI = {
  vague: { t: "La vague", d: () => T("Inspire quand la vague monte, expire quand elle redescend. 5 secondes chacune.", "Inspirez quand la vague monte, expirez quand elle redescend. 5 secondes chacune.") },
  balle: { t: "La balle", d: () => T("Suis la balle autour du carré : inspire, bloque, expire, bloque. 4 secondes par côté.", "Suivez la balle autour du carré : inspirez, bloquez, expirez, bloquez. 4 secondes par côté.") },
  ancrage: { t: "5-4-3-2-1", d: () => T("Revenir dans l'instant grâce à tes cinq sens.", "Revenir dans l'instant grâce à vos cinq sens.") }
};
SCREENS.respi = {
  html(p) {
    const ph = p.phase || "menu";
    if (ph === "menu") return `${back()}<div class="stack"><div class="screen-head"><h1>Respirer et se poser</h1><p>${T("Choisis un exercice.", "Choisissez un exercice.")}</p></div>
      ${Object.entries(RESPI).map(([k, r]) => `<button class="tile" data-go="respi" data-p='{"phase":"avant","ex":"${k}"}'><span class="tile-ico">${k === "ancrage" ? I.fiches : I.respi}</span><span><span class="tile-t">${r.t}</span><span class="tile-d">${r.d()}</span></span></button>`).join("")}</div>`;
    const r = RESPI[p.ex];
    if (ph === "avant") return `${back("respi", "Exercices")}<div class="stack"><div class="screen-head"><h1>${r.t}</h1><p>${r.d()}</p></div>
      ${field(T("Ton niveau de stress maintenant (0 à 10)", "Votre niveau de stress maintenant (0 à 10)"), range("st", 0, 10, 5))}
      ${p.ex !== "ancrage" ? field("Durée", chips("dur", ["1 min", "3 min", "5 min"], false, ["3 min"])) : ""}
      <button class="btn wide" id="go">Commencer</button>
      <button class="link" id="skip">Commencer sans noter</button></div>`;
    if (ph === "run" && p.ex !== "ancrage") return `<div class="breath-wrap">
      <h1 class="breath-label no-lis" id="lab" aria-live="polite">Prêt ?</h1>
      <canvas class="breath-canvas" id="cv" width="600" height="600" aria-hidden="true"></canvas>
      <p class="breath-time no-lis" id="tm"></p>
      <button class="btn ghost" id="stop">Terminer</button></div>`;
    if (ph === "run") {
      const SENS = [[5, T("choses que tu vois", "choses que vous voyez"), "Regarde autour de toi : une couleur, un objet, une forme…"], [4, T("choses que tu peux toucher", "choses que vous pouvez toucher"), "Le tissu de tes vêtements, la table, tes mains…"], [3, T("sons que tu entends", "sons que vous entendez"), "Proches ou lointains."], [2, T("odeurs que tu sens", "odeurs que vous sentez"), "Ou deux odeurs que tu aimes, en y pensant."], [1, T("goût dans ta bouche", "goût dans votre bouche"), "Ou une phrase gentille à te dire."]];
      const i = p.i || 0, [n, quoi, aide] = SENS[i];
      return `<div class="stack" style="text-align:center"><p class="small muted">Sens ${i + 1} sur 5</p>
        <div class="big-num no-lis">${n}</div><h1>${quoi}</h1><p class="muted">${T(aide, aide.replace("Regarde autour de toi", "Regardez autour de vous").replace("tes vêtements", "vos vêtements").replace("tes mains", "vos mains").replace("que tu aimes", "que vous aimez").replace("à te dire", "à vous dire"))}</p>
        <p class="small">${T("Touche un rond à chaque fois que tu en trouves un.", "Touchez un rond à chaque fois que vous en trouvez un.")}</p>
        <div class="dots-count">${Array.from({ length: n }, () => `<button class="dot-tap" aria-pressed="false" aria-label="Trouvé"></button>`).join("")}</div>
        <button class="btn wide" id="nx">${i < 4 ? "Suivant" : "Terminer"}</button></div>`;

};
function runBreath(p) {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), lab = document.getElementById("lab"), tm = document.getElementById("tm");
  const total = p.dur * 60 * 1000, t0 = performance.now();
  const col = { a: cssVar("--accent"), soft: cssVar("--accent-soft"), sun: cssVar("--sun"), line: cssVar("--line"), ink: cssVar("--ink") };
  let raf, stopped = false; const release = wakeLock();
  const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * x);
  function frame(now) {
    if (stopped) return;
    const el = now - t0, left = Math.max(0, total - el);
    const W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
    let label;
    if (p.ex === "vague") {
      const cyc = (el % 10000) / 5000, insp = cyc < 1, f = insp ? ease(cyc) : 1 - ease(cyc - 1);
      label = insp ? "Inspire" : "Expire"; if (S.prefs.tv === "vous") label = insp ? "Inspirez" : "Expirez";
      const secs = Math.ceil(5 - (cyc % 1) * 5);
      const level = H * (0.82 - 0.6 * f);
      ctx.fillStyle = col.soft; ctx.fillRect(0, 0, W, H);
      for (let layer = 0; layer < 2; layer++) {
        ctx.beginPath(); ctx.moveTo(0, H);
        for (let x = 0; x <= W; x += 6) ctx.lineTo(x, level + layer * 18 + Math.sin(x / 70 + now / (900 + layer * 300) + layer) * (14 - layer * 4));
        ctx.lineTo(W, H); ctx.closePath(); ctx.globalAlpha = layer ? 1 : 0.45; ctx.fillStyle = col.a; ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.fillStyle = col.ink; ctx.font = "600 64px Lexend, sans-serif"; ctx.textAlign = "center";
      ctx.fillText(String(secs), W / 2, 110);
    } else {
      const side = Math.floor((el % 16000) / 4000), f = (el % 4000) / 4000, m = 120, L = W - 2 * m;
      const names = S.prefs.tv === "vous" ? ["Inspirez", "Bloquez", "Expirez", "Bloquez"] : ["Inspire", "Bloque", "Expire", "Bloque"];
      label = names[side];
      ctx.lineWidth = 10; ctx.lineCap = "round";
      const pts = [[m, m + L], [m, m], [m + L, m], [m + L, m + L]];
      for (let s = 0; s < 4; s++) { const a = pts[s], b = pts[(s + 1) % 4]; ctx.strokeStyle = s === side ? col.sun : col.line; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
      const a = pts[side], b = pts[(side + 1) % 4], x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
      const r = side === 0 ? 26 + 16 * f : side === 2 ? 42 - 16 * f : side === 1 ? 42 : 26;
      ctx.fillStyle = col.a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = col.ink; ctx.font = "600 72px Lexend, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(Math.ceil(4 - f * 4)), W / 2, H / 2);
    }
    if (lab.textContent !== label) lab.textContent = label;
    const s = Math.ceil(left / 1000); tm.textContent = `Encore ${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s`;
    if (left <= 0) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  function finish() { stopped = true; cancelAnimationFrame(raf); release(); go("respi", Object.assign({}, p, { phase: "apres" })); }
  document.getElementById("stop").onclick = finish;
  raf = requestAnimationFrame(frame);
  cleanup = () => { stopped = true; cancelAnimationFrame(raf); release(); };
}

let timerState = { end: 0, total: 600000, running: false, paused: 600000 };
function timerWidget() {
  const cv = document.getElementById("tc"), ctx = cv.getContext("2d"), out = document.getElementById("tt"), btn = document.getElementById("tgo");
  const col = { sun: cssVar("--sun"), line: cssVar("--line"), ink: cssVar("--ink"), surf: cssVar("--surface") };
  let raf, alive = true;
  const remaining = () => timerState.running ? Math.max(0, timerState.end - Date.now()) : timerState.paused;
  function draw() {
    if (!alive) return;
    const r = remaining(), W = cv.width, c = W / 2, R = W / 2 - 16;
    ctx.clearRect(0, 0, W, W);
    ctx.fillStyle = col.surf; ctx.strokeStyle = col.line; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; ctx.beginPath(); ctx.moveTo(c + Math.sin(a) * (R - 4), c - Math.cos(a) * (R - 4)); ctx.lineTo(c + Math.sin(a) * (R - 22), c - Math.cos(a) * (R - 22)); ctx.strokeStyle = col.line; ctx.lineWidth = 4; ctx.stroke(); }
    const frac = r / timerState.total;
    if (frac > 0) { ctx.fillStyle = col.sun; ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, R - 26, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = col.ink; ctx.beginPath(); ctx.arc(c, c, 12, 0, Math.PI * 2); ctx.fill();
    const s = Math.ceil(r / 1000); out.textContent = r > 0 ? `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, "0")} s` : "Temps écoulé : petite pause méritée.";
    if (timerState.running && r <= 0) { timerState.running = false; timerState.paused = 0; btn.textContent = "Lancer"; bip(); }
    raf = requestAnimationFrame(draw);
  }
  const setDur = () => { const m = parseInt(getChips("tdur")[0] || "10", 10); timerState = { total: m * 60000, paused: m * 60000, running: false, end: 0 }; btn.textContent = "Lancer"; };
  document.querySelectorAll('.chips[data-name="tdur"] .chip').forEach(b => b.addEventListener("picked", setDur));
  btn.textContent = timerState.running ? "Pause" : "Lancer";
  btn.onclick = () => {
    if (timerState.running) { timerState.paused = remaining(); timerState.running = false; btn.textContent = "Reprendre"; }
    else { if (timerState.paused <= 0) timerState.paused = timerState.total; timerState.end = Date.now() + timerState.paused; timerState.running = true; btn.textContent = "Pause"; }
  };
  document.getElementById("treset").onclick = setDur;
  draw();
  cleanup = () => { alive = false; cancelAnimationFrame(raf); };
}
function bip() {
  try { const A = new (window.AudioContext || window.webkitAudioContext)(); [0, 0.35].forEach(d => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = 660; g.gain.setValueAtTime(0.0001, A.currentTime + d); g.gain.exponentialRampToValueAtTime(0.2, A.currentTime + d + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, A.currentTime + d + 0.3); o.connect(g); g.connect(A.destination); o.start(A.currentTime + d); o.stop(A.currentTime + d + 0.32); }); } catch (e) {}
}

    const list = p.all ? S.entries.filter(e => Date.now() - new Date(e.t) < 30 * 864e5) : unsent();
    prep.onclick = async () => {
      prep.disabled = true; prep.textContent = canDirect() && !p.manual ? "Envoi…" : "Chiffrement…";
      if (canDirect() && !p.manual) {
        if (p.all) list.forEach(e => { e.sent = false; });
        const ok = await sendEntries(list);
        if (ok) { go("envoi", { ok: true }); return; }
        document.getElementById("serr").textContent = "L'envoi n'a pas abouti. Vérifier la connexion internet, puis réessayer.";
        prep.disabled = false; prep.textContent = "Réessayer"; return;
      }
      try {
        const nophoto = list.some(e => e.photo === true);
        const payload = { v: 1, c: S.cfg.c, s: new Date().toISOString(), e: list.map(e => { const o = Object.assign({}, e); delete o.sent; return o; }) };
        const msg = await encryptForPractitioner(S.cfg.k, payload);
        go("envoi", { msg, nophoto, ids: list.map(e => e.id) });
      } catch (e) { prep.disabled = false; prep.textContent = "Réessayer"; }
    };
  }
};

/* Aide urgente */
SCREENS.aide = {
  html: () => {
    const tv = S && S.prefs ? S.prefs.tv : "tu";
    const t = (a, b) => tv === "vous" ? b : a;
    const nums = [
      ["3114", "Prévention du suicide", t("Si tu as des idées de suicide, ou si tu t'inquiètes pour quelqu'un. Gratuit, 24 h/24, 7 j/7.", "Si vous avez des idées de suicide, ou si vous vous inquiétez pour quelqu'un. Gratuit, 24 h/24, 7 j/7.")],
      ["119", "Allô Enfance en danger", t("Si un enfant ou un ado subit des violences, à la maison ou ailleurs. Tu peux appeler pour toi ou pour quelqu'un d'autre. Gratuit, 24 h/24.", "Si un enfant ou un adolescent subit des violences, à la maison ou ailleurs. Gratuit, 24 h/24, n'apparaît pas sur les factures.")],
      ["3919", "Violences Femmes Info", "Violences dans le couple ou dans la famille. Écoute anonyme et gratuite, 24 h/24."],
      ["15", "SAMU", "Urgence médicale."],
      ["17", "Police secours", "En cas de danger ou de violence en cours."],
      ["112", "Numéro d'urgence européen", "Depuis n'importe quel téléphone, partout en Europe."],
      ["114", "Urgences par SMS", "Pour les personnes sourdes, malentendantes ou qui ne peuvent pas parler."],
      ["0 800 235 236", "Fil Santé Jeunes", "Pour les 12-25 ans : écoute anonyme et gratuite, tous les jours."],
      ["09 69 325 900", "Anorexie Boulimie Info Écoute", "Troubles alimentaires : écoute par des professionnels, du lundi au vendredi de 16 h à 18 h. Prix d'un appel local."]
    ];
    return `${S && S.cfg ? back() : back("home", "Retour")}<div class="stack">
      <div class="help-hero"><h1>${t("Tu as besoin d'aide maintenant ?", "Vous avez besoin d'aide maintenant ?")}</h1>
        <p><b>${t("Si tu es en danger immédiat, appelle le 15 ou le 112.", "En cas de danger immédiat, appelez le 15 ou le 112.")}</b></p>
        <p>${t("Cette application n'est pas surveillée en continu : ta psychologue ne voit tes réponses qu'au moment où elle les reçoit.", "Cette application n'est pas surveillée en continu : votre psychologue ne voit vos réponses qu'au moment où elle les reçoit.")}</p></div>
      ${S && S.cfg && (S.cfg.m || []).includes("angoisse") ? `<button class="btn wide" data-go="angoisse">${t("Je fais une crise d'angoisse", "Je fais une crise d'angoisse")}</button>` : ""}
      <div class="numbers">${nums.map(([n, w, d]) => `<div class="num-card"><a class="n no-lis" href="tel:${n.replace(/\s/g, "")}">${n}</a><span class="w">${w}</span><span class="d">${d}</span></div>`).join("")}</div>
      <p class="hint">Toucher un numéro pour appeler depuis un téléphone.</p></div>`;
  }
};

/* Réglages */
SCREENS.reglages = {
  html(p) {
    const pr = S.prefs;
    if (p.confirm) return `${back("reglages", "Réglages")}<div class="stack"><div class="help-hero"><h1>Tout effacer ?</h1>
      <p>Toutes les réponses enregistrées sur cet appareil seront supprimées, y compris celles qui n'ont pas été envoyées. Il faudra un nouveau code d'activation.</p></div>
      <button class="btn help wide" id="wipe">Oui, tout effacer</button><button class="btn ghost wide" data-go="reglages">Annuler</button></div>`;
    return `${back()}<div class="stack"><div class="screen-head"><h1>Réglages</h1></div>
      <div class="card"><h3>Lecture</h3>
        <div class="toggle"><span>Lecture adaptée (dyslexie)<br><span class="hint">Police et espacements plus confortables</span></span><input type="checkbox" class="switch" id="oDys" ${pr.dys ? "checked" : ""}></div>
        <div class="toggle"><span>Syllabes en deux couleurs</span><input type="checkbox" class="switch" id="oSyl" ${pr.syl ? "checked" : ""}></div>
        <div class="toggle"><span>Lettres muettes en rouge</span><input type="checkbox" class="switch" id="oMuet" ${pr.muet ? "checked" : ""}></div>
        <div class="toggle"><span>Taille du texte</span><span class="row"><button class="btn soft" id="sMinus" aria-label="Plus petit">A −</button><button class="btn soft" id="sPlus" aria-label="Plus grand">A +</button></span></div>
        <p class="hint">Le découpage en syllabes est automatique : il peut contenir quelques erreurs.</p></div>
      <div class="card"><h3>L'application ${T("me dit", "me dit")}</h3>
        <div class="chips" data-name="tv" data-multi="0" style="margin-top:10px">
          <button class="chip" data-v="tu" aria-pressed="${pr.tv === "tu"}">« tu »</button><button class="chip" data-v="vous" aria-pressed="${pr.tv === "vous"}">« vous »</button></div></div>
      <div class="card stack" id="diagCard"><h3>Liaison avec la psychologue</h3>
        <p class="small">${S.cfg.c === DEMO_CODE ? "Mode démonstration : aucun envoi." : RELAIS ? "Application reliée au relais. " + (S.lastOk ? "Dernier envoi réussi : " + new Date(S.lastOk).toLocaleString("fr-FR") + "." : "Aucun envoi réussi pour l'instant.") : "<b>Non reliée</b> : l'adresse du relais est absente du fichier config.js du site."}</p>
        ${S.lastErr ? `<p class="notice small">Dernière erreur (${new Date(S.lastErr.t).toLocaleString("fr-FR")}) : ${esc(S.lastErr.m)}</p>` : ""}
        <p class="small muted">${unsent().length} réponse(s) en attente d'envoi.</p>
        ${RELAIS && S.cfg.c !== DEMO_CODE ? `<button class="btn soft" id="diag">Vérifier la liaison</button><div id="diagOut" class="stack"></div>` : ""}</div>
      <div class="card stack"><h3>Mes exercices</h3>
        <p class="small muted">${canDirect() ? T("Tes exercices se mettent à jour tout seuls quand ta psychologue les change.", "Vos exercices se mettent à jour automatiquement quand votre psychologue les modifie.") : "Mise à jour automatique indisponible en démonstration."}</p>
        ${canDirect() ? `<button class="btn soft" id="upd">Mettre à jour maintenant</button><p class="hint" id="actMsg" role="status"></p>` : ""}
        <button class="link" data-go="installer">Installer l'application sur l'écran d'accueil</button></div>
      <div class="card stack"><h3>Mon code</h3><p><span class="code-chip no-lis">${esc(S.cfg.c)}</span></p>
        <p class="small muted">Ce code ne permet pas ${T("de te reconnaître", "de vous reconnaître")}. Les réponses envoyées depuis plus de 60 jours sont effacées automatiquement de cet appareil.</p>
        <button class="btn ghost" data-go="reglages" data-p='{"confirm":true}'>Effacer toutes mes données</button></div></div>`;
  },
  mount(p) {
    if (p.diag) { const dc = document.getElementById("diagCard"); if (dc) setTimeout(() => dc.scrollIntoView(), 0); }
    if (p.confirm) { document.getElementById("wipe").onclick = () => { lsDel(KEY); S = null; go("activation"); }; return; }
    const pr = S.prefs;
    const bind = (id, k) => document.getElementById(id).onchange = e => { pr[k] = e.target.checked; save(); render(); };
    bind("oDys", "dys"); bind("oSyl", "syl"); bind("oMuet", "muet");
    const set = d => { pr.size = Math.min(1.5, Math.max(0.9, Math.round((pr.size + d) * 10) / 10)); save(); applyPrefs(); };
    document.getElementById("sMinus").onclick = () => set(-0.1);
    document.getElementById("sPlus").onclick = () => set(0.1);
    document.querySelectorAll('.chips[data-name="tv"] .chip').forEach(b => b.addEventListener("picked", () => { pr.tv = b.dataset.v; save(); render(); }));
    const dg = document.getElementById("diag");
    if (dg) dg.onclick = async () => {
      const out = document.getElementById("diagOut"), line = (ok, t) => `<p class="small">${ok ? "✔" : "✖"} ${t}</p>`;
      dg.disabled = true; out.innerHTML = `<p class="small">Vérification…</p>`; let html = "";
      try {
        const r = await relay(RELAIS, { a: "cfg", code: S.cfg.c });
        html += line(true, "Le relais répond.");
        html += r.ok ? line(true, `Le code ${esc(spacedCode(S.cfg.c))} est reconnu.`) : line(false, `Le code ${esc(spacedCode(S.cfg.c))} est inconnu du relais : prévenir la psychologue.`);
        if (r.ok && r.pub !== S.cfg.k) { S.cfg.k = r.pub; save(); html += line(true, "Clé de chiffrement mise à jour."); }
        if (r.ok && unsent().length) { const ok = await sendEntries(unsent()); html += ok ? line(true, "Réponses en attente envoyées.") : line(false, "Envoi impossible : " + esc((S.lastErr && S.lastErr.m) || "")); }
      } catch (e) { html += line(false, esc(e.detail || "Relais injoignable.")); }
      out.innerHTML = html; dg.disabled = false;
    };
    const upd = document.getElementById("upd");
    if (upd) upd.onclick = async () => { const m = document.getElementById("actMsg"); m.textContent = "Mise à jour…"; m.textContent = (await refreshCfg()) ? "Exercices à jour." : "Pas de connexion, réessayer plus tard."; };
  }
};

/* Démarrage */
purgeOld(); if (S) save();
render();
refreshCfg().then(() => { if (S && canDirect() && unsent().length) sendEntries(unsent()).then(() => { if (view.name === "home") render(); }); });
window.addEventListener("online", () => { refreshCfg(); if (S && canDirect() && unsent().length) sendEntries(unsent()); });
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body></html>
